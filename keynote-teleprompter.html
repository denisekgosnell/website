"],["value"],["participate"]]},{"label":"Henry Ford paid good wages because selling more cars meant more people with the wherewithal to buy them","keys":[["henry ford"],["wage"],["cars"],["wherewithal"],["buy"]]},{"label":"This tension demands we acknowledge the responsibility that comes with the benefits; responsible leaders want AI investment to leave communities stronger; a virtuous cycle for the business","keys":[["responsibility"],["benefits"],["responsible"],["stronger"],["virtuous cycle"]]},{"label":"Pathways into new kinds of work rather than importing talent; help local businesses adopt AI rather than only the largest capturing the productivity gains","keys":[["pathways"],["importing talent"],["local businesses"],["adopt"],["largest companies"],["productivity gains"]]},{"label":"Partner with schools, universities, and workforce programs so capabilities created locally remain local","keys":[["schools"],["universities"],["workforce programs"],["remain local"]]},{"label":"And yes, pay attention to infrastructure","keys":[["infrastructure"],["attention"]]},{"label":"For many people the data center is the first part of the AI economy they can actually see; the model is abstract, the algorithm invisible, the building at the edge of town is concrete","keys":[["data center"],["first part"],["ai economy"],["abstract"],["invisible"],["edge of town"],["concrete"]]}],"title":"Fundamental business questions: Henry Ford and local pathways"},{"section":4,"paragraphs":["A data center can expand the tax base, support construction, strengthen infrastructure, and connect a region to one of the most important technological transformations of our time.","It can also draw enormous amounts of electricity, occupy land, use water, create noise, and require significant public investment.","Residents may reasonably ask whether the long-term benefits will match the commitments their community is being asked to make. They are not necessarily rejecting progress. They are asking what progress will mean for them.","The answer is not to stop building. It is to build in a way that earns and sustains community support and trust. That means listening before the major decisions have already been made. It means being candid about costs as well as benefits. It means investing in the infrastructure a project requires rather than quietly shifting those burdens onto everyone else.","And it means asking what else we can build."],"id":24,"words":150,"beats":[{"label":"A data center can expand the tax base, support construction, strengthen infrastructure, and connect a region to one of the most important transformations of our time","keys":[["tax base"],["construction"],["infrastructure"],["region"],["transformations"]]},{"label":"It can also draw enormous electricity, occupy land, use water, create noise, and require significant public investment","keys":[["electricity"],["occupy land"],["water"],["noise"],["public investment"]]},{"label":"Residents reasonably ask whether long-term benefits match the commitments asked of their community; not rejecting progress, asking what progress will mean for them","keys":[["residents"],["long-term"],["commitments"],["rejecting progress"],["mean for them"]]},{"label":"The answer isn't to stop building; build in a way that earns and sustains community support and trust","keys":[["stop building"],["earns"],["sustains"],["support"],["trust"]]},{"label":"Listen before the major decisions are made; be candid about costs as well as benefits; invest in the infrastructure a project requires rather than quietly shifting burdens onto everyone else","keys":[["listening"],["major decisions"],["candid"],["costs"],["investing"],["quietly shifting"],["burdens"]]},{"label":"And it means asking what else we can build","keys":[["what else"],["build"]]}],"title":"What a data center brings and costs; build to earn trust"},{"section":4,"paragraphs":["Dr. Katie Schuman and I were doing our PhD research at the University of Tennessee at the same time. I left for Silicon Valley. Dr. Schuman stayed and became one of the leading neuromorphic-computing researchers in the world.","Neuromorphic computing uses chips designed more like a brain than a conventional processor. For our purposes today, the essential point is power: certain learning tasks can be performed using a fraction of the energy required by standard approaches.","I toured Dr. Schuman’s lab. Her summer research students demonstrated chips learning the classic pole-balancing problem. Using less than 10% of the energy required using today’s GPUs. I watched a different computing future take shape on a sliver of the power—right here in Tennessee.","Then they handed me a tray of the early chips.","And I dropped them.","My stomach fell through the floor. I thought I had just dropped millions of dollars of research.","The students looked at me and said, “Oh, don’t worry. Those are from years ago. We’re already generations past those. We wouldn’t hand you one of the new ones.”","Which made me feel better and worse at exactly the same time.","But those chips represented something important."],"id":25,"words":198,"beats":[{"label":"Dr. Katie Schuman and I did our PhD research at UT at the same time; I left for Silicon Valley; she stayed and became a leading neuromorphic-computing researcher","keys":[["schuman","schumann","shuman"],["phd"],["silicon valley"],["stayed"],["neuromorphic","neuro morphic"],["researchers"]]},{"label":"Neuromorphic chips are designed more like a brain than a conventional processor","keys":[["chips"],["brain"],["conventional processor"]]},{"label":"The essential point is power: certain learning tasks use a fraction of the energy of standard approaches","keys":[["power"],["learning tasks"],["fraction"],["energy"],["standard approaches"]]},{"label":"In her lab, summer students showed chips learning pole-balancing using under 10% of the energy of today's GPUs; a different computing future on a sliver of the power, right here in Tennessee","keys":[["lab"],["summer"],["students"],["pole-balancing"],["10 percent"],["gpus","gpu"],["sliver"],["tennessee"]]},{"label":"Then they handed me a tray of the early chips, and I dropped them","keys":[["tray"],["early chips"],["dropped"]]},{"label":"My stomach fell through the floor; I thought I'd dropped millions of dollars of research","keys":[["stomach"],["floor"],["millions of dollars"],["research"]]},{"label":"The students: \"Don't worry, those are from years ago, we're generations past those, we wouldn't hand you one of the new ones\"","keys":[["don't worry"],["years ago"],["generations"],["new ones"]]},{"label":"Better and worse at exactly the same time; but those chips represented something important","keys":[["better"],["worse"],["same time"],["represented"],["important"]]}],"title":"Katie Schuman's neuromorphic chips, and the tray I dropped"},{"section":4,"paragraphs":["We sometimes talk about the demands created by AI as if they are simply the unavoidable price of progress.","They are not.","They are shaped by decisions: what we fund, what we build, which technical approaches we pursue, and whose needs we consider along the way.","We can invest in more efficient architectures. We can support local research. We can build smaller and more specialized models. We can prepare local workers and businesses to participate. We can ensure that new infrastructure strengthens the systems communities will continue relying on long after construction is complete.","The leadership responsibility inside this tension is not to choose between innovation and community.","It is to connect them.","Which gives us the second question to carry. Who benefits, and who pays? Ask it of every building, every contract, and every announcement.","The strongest AI investments will not simply be located in a community. They will expand what that community is capable of doing.","They will create opportunities that last beyond the initial construction project or corporate announcement. They will help more local businesses compete, more workers develop valuable skills, and more people see a place for themselves in the future being built around them.","That is not charity.","It is stewardship. It is good business. It is opening doors for communities. And it is how economic growth becomes durable community prosperity.","[~35 min]"],"id":26,"words":226,"beats":[{"label":"We talk about the demands of AI as the unavoidable price of progress; they are not","keys":[["demands"],["unavoidable"],["price of progress"],["they are not"]]},{"label":"They are shaped by decisions: what we fund, what we build, which technical approaches we pursue, whose needs we consider","keys":[["shaped by decisions"],["fund"],["build"],["technical approaches"],["whose needs"]]},{"label":"Invest in efficient architectures, support local research, build smaller specialized models, prepare local workers and businesses to participate, ensure infrastructure strengthens the systems communities rely on after construction","keys":[["efficient architectures"],["local research"],["smaller"],["specialized models"],["local workers"],["participate"],["strengthens"],["construction"]]},{"label":"The leadership responsibility isn't to choose between innovation and community; it is to connect them","keys":[["leadership responsibility"],["innovation"],["community"],["connect them"]]},{"label":"The second question to carry: who benefits, and who pays? Ask it of every building, every contract, and every announcement","keys":[["second question"],["who benefits"],["who pays"],["every building"],["contract"],["announcement"]]},{"label":"The strongest AI investments won't simply be located in a community; they'll expand what it's capable of","keys":[["strongest"],["located"],["expand"],["capable"]]},{"label":"Opportunities that last beyond the construction project or corporate announcement: local businesses compete, workers gain valuable skills, people see a place for themselves in the future","keys":[["last beyond"],["construction project"],["corporate announcement"],["compete"],["valuable skills"],["place for themselves"]]},{"label":"Not charity: stewardship, good business, opening doors for communities; how economic growth becomes durable community prosperity","keys":[["charity"],["stewardship"],["good business"],["opening doors"],["durable"],["prosperity"]]}],"title":"Demands shaped by decisions; connect innovation and community"},{"section":5,"paragraphs":["And that brings us to the third great tension: control.","Who gets to build with AI? Who gets to inspect it, question it, adapt it, and decide how it is used? And who retains agency over the parts of their lives that AI increasingly touches?","This tension can be narrow.","Will AI democratize software development, allowing far more people to build tools and solve problems more easily and more effectively than before?","Or will the essential technology be controlled by a handful of companies, with everyone else renting access on terms they did not set, having to forfeit their data, their privacy, their deeply personal thoughts?","[ZUCK QUOTE]","“You’re going to get a handful of companies that run these closed models that are going to be in control of the APIs and therefore able to tell you what you can build.”","But the tension can also be much wider.","Will AI give individuals more control over their time, knowledge, work, and choices? In short, will AI give people more control over their own lives?","Or will it give institutions more power to monitor people, predict them, influence them, and make decisions about them?","[ALTMAN QUOTE]","“Altman: \"We see a future where intelligence is a utility, like electricity or water, and people buy it from us on a meter.\"","Believe me, I’m not an alarmist, but this kind of quote should give most sane people pause. Pause to think about our approach to AI.","Is it opening doors or closing them?"],"id":27,"words":246,"beats":[{"label":"The third great tension: control","keys":[["third great tension"],["control"]]},{"label":"Who gets to build with AI, inspect it, question it, adapt it, decide how it's used, and who retains agency over their lives?","keys":[["build"],["inspect"],["question"],["adapt"],["agency"]]},{"label":"The narrow version: will AI democratize software development so far more people can build tools and solve problems?","keys":[["narrow"],["democratize"],["software development"],["more people"],["solve problems"]]},{"label":"Or a handful of companies controlling it, everyone else renting access on terms they didn't set, forfeiting their data, privacy, and personal thoughts?","keys":[["handful of companies"],["renting access"],["terms"],["forfeit"],["privacy"],["personal thoughts"]]},{"label":"The Zuckerberg warning: a handful of companies running closed models, in control of the APIs, able to tell you what you can build","keys":[["closed models"],["apis"],["tell you what you can build"]]},{"label":"The wider version: will AI give individuals more control over their time, knowledge, work, choices, their own lives?","keys":[["wider"],["individuals"],["control"],["time"],["knowledge"],["choices"],["own lives"]]},{"label":"Or give institutions more power to monitor people, predict them, influence them, and make decisions about them?","keys":[["institutions"],["monitor"],["predict"],["influence"],["decisions"]]},{"label":"The Altman quote: intelligence as a utility, like electricity or water, bought from us on a meter","keys":[["altman"],["utility"],["electricity"],["water"],["meter"]]},{"label":"I'm not an alarmist, but that kind of quote should give sane people pause; pause to think about our approach to AI","keys":[["alarmist"],["sane"],["pause"],["approach"]]},{"label":"Is it opening doors or closing them?","keys":[["opening doors"],["closing"]]}],"title":"Control: the narrow and wide questions, and the Altman quote"},{"section":5,"paragraphs":["Here’s the part where I get to talk about what really gets me excited: Open Source.","The architecture of a technology helps determine the distribution of power around it. I have spent a significant part of my career in open source technology.","Open source does not mean that everything must be free. And it does not mean that anyone can wander in, change the code, and instantly push that change out to everyone who depends on it.","What it does mean is that the underlying code can be examined, tested, challenged, improved, and adapted. More people can understand the foundations on which they depend. They can identify weaknesses, question assumptions, modify a tool for their own needs, and create things the people at the center never anticipated.","On the flip side, closed is not a synonym for “bad.”","Closed systems can offer real benefits: integration, consistency, technical support, simplicity, and clearer lines of accountability.","Anyone who is an Apple user knows what I’m talking about. Apple controls the entire experience, and much of the time, that is precisely why the experience works so well. It’s a beautiful walled garden on the inside. If you’re into that sorta thing.","The risk calculus changes, however, when the closed system is not simply operating our phone or laptop, but increasingly mediating how we understand the world and make decisions within it.","That is why concentration is not neutral."],"id":28,"words":235,"beats":[{"label":"The part where I get to talk about what really excites me: open source","keys":[["excited"],["open source"]]},{"label":"The architecture of a technology helps determine the distribution of power around it; a big part of my career has been open source","keys":[["architecture"],["distribution of power"],["career"],["open source"]]},{"label":"Open source doesn't mean everything is free, or that anyone can wander in, change the code, and instantly push it to everyone who depends on it","keys":[["free"],["wander in"],["change the code"],["push"],["depends"]]},{"label":"It means the code can be examined, tested, challenged, improved, adapted; people understand their foundations, find weaknesses, question assumptions, modify tools, create what the center never anticipated","keys":[["examined"],["tested"],["challenged"],["improved"],["adapted"],["foundations"],["weaknesses"],["assumptions"],["modify"],["anticipated"]]},{"label":"On the flip side, closed is not a synonym for bad","keys":[["flip side"],["closed"],["synonym"],["bad"]]},{"label":"Closed systems offer integration, consistency, technical support, simplicity, clearer lines of accountability","keys":[["integration"],["consistency"],["technical support"],["simplicity"],["accountability"]]},{"label":"Apple users know: Apple controls the entire experience, and that's often precisely why it works so well; a beautiful walled garden, if you're into that sorta thing","keys":[["apple"],["entire experience"],["works so well"],["walled garden"],["sorta thing"]]},{"label":"The risk calculus changes when the closed system isn't just operating our phone or laptop but mediating how we understand the world and make decisions in it","keys":[["risk calculus"],["phone"],["laptop"],["mediating"],["understand the world"],["decisions"]]},{"label":"That is why concentration is not neutral","keys":[["concentration"],["neutral"]]}],"title":"Open source explained; closed is not bad; concentration is not neutral"},{"section":5,"paragraphs":["And if AI were just another tool sitting at the edge of our lives, it wouldn’t matter. But increasingly, AI is becoming an intermediary—not just between us and information, like Google. But between us and how that information is leveraged at the individual and societal levels. Google often got in trouble in the EU for what was effectively a monopoly on the distribution of (and therefore access to) information.","This is that, on steroids.","We ask AI in chat what is true. We ask AI what matters. We ask it to summarize arguments, evaluate choices, recommend actions, organize our work, draft our words—how much of this keynote do you think I wrote and how much is sitting in OpenAI’s data centers?","And increasingly, we ask AI to act on our behalf.","That can be extraordinarily empowering. Remember J’s charity golf app she built on Loveable?","AI can give a person access to knowledge that once required years of specialized education. It can help someone interrogate an unfamiliar subject, compare competing claims, identify gaps in an argument, or reason through a problem from multiple perspectives. It can allow people to create software, analyze data, understand a medical document, prepare for an important conversation, or navigate a complicated institution that previously felt inaccessible.","Used well, AI can increase our capacity to think and act.","It can give people more command over their time, more confidence in their choices, and more ability to solve the problems directly in front of them."],"id":29,"words":248,"beats":[{"label":"If AI were just a tool at the edge of our lives it wouldn't matter; but it's becoming an intermediary, not just between us and information like Google, but between us and how information is leveraged","keys":[["edge of our lives"],["wouldn't matter"],["intermediary"],["information"],["google"],["leveraged"]]},{"label":"Google got in trouble in the EU for what was effectively a monopoly on the distribution of information; this is that, on steroids","keys":[["eu"],["monopoly"],["distribution"],["steroids"]]},{"label":"We ask AI what is true and what matters; to summarize, evaluate, recommend, organize, draft; how much of this keynote did I write versus OpenAI's data centers?","keys":[["what is true"],["matters"],["summarize"],["evaluate"],["recommend"],["draft"],["keynote"],["openai","open ai"]]},{"label":"And increasingly we ask AI to act on our behalf","keys":[["act on our behalf"]]},{"label":"That can be extraordinarily empowering; remember J's charity golf app built on Loveable?","keys":[["empowering"],["charity golf","jay"],["loveable","lovable"]]},{"label":"Access to knowledge that once required years of specialized education: interrogate a subject, compare claims, find gaps in an argument, reason from multiple perspectives","keys":[["knowledge"],["specialized education"],["interrogate"],["compare"],["gaps"],["perspectives"]]},{"label":"Create software, analyze data, understand a medical document, prepare for an important conversation, navigate an institution that felt inaccessible","keys":[["create software"],["analyze data"],["medical document"],["conversation"],["institution"],["inaccessible"]]},{"label":"Used well, AI increases our capacity to think and act: more command over our time, more confidence in our choices, more ability to solve what's in front of us","keys":[["capacity"],["think and act"],["command"],["confidence"],["solve"]]}],"title":"AI as intermediary: Google on steroids, and the empowering side"},{"section":5,"paragraphs":["But the same technology can also weaken the very capabilities it appears to expand.","If we routinely ask AI what to think before we have tried to think, we risk outsourcing more than a task. We risk outsourcing the struggle through which judgment develops.","Analytical cognition is not simply the production of an answer. It is the process of examining evidence, tolerating uncertainty, recognizing assumptions, changing our minds, and understanding why we believe what we believe.","AI can strengthen that process by challenging us, extending us, and helping us see what we missed.","Or it can short-circuit the process by giving us an answer that sounds complete before our own thinking has begun.","[RESEARCH FROM RAVEN, IF IT’S BEEN RELEASED]","And once again, convenience can conceal a transfer of control.","If a system chooses which sources to summarize, which arguments to emphasize, which options to present, and which conclusions appear reasonable, then it is helping shape our understanding of the world—even when it feels as though it is merely helping us save time.","That does not mean we should reject AI assistance, much less AI in general. It means we need to remain conscious of what we are delegating. Are we asking AI to help us reason or asking it to reason for us? Are we using it to expand our choices or allowing it to narrow them without our awareness? Are we gaining greater control over our lives or becoming more dependent on systems we cannot understand, challenge, or leave?","This is the tension."],"id":30,"words":248,"beats":[{"label":"But the same technology can weaken the very capabilities it appears to expand","keys":[["weaken"],["capabilities"],["expand"]]},{"label":"If we ask AI what to think before we've tried to think, we outsource more than a task: the struggle through which judgment develops","keys":[["what to think"],["outsourcing"],["struggle"],["judgment"]]},{"label":"Analytical cognition isn't just producing an answer: examining evidence, tolerating uncertainty, recognizing assumptions, changing our minds, understanding why we believe what we believe","keys":[["analytical cognition"],["evidence"],["uncertainty"],["assumptions"],["changing our minds"],["believe"]]},{"label":"AI can strengthen that by challenging and extending us, or short-circuit it with an answer that sounds complete before our own thinking has begun","keys":[["strengthen"],["challenging"],["extending"],["short-circuit"],["sounds complete"],["begun"]]},{"label":"Once again, convenience can conceal a transfer of control","keys":[["convenience"],["conceal"],["transfer of control"]]},{"label":"If a system chooses which sources, arguments, options, and conclusions appear reasonable, it shapes our understanding of the world even when it feels like it's merely saving us time","keys":[["sources"],["arguments"],["options"],["conclusions"],["understanding"],["save time"]]},{"label":"Not a reason to reject AI, but to stay conscious of what we're delegating: help us reason or reason for us? expand our choices or narrow them? gaining control or growing dependent? this is the tension","keys":[["reject"],["conscious"],["delegating"],["reason for us"],["expand"],["narrow"],["dependent"],["tension"]]}],"title":"Outsourcing the struggle: convenience conceals a transfer of control"},{"section":5,"paragraphs":["Open source is one response to that tension. It is not the only response, but it is a response I happen to love that you also touch daily, so I couldn’t stand in front of a room full of leaders and not plant that flag.","Open source, open access, or a well-governed proprietary approach—all can work, as long as they guarantee some fundamentals.","Privacy protections matter. Transparency matters. Competition and interoperability matter. The ability to move and retain control over our own data and our work matter.","None of these is the ultimate objective, but they are a means to that end.","Where the objective at the end is agency.","You know when you download an app, you have to read all those terms and conditions, then check a box saying you agreed to the 115 pages of terms and conditions which you definitely read all of before clicking that you agree.","Raise your hand if you have ever, before clicking that box, successfully called Google, or Apple, or Meta to negotiate the terms of that agreement? No one? No one’s negotiated how they can access, store, and share your data?","This is a room full of leaders accustomed to making decisions, negotiating contracts, and calling the shots. But in that moment, none of us had any real agency. We could accept the terms, or we could walk away from a tool that may have become nearly essential to modern life.","That is not meaningful choice. It is permission granted on someone else’s terms."],"id":31,"words":254,"beats":[{"label":"Open source is one response to that tension, not the only one, but one I love and you touch daily, so I couldn't stand here and not plant that flag","keys":[["open source"],["response"],["love"],["touch daily"],["plant that flag"]]},{"label":"Open source, open access, or a well-governed proprietary approach can all work, as long as they guarantee some fundamentals","keys":[["open access"],["well-governed"],["proprietary"],["fundamentals"]]},{"label":"Privacy, transparency, competition and interoperability, control over our own data and work; means to an end, and the end is agency","keys":[["privacy"],["transparency"],["competition"],["interoperability"],["our own data"],["objective"],["means"],["agency"]]},{"label":"Downloading an app: 115 pages of terms and conditions which you definitely read all of before clicking agree","keys":[["download"],["115"],["terms and conditions"],["definitely read"],["agree"]]},{"label":"Raise your hand if you've ever called Google, Apple, or Meta to negotiate those terms; no one?","keys":[["raise your hand"],["google"],["apple"],["meta"],["negotiate"],["no one"]]},{"label":"A room of leaders who make decisions, negotiate contracts, and call the shots had no real agency: accept the terms or walk away from a nearly essential tool","keys":[["leaders"],["contracts"],["calling the shots"],["real agency"],["accept the terms"],["walk away"],["essential"]]},{"label":"That is not meaningful choice; it is permission granted on someone else's terms","keys":[["meaningful choice"],["permission"],["someone else's terms"]]}],"title":"Open source as one response; the 115-page terms and conditions"},{"section":5,"paragraphs":["And sure, the end user terms for an app may be a relatively trivial example. But what if it weren’t just terms? What if it were a health care decision for a family member? Or a bank loan decision. Or how much you pay for a flight or a car or which restaurant serves the best bbq?","Agency means preserving the ability of people and institutions to participate in the future AI is creating, not merely to accept the version of that future handed to them. Can people understand the systems they depend on? Can they question a consequential decision? Can they protect their information? Can they choose another provider, another model, or another path? Can new builders enter and create something better?","And can society change course when a system no longer serves us?","That last question may be the most important. Because the greatest risk of concentrated control is not simply that the people in control will make bad decisions.","It is that their decisions become the boundaries within which everyone else must live, work, build, and think.","Most leaders in this room will not determine the global architecture of AI. There’s like a dozen people in that club, and we—every one of us—is on the outside looking in.","But every leader in this room will make choices that can open doors for others. Choices that either preserve agency for others or gradually close it off."],"id":32,"words":238,"beats":[{"label":"App terms are a trivial example; but what if it were a health care decision, a bank loan, the price of a flight or a car, or which restaurant serves the best bbq?","keys":[["trivial"],["health care"],["bank loan"],["flight"],["car"],["bbq"]]},{"label":"Agency means people and institutions can participate in the future AI is creating, not merely accept the version handed to them","keys":[["agency"],["participate"],["future"],["handed to them"]]},{"label":"Can people understand the systems they depend on, question a consequential decision, protect their information, choose another provider, model, or path, and can new builders create something better?","keys":[["understand the systems"],["question"],["protect"],["another provider"],["another model"],["new builders"]]},{"label":"And can society change course when a system no longer serves us?","keys":[["society"],["change course"],["serves us"]]},{"label":"That last question may matter most: the greatest risk of concentrated control isn't bad decisions; it's that their decisions become the boundaries everyone else must live, work, build, and think within","keys":[["most important"],["concentrated control"],["bad decisions"],["boundaries"],["live"],["work"],["build"],["think"]]},{"label":"Most leaders here won't determine the global architecture of AI; about a dozen people are in that club, and every one of us is on the outside looking in","keys":[["global architecture"],["dozen"],["club"],["outside looking in"]]},{"label":"But every leader here will make choices that can open doors for others, preserving agency or gradually closing it off","keys":[["every leader"],["choices"],["open doors"],["preserve agency"],["close it off"]]}],"title":"Agency: health care, bank loans, bbq, and the dozen people in the club"},{"section":5,"paragraphs":["When you introduce an AI system, will your employees be able to understand and question it? Will your customers retain meaningful control over their data? Will your organization remain free to change systems if the technology, the terms, or the leadership changes? Will people with new ideas have a genuine path to build upon what exists?","And will you use AI to strengthen the judgement of the people around you or simply to reduce the control they have over the judgements they get to make?","That is the leadership responsibility inside this duality.","And it gives you the third question. Who can understand and question this, and who can leave?","That is what openness means in this context. Not that every system must be open source or that nothing should be protected, but that our future must remain open to scrutiny, open to challenge, open to competition, and open to people who want to create a better alternative.","Closed systems may sometimes serve us well. A closed future will not.","AI can open extraordinary doors.","Our responsibility is to ensure that no company, institution, or individual becomes the only one holding the key.","[~50 min]"],"id":33,"words":193,"beats":[{"label":"When you introduce an AI system: can your employees understand and question it? do customers retain meaningful control over their data?","keys":[["introduce"],["employees"],["understand"],["question"],["customers"],["control over their data"]]},{"label":"Can your organization change systems if the technology, terms, or leadership change? do people with new ideas have a genuine path to build upon what exists?","keys":[["change systems"],["technology"],["terms"],["leadership"],["new ideas"],["genuine path"],["build upon"]]},{"label":"Will you use AI to strengthen the judgement of people around you, or to reduce the control they have over the judgements they get to make? that's the leadership responsibility in this duality","keys":[["strengthen"],["judgement"],["reduce the control"],["leadership responsibility"],["duality"]]},{"label":"The third question: who can understand and question this, and who can leave?","keys":[["third question"],["understand and question"],["who can leave"]]},{"label":"Openness here isn't every system open source or nothing protected; it's a future open to scrutiny, challenge, competition, and people who want to create a better alternative","keys":[["openness"],["open source"],["protected"],["scrutiny"],["challenge"],["competition"],["better alternative"]]},{"label":"Closed systems may sometimes serve us well; a closed future will not; AI can open extraordinary doors; no company, institution, or individual should be the only one holding the key","keys":[["closed systems"],["closed future"],["extraordinary doors"],["company"],["institution"],["individual"],["holding the key"]]}],"title":"Your choices: employees, customers, and who holds the key"},{"section":6,"paragraphs":["Now, you are leaders. In your community, at your company, in your industry. Every great leader in this room already knows that leading through change comes down to two things: strategy and execution. And they are equally important.","A strategy nobody can execute is a wish.","Execution without a strategy is just motion.","You are going to spend the rest of this summit on execution. The Future of Work session later today takes a deep dive into the jobs tension. The AI strategy session does the same for scaling beyond pilots, which is where your future gets decided. Go to them. Take notes. Steal shamelessly."],"id":34,"words":105,"beats":[{"label":"You are leaders in your community, at your company, in your industry","keys":[["leaders"],["community"],["company"],["industry"]]},{"label":"Leading through change comes down to two things, strategy and execution, and they are equally important","keys":[["leading through change"],["strategy"],["execution"],["equally important"]]},{"label":"A strategy nobody can execute is a wish","keys":[["strategy"],["execute"],["wish"]]},{"label":"Execution without a strategy is just motion","keys":[["execution"],["without"],["motion"]]},{"label":"You will spend the rest of the summit on execution: Future of Work on the jobs tension, AI strategy on scaling beyond pilots","keys":[["rest of this summit"],["future of work"],["jobs tension"],["ai strategy"],["scaling beyond pilots"]]},{"label":"Go to them, take notes, steal shamelessly","keys":[["go to them"],["take notes"],["steal shamelessly"]]}],"title":"Strategy and execution: a wish versus motion"},{"section":6,"paragraphs":["But underneath every one of those sessions is the same opportunity. Every one of us is introducing a new workflow, a new process, or a new idea into an organization full of people.","And we are doing it for good reason. We want to do what we do better and faster. More value. More opportunity.","But that also means every one of us in this room is a disruptor. We are causing change. And people do not like change. Change is hard. It is why \"change management\" is an entire field.","So as we all spend the next two days learning how to disrupt for good, I want to leave you with one framework. I learned it from the best in the world at solving invisible math puzzles."],"id":35,"words":128,"beats":[{"label":"Underneath every one of those sessions is the same opportunity: each of us is introducing a new workflow, process, or idea into an organization full of people","keys":[["underneath"],["same opportunity"],["new workflow"],["process"],["organization full of people"]]},{"label":"We do it for good reason: to do what we do better and faster, more value, more opportunity","keys":[["good reason"],["better and faster"],["more value"],["more opportunity"]]},{"label":"Which means every one of us is a disruptor; we are causing change","keys":[["disruptor"],["causing change"]]},{"label":"People do not like change; change is hard; it is why change management is an entire field","keys":[["do not like change"],["change is hard"],["change management"],["entire field"]]},{"label":"Over the next two days we learn how to disrupt for good; one framework, from the best in the world at solving invisible math puzzles","keys":[["next two days"],["disrupt for good"],["framework"],["invisible math puzzles"]]}],"title":"Every one of us in this room is a disruptor"},{"section":6,"paragraphs":["There is no better company at executing software than Amazon. Amazon has sixteen leadership principles. You do not need sixteen. One habit underlies how Amazon operates:","Writing is thinking.","Because you have to write, you have to think it through. Your goal. Your options. The case for your recommendation.","Good strategic thinking starts at the end. What is the outcome we are trying to achieve?","At Amazon, we took that to the extreme. We called it Working Backwards. Before we built a product, we wrote the press release for the finished thing. Then we wrote our way back from that announcement to the very first requirements. The whole plan existed on paper before anything existed in code."],"id":36,"words":117,"beats":[{"label":"No better company at executing software than Amazon; sixteen leadership principles, but you do not need sixteen","keys":[["amazon"],["executing software"],["sixteen"],["leadership principles"]]},{"label":"One habit underlies how Amazon operates: writing is thinking","keys":[["one habit"],["operates"],["writing is thinking"]]},{"label":"Because you have to write, you have to think it through: your goal, your options, the case for your recommendation","keys":[["have to write"],["think it through"],["goal"],["options"],["recommendation"]]},{"label":"Good strategic thinking starts at the end: what outcome are we trying to achieve?","keys":[["strategic thinking"],["starts at the end"],["outcome"],["achieve"]]},{"label":"At Amazon we took that to the extreme and called it Working Backwards","keys":[["extreme"],["working backwards"]]},{"label":"We wrote the press release for the finished thing first, then wrote back to the first requirements; the plan existed on paper before anything existed in code","keys":[["press release"],["finished thing"],["requirements"],["on paper"],["in code"]]}],"title":"Writing is thinking, and Working Backwards"},{"section":6,"paragraphs":["But here is the real trick. It was never about the documents themselves. Finance, engineering, marketing, legal, operations, every function with its own needs and skills, all worked from the same small set of core pages. One set of pages. Many readers. Everyone thinking together, everyone clear on what we were trying to accomplish.","So when it came time to execute, the strategy was already clear. Nobody had to hold the whole plan in their head. It was written down.","[SLIDE: documents drawn as circles, processes as X's, arrows connecting them]","That is the whole idea on one screen. Documents, the people who read them, and the handoffs between them.","[SLIDE: the same diagram redrawn as a football play]","And if that looks like a play chart, it is one. A quarterback does not walk to the line and describe the play in a paragraph. He calls a name everyone has already studied, and eleven people execute their piece at the same time. Which is why, if we are all going through this AI change together, maybe having Peyton Manning as mayor of Knoxville is not so bad after all."],"id":37,"words":170,"beats":[{"label":"Here is the real trick: it was never about the documents themselves","keys":[["real trick"],["never about"],["documents"]]},{"label":"Finance, engineering, marketing, legal, operations, every function worked from the same small set of core pages","keys":[["finance"],["engineering"],["marketing"],["legal"],["operations"],["core pages"]]},{"label":"One set of pages, many readers, everyone thinking together and clear on what we were trying to accomplish","keys":[["one set of pages"],["many readers"],["thinking together"],["accomplish"]]},{"label":"So when it came time to execute the strategy was already clear; nobody had to hold the whole plan in their head; it was written down","keys":[["time to execute"],["already clear"],["whole plan"],["written down"]]},{"label":"The whole idea on one screen: documents, the people who read them, and the handoffs between them","keys":[["one screen"],["documents"],["read them"],["handoffs"]]},{"label":"If it looks like a play chart, it is one: a quarterback calls a name everyone has already studied and eleven people execute at the same time","keys":[["play chart"],["quarterback"],["calls a name"],["eleven people"]]},{"label":"Which is why maybe Peyton Manning as mayor of Knoxville is not so bad after all","keys":[["peyton manning"],["mayor"],["knoxville"],["not so bad"]]}],"title":"The real trick: one set of pages, many readers"},{"section":6,"paragraphs":["And that is where we are today. The strategy is muddied. Not because people are careless, but because everything is so new and moving so fast that we cannot keep up. We are asking people to hold too much in their heads.","So here is the one thing to remember: agents are documents.","Strip away the hype, and a Claude agent is a file. A set of instructions, some context, and the output you want back. J's golf app. Joyce's scheduler. Karen's analytics cloud. Every one of them started as something written down. That is not magic. It is written down.","If you take the time to write your strategy and think it through, you already have the inputs you need to take advantage of AI to the fullest. The thinking is the work. The agents just read.","Every leader in this room is deciding what new process to introduce, and whether that process will scale knowledge or bottleneck it. You have to think. You have to write to think. And you have to agree, as a leadership team, on the handful of pages you will write, so that one page can send the whole team running.","I left Tennessee to learn how the best builders in the world build. This is the part I most wanted to bring home. Silicon Valley figured out how to solve invisible math puzzles this way. I want to see it built this way in this zip code. In 37996."],"id":38,"words":246,"beats":[{"label":"That is where we are today: the strategy is muddied, not because people are careless, but because everything is new and moving so fast we cannot keep up","keys":[["muddied"],["careless"],["moving so fast"],["keep up"]]},{"label":"We are asking people to hold too much in their heads","keys":[["hold too much"],["heads"]]},{"label":"The one thing to remember: agents are documents","keys":[["one thing to remember"],["agents are documents"]]},{"label":"Strip away the hype and a Claude agent is a file: instructions, context, and the output you want back","keys":[["strip away"],["hype"],["claude agent"],["file"],["instructions"],["context"],["output"]]},{"label":"J's golf app, Joyce's scheduler, Karen's analytics cloud: every one started as something written down","keys":[["golf app"],["scheduler"],["analytics cloud"],["written down"]]},{"label":"Write your strategy and think it through and you already have the inputs to use AI to the fullest; the thinking is the work, the agents just read","keys":[["inputs"],["fullest"],["thinking is the work"],["agents just read"]]},{"label":"Every leader is deciding whether a new process will scale knowledge or bottleneck it","keys":[["scale knowledge"],["bottleneck"]]},{"label":"Agree as a leadership team on the handful of pages you will write, so one page can send the whole team running","keys":[["leadership team"],["handful of pages"],["whole team running"]]},{"label":"I left Tennessee to learn how the best builders build; this is the part I most wanted to bring home; built this way in this zip code, 37996","keys":[["left tennessee"],["best builders"],["bring home"],["zip code"],["37996"]]}],"title":"Agents are documents, and 37996"},{"section":7,"paragraphs":["So as you write those documents, and as you build those agents, I want you to run one more review on every single one of them.","Call it the Door Test.","Before your next AI decision, whether it is a vendor contract, a data center, a reorg, or the first strategy page you write on Monday morning, ask one question: does this open a door for people, or does it just happen to them? Then check it three ways.","1. Who gets the tools, and who gets a path when their old one closes?","2. Who benefits, and who pays?","3. Who can understand and question this, and who can leave?","If you can answer all three, you are opening doors. If you cannot answer one of them, you have found the door that is quietly closing on someone.","That is the one document review Amazon never taught me. And it is the one I care about most.","Here is why."],"id":39,"words":158,"beats":[{"label":"As you write those documents and build those agents, run one more review on every single one of them","keys":[["write those documents"],["build those agents"],["one more review"]]},{"label":"Call it the Door Test","keys":[["door test"]]},{"label":"Before your next AI decision, a vendor contract, a data center, a reorg, or the first strategy page you write Monday morning","keys":[["vendor contract"],["data center"],["reorg"],["strategy page"],["monday morning"]]},{"label":"Ask one question: does this open a door for people, or does it just happen to them?","keys":[["one question"],["open a door"],["just happen to them"]]},{"label":"Then check it three ways: who gets the tools and who gets a path; who benefits and who pays; who can understand and question this, and who can leave","keys":[["three ways"],["who gets the tools"],["who benefits"],["who pays"],["understand and question"],["who can leave"]]},{"label":"Answer all three and you are opening doors; miss one and you have found the door quietly closing on someone","keys":[["all three"],["opening doors"],["cannot answer"],["quietly closing"]]},{"label":"That is the one document review Amazon never taught me, and the one I care about most","keys":[["document review"],["amazon"],["never taught me"],["care about most"]]}],"title":"The Door Test: one more review"},{"section":7,"paragraphs":["It isn't the chips. I'd still drop those anyway. It isn't the layoff numbers, or the record number of new businesses opening, or the potential jobs waiting to be created. It isn't even the inventions and new possibilities AI will unlock.","No.","I do what I do for the next kid who sees an open door, a door I helped open, and walks through. The kid who hugs me, lifts me off the ground, and tells me she found a new way to see the world. The kid who discovers an entire set of possibilities on the other side of a door she did not realize existed before.","Because for her, it didn't. Until it did. And all she needed was for someone to open the door and show her where it was.","That's it. That's the whole thing. I do what I do for the Micahs of the world. I would go so far as to say I exist to light somebody else's fire—and to help keep it burning.","That is my philosophical North Star. It is what gives me energy. It is what gives me purpose. And every one of the dualities we just walked through comes back to that same purpose."],"id":40,"words":204,"beats":[{"label":"It isn't the chips (I'd still drop those), the layoff numbers, the record new businesses, the jobs waiting to be created, or the inventions AI will unlock","keys":[["chips"],["drop those"],["layoff numbers"],["new businesses"],["inventions"]]},{"label":"I do what I do for the next kid who sees an open door, a door I helped open, and walks through","keys":[["next kid"],["open door"],["helped open"],["walks through"]]},{"label":"The kid who hugs me, lifts me off the ground, and tells me she found a new way to see the world","keys":[["hugs me"],["lifts me"],["new way to see the world"]]},{"label":"The kid who discovers an entire set of possibilities on the other side of a door she did not realize existed","keys":[["discovers"],["possibilities"],["other side"],["did not realize"]]},{"label":"For her it didn't, until it did; all she needed was someone to open the door and show her where it was","keys":[["until it did"],["someone"],["open the door"],["show her where it was"]]},{"label":"That's the whole thing: I do what I do for the Micahs of the world; I exist to light somebody else's fire and help keep it burning","keys":[["whole thing"],["micahs"],["light"],["fire"],["burning"]]},{"label":"That is my philosophical North Star: what gives me energy and purpose; every duality comes back to that same purpose","keys":[["north star"],["energy"],["purpose"],["same purpose"]]}],"title":"What lights me up: the Micahs of the world"},{"section":7,"paragraphs":["The jobs duality asks whether people whose paths are disappearing can see a path into what comes next.","The community duality asks whether AI investment leaves a place stronger than it found it.","And the control duality asks whether the future stays open at all, and whether anyone ends up the only one holding the key.","Different in scale. Same choice. Will AI happen TO people, or will we help people have agency in what happens next?"],"id":41,"words":77,"beats":[{"label":"The jobs duality asks whether people whose paths are disappearing can see a path into what comes next","keys":[["jobs duality"],["paths"],["disappearing"],["comes next"]]},{"label":"The community duality asks whether AI investment leaves a place stronger than it found it","keys":[["community duality"],["investment"],["stronger"],["found it"]]},{"label":"The control duality asks whether the future stays open at all, and whether anyone ends up the only one holding the key","keys":[["control duality"],["stays open"],["only one"],["holding the key"]]},{"label":"Different in scale, same choice: will AI happen TO people, or will we help people have agency in what happens next?","keys":[["different in scale"],["same choice"],["happen to people"],["agency"],["happens next"]]}],"title":"The three dualities, one choice"},{"section":7,"paragraphs":["The headlines want you to be afraid. And that fear is not unfounded. Change is hard. Fast change is unsettling. Fast change that affects individuals and society simultaneously, a mile wide and a mile deep, that is—if you genuinely pause and think what that means—in a word, terrifying.","But fear has a way of narrowing our field of vision. It makes us look for safety in certainty. It pushes us to pick a side: acceleration or obstruction, optimism or pessimism, opportunity or danger.","The Duality of AI demands something harder from us. It asks us to see both sides at once. To acknowledge the danger without surrendering the possibility. To pursue the possibility without pretending the danger is not real."],"id":42,"words":120,"beats":[{"label":"The headlines want you afraid; not unfounded: change is hard, fast change is unsettling; fast change hitting individuals and society at once, a mile wide and a mile deep, is, in a word, terrifying","keys":[["headlines"],["afraid"],["unfounded"],["fast change"],["unsettling"],["individuals and society"],["mile wide"],["mile deep"],["terrifying"]]},{"label":"Fear narrows our field of vision, seeks safety in certainty, pushes us to pick a side: acceleration or obstruction, optimism or pessimism, opportunity or danger","keys":[["narrowing"],["field of vision"],["safety in certainty"],["pick a side"],["acceleration"],["obstruction"],["optimism"],["pessimism"],["danger"]]},{"label":"The Duality of AI demands something harder: see both sides at once; acknowledge the danger without surrendering the possibility; pursue the possibility without pretending the danger isn't real","keys":[["harder"],["both sides at once"],["acknowledge"],["surrendering"],["possibility"],["pretending"]]}],"title":"Fear narrows vision; see both sides at once"},{"section":7,"paragraphs":["We do not have to choose between a future in which AI succeeds and one in which people do. It does not have to be zero-sum. But the better future does not happen automatically. It will take the people in this room—the leaders of businesses, institutions, and communities—to make it happen.","Because you are already making the choices that will determine how AI is experienced. You decide whether a worker receives a tool or a pink slip and whether someone standing in front of a closing door has a supported path toward the next one.","You decide whether an investment merely occupies a community or becomes part of that community's future. You decide whether the systems you adopt give people greater capability and agency or quietly remove their ability to understand, question, and choose.","You will not control every force shaping the future of AI. But you can control whether the choices within your reach open doors or close them.","So run the Door Test. Does this open a door, or does it just happen to them? Who gets the tools. Who pays. Who can leave.","Micah walked through his door on his own. But first, somebody had to make it visible."],"id":43,"words":202,"beats":[{"label":"We don't have to choose between a future where AI succeeds and one where people do; it is not zero-sum; the better future does not happen automatically; it takes the people in this room","keys":[["zero-sum"],["automatically"],["people in this room"],["leaders"]]},{"label":"You're already making the choices that determine how AI is experienced: a worker gets a tool or a pink slip; someone at a closing door gets a supported path","keys":[["already making"],["experienced"],["tool"],["pink slip"],["supported path"]]},{"label":"Whether an investment merely occupies a community or becomes part of its future; whether the systems you adopt give people capability and agency or remove their ability to understand, question, and choose","keys":[["occupies"],["part of that community"],["capability"],["agency"],["understand"]]},{"label":"You will not control every force, but you can control whether the choices within your reach open doors or close them","keys":[["every force"],["within your reach"],["open doors"],["close them"]]},{"label":"So run the Door Test: does this open a door, or does it just happen to them? who gets the tools, who pays, who can leave","keys":[["run the door test"],["open a door"],["who gets the tools"],["who pays"],["who can leave"]]},{"label":"Micah walked through his door on his own, but first somebody had to make it visible","keys":[["micah"],["walked through"],["on his own"],["make it visible"]]}],"title":"You decide: run the Door Test"},{"section":7,"paragraphs":["So that is my challenge to you.","Do not let a month go by when you cannot say, \"I opened a door for someone.\" Every month, find your Micah.","Find the person with the problem but not the title. The person with the idea but not the technical vocabulary. The person whose old path is disappearing. The person who does not look like you, think like you, learn like you, or arrive by the path you did.","You do not have to determine their future for them. You do not have to carry them through the door. Just open the door and make it visible.","Give them the tools. Help them reach the threshold. And then let them surprise you.","We are all going to move through this AI moment differently. You, me, J, Dr. Berry. Everyone in this room.","But none of us is moving through it alone.","Our choices shape the paths available to other people. And every door we open expands what someone else can imagine, attempt, and become.","AI will open extraordinary doors. AI will close some, too.","The technology alone will not decide which side of that Duality defines this era.","We will.","So keep it human.","And hold the door open."],"id":44,"words":207,"beats":[{"label":"My challenge: don't let a month go by when you can't say \"I opened a door for someone\"; every month, find your Micah","keys":[["challenge"],["month"],["opened a door"],["find your micah"]]},{"label":"The person with the problem but not the title; the idea but not the technical vocabulary; whose old path is disappearing; who doesn't look, think, learn, or arrive by the path you did","keys":[["problem"],["title"],["idea"],["technical vocabulary"],["old path"],["disappearing"],["look like you"],["arrive"]]},{"label":"You don't have to determine their future or carry them through the door; just open it and make it visible; give them the tools, help them reach the threshold, then let them surprise you","keys":[["determine"],["carry"],["open the door"],["visible"],["tools"],["threshold"],["surprise"]]},{"label":"We'll all move through this AI moment differently: you, me, J, Dr. Berry, everyone in this room; but none of us is moving through it alone","keys":[["ai moment"],["differently"],["j","jay"],["berry"],["everyone in this room"],["alone"]]},{"label":"Our choices shape the paths available to other people; every door we open expands what someone else can imagine, attempt, and become","keys":[["choices"],["paths"],["door"],["imagine"],["attempt"],["become"]]},{"label":"AI will open extraordinary doors, and close some too; the technology alone won't decide which side of the duality defines this era; we will","keys":[["extraordinary doors"],["close some"],["technology alone"],["duality"],["era"],["we will"]]},{"label":"So keep it human, and hold the door open","keys":[["keep it human"],["hold the door open"]]}],"title":"The challenge: find your Micah, and hold the door open"}]};

    return w.toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]/g, '');

  function addWords(container, chunk) {
    var span = document.createElement('span');
    span.className = 'w';
    span.textContent = chunk;
    var parts = chunk.split(/[—–\-…]+|\.\.\./);
    var first = tokens.length;
    parts.forEach(function (p) {
      var n = normalize(p);
      if (n) tokens.push({ norm: n, raw: p, el: span, end: false });
    });
    if (tokens.length > first) {
      if (/[.?!…]["”’)]*$/.test(chunk)) tokens[tokens.length - 1].end = true;
      span.dataset.i = first;
    } else {
      span.className = 'w past';
    }
    container.appendChild(span);
    container.appendChild(document.createTextNode(' '));

  function addParagraph(container, line) {
    var t = line.trim();

      c.className = 'cue';

      container.appendChild(c);

    var p = document.createElement('p');
    p.className = 'p';
    t.split(/(\[[^\]]*\])/).forEach(function (seg) {
      if (!seg) return;

        var c = document.createElement('span');
        c.className = 'cue inline';

        p.appendChild(c);
        p.appendChild(document.createTextNode(' '));
      } else {
        seg.trim().split(/\s+/).forEach(function (chunk) { if (chunk) addWords(p, chunk); });
      }
    });
    container.appendChild(p);
  }
  DATA.sections.forEach(function (sec, si) {
    var h = document.createElement('div');
    h.className = 'cue part';
    h.textContent = sec.title;
    textEl.appendChild(h);
    DATA.cards.filter(function (c) { return c.section === si; }).forEach(function (card) {
      var wrap = document.createElement('div');
      wrap.className = 'card';
      var label = document.createElement('div');
      label.className = 'cue card';
      label.textContent = card.id + ' · ' + (card.title || 'Card ' + card.id);
      wrap.appendChild(label);
      card.start = tokens.length;
      card.paragraphs.forEach(function (p) { addParagraph(wrap, p); });
      card.end = tokens.length;
      textEl.appendChild(wrap);
    });
  });
  var N = tokens.length;
  // The last token of a paragraph always closes a sentence, even without punctuation.
  DATA.cards.forEach(function (c) { if (c.end > c.start) tokens[c.end - 1].end = true; });

  /* ---------- Where each idea beat sits in the text ---------- */
  // Every token gets the same stem the scorer uses, so a beat's first key phrase can be located.
  var stems = tokens.map(function (t) { var b = T.basicTokens(t.raw); return T.stem(b.length ? b[0] : t.norm); });
  function findPhrase(phrase, from, to) {
    var ph = T.prepareSpoken(phrase).map(T.stem);
    if (!ph.length) return -1;
    outer: for (var i = from; i + ph.length <= to; i++) {
      for (var k = 0; k < ph.length; k++) if (!T.stemsMatch(ph[k], stems[i + k])) continue outer;
      return i;
    }
    return -1;
  }
  var beats = []; // { card, label, keys, pos }
  DATA.cards.forEach(function (card) {
    var list = (card.beats && card.beats.length) ? card.beats : fallbackBeats(card);
    var len = card.end - card.start, floor = card.start;
    list.forEach(function (b, i) {
      // Beats run in reading order, so each one is looked for only after the previous beat's position.
      var pos = -1;
      b.keys.forEach(function (alts) {
        alts.forEach(function (alt) { var p = findPhrase(alt, floor, card.end); if (p >= 0 && (pos < 0 || p < pos)) pos = p; });
      });
      if (pos < 0) pos = Math.max(floor, card.start + Math.floor(len * i / list.length)); // not locatable: spread evenly
      floor = pos;
      beats.push({ card: card, label: b.label, keys: b.keys, pos: pos });
    });
  });
  beats.sort(function (a, b) { return a.pos - b.pos; });
  function fallbackBeats(card) {
    // For a card without hand-written beats: one beat per sentence, keyed on its content words.
    var text = card.paragraphs.join(' ').replace(/\[[^\]]*\]/g, ' ');
    var words = text.split(/\s+/).filter(Boolean), sents = [], buf = [];
    words.forEach(function (w) { buf.push(w); if (/[.?!]["”’)]*$/.test(w) && !/^(Dr|Mr|Mrs|Ms|St|vs)\.$/.test(w)) { sents.push(buf.join(' ')); buf = []; } });
    if (buf.length) sents.push(buf.join(' '));
    return sents.map(function (s) {
      var keys = [], seen = {};
      T.basicTokens(s).forEach(function (t) { if (T.STOP[t] || t.length < 3 || seen[t]) return; seen[t] = 1; keys.push([t]); });
      return { label: s, keys: keys };
    }).filter(function (b) { return b.keys.length; });
  }

  /* ---------- Following: forward-only word matching ---------- */
  var STOP = {};
  'the a an and or but of to in on at for with is it was that this i you we they he she my our your his her its be are were as so not no do did have has had can will would if then than there here what who how me him them us by from'.split(' ').forEach(function (w) { STOP[w] = 1; });
  function lev1(a, b) {
    if (a.length === b.length) { var d = 0; for (var i = 0; i < a.length; i++) if (a[i] !== b[i] && ++d > 1) return false; return true; }
    var s = a.length < b.length ? a : b, l = a.length < b.length ? b : a, x = 0, y = 0, k = 0;
    while (x < s.length && y < l.length) { if (s[x] === l[y]) { x++; y++; } else { y++; if (++k > 1) return false; } }
    return true;
  }
  function similar(a, b) {
    if (a === b) return true;
    if (a.length < 4 || b.length < 4) return false;
    if (a.indexOf(b) === 0 || b.indexOf(a) === 0) return Math.abs(a.length - b.length) <= 2;
    if (a.length >= 5 && b.length >= 5 && Math.abs(a.length - b.length) <= 1) return lev1(a, b);
    return false;
  }
  // Walk heard words forward from `start`. Returns the new cursor; never moves backward.
  function advance(start, heard) {
    var cur = start;
    for (var h = 0; h < heard.length; h++) {
      var n = normalize(heard[h]);
      if (!n) continue;
      var win = STOP[n] ? 3 : 14;
      var end = Math.min(N, cur + win);
      for (var i = cur; i < end; i++) {
        if (similar(n, tokens[i].norm)) { cur = i + 1; break; }
      }
    }
    return cur;
  }

  /* ---------- Rendering ---------- */
  var cursor = 0, shownUp = [], practice = false;
  var UP = 8, HOT = 4; // words ahead that light up; the first HOT of them go white
  function setCursor(c, opts) {
    c = Math.max(0, Math.min(N, c));
    var old = cursor;
    cursor = c;
    if (c > old) { for (var i = old; i < c; i++) tokens[i].el.classList.add('past'); }
    else if (c < old) { for (var j = c; j < old; j++) tokens[j].el.classList.remove('past'); }
    if (c < N) tokens[c].el.classList.remove('past');
    shownUp.forEach(function (el) { el.classList.remove('up', 'hot'); });
    shownUp = [];
    for (var k = 0; k < UP && c + k < N; k++) {
      var el = tokens[c + k].el;
      if (shownUp.indexOf(el) === -1) { el.classList.add('up'); if (k < HOT) el.classList.add('hot'); shownUp.push(el); }
    }
    pctEl.textContent = Math.round(100 * c / N) + '%';
    scrollToCursor(opts && opts.jump);
    try { localStorage.setItem(practice ? 'door-prompter-practice-cursor' : 'door-prompter-cursor', String(c)); } catch (e) {}
  }
  function sentenceStart(i) {
    i = Math.max(0, Math.min(N - 1, i));
    while (i > 0 && !tokens[i - 1].end) i--;
    return i;
  }

  // Smooth follow-scroll: keep the cursor word ~30% from the top of the reading area
  var scrollTarget = null, scrolling = false;
  function scrollToCursor(jump) {
    var idx = Math.min(cursor, N - 1);
    var el = tokens[idx].el;
    scrollTarget = el.offsetTop - scroller.clientHeight * 0.3;
    if (jump) { scroller.scrollTop = scrollTarget; return; }
    if (!scrolling) { scrolling = true; requestAnimationFrame(step); }
  }
  function step() {
    var d = scrollTarget - scroller.scrollTop;
    if (Math.abs(d) < 1) { scroller.scrollTop = scrollTarget; scrolling = false; return; }
    scroller.scrollTop += d * 0.18;
    requestAnimationFrame(step);
  }

  // Tap any word to jump to the start of its sentence. Live: the recovery move. Practice: where the run begins.
  textEl.addEventListener('click', function (e) {
    var w = e.target.closest('.w');
    if (!w || w.dataset.i === undefined) return;
    committed = sentenceStart(+w.dataset.i);
    setCursor(committed);
    if (practice && !listening) setMark(committed);
  });

  /* ---------- Modes ---------- */
  var markEl = null, practiceStart = 0;
  function setMark(i) {
    practiceStart = i;
    if (markEl) markEl.classList.remove('mark');
    markEl = i < N ? tokens[i].el : null;
    if (markEl) markEl.classList.add('mark');
    setMic('start set here: tap Record when ready');
  }
  function setMode(toPractice) {
    if (listening) { listening = false; stopRec(); }
    practice = toPractice;
    $('modeLive').classList.toggle('active', !practice);
    $('modePractice').classList.toggle('active', practice);
    $('hide').hidden = !practice;
    textEl.classList.toggle('practice', practice);
    if (!practice) {
      textEl.classList.remove('blur');
      $('hide').classList.remove('active');
      $('hide').textContent = 'Hide words';
      if (markEl) { markEl.classList.remove('mark'); markEl = null; }
    }
    var saved = 0;
    try { saved = Math.min(N - 1, +localStorage.getItem(practice ? 'door-prompter-practice-cursor' : 'door-prompter-cursor') || 0); } catch (e) {}
    for (var j = 0; j < N; j++) tokens[j].el.classList.toggle('past', j < saved);
    committed = saved;
    cursor = saved;
    setCursor(saved, { jump: true });
    if (practice) setMark(sentenceStart(saved));
    try { localStorage.setItem('door-prompter-mode', practice ? 'practice' : 'live'); } catch (e) {}
    requestAnimationFrame(function () { scrollToCursor(true); });
  }
  $('modeLive').addEventListener('click', function () { setMode(false); });
  $('modePractice').addEventListener('click', function () { setMode(true); });
  $('hide').addEventListener('click', function () {
    var on = textEl.classList.toggle('blur');
    $('hide').classList.toggle('active', on);
    $('hide').setAttribute('aria-pressed', on ? 'true' : 'false');
    $('hide').textContent = on ? 'Show words' : 'Hide words';
  });

  /* ---------- Idea scoring (same rules as the note card page) ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function tier(score) { return score >= 90 ? 'good' : score >= 75 ? 'mid' : 'low'; }
  // Score the beats whose text begins inside [start, end) against what was heard.
  function scoreSpan(start, end, spoken) {
    var bag = T.spokenBag(spoken), total = 0, n = 0, covered = 0, partial = 0, groups = [], cur = null;
    beats.forEach(function (b) {
      if (b.pos < start - 2 || b.pos >= end) return;
      var hit = [], missed = [];
      b.keys.forEach(function (alts) { (alts.some(function (p) { return T.phraseIn(bag, p); }) ? hit : missed).push(alts[0]); });
      var ratio = b.keys.length ? hit.length / b.keys.length : 1;
      var status = ratio >= 0.5 ? 'hit' : (hit.length && ratio >= 0.25) ? 'part' : 'miss';
      total += status === 'hit' ? 1 : status === 'part' ? 0.5 : 0;
      n++;
      if (status === 'hit') covered++; else if (status === 'part') partial++;
      if (!cur || cur.card !== b.card) { cur = { card: b.card, rows: [] }; groups.push(cur); }
      cur.rows.push({ label: b.label, status: status, hit: hit, missed: missed });
    });
    return { groups: groups, score: n ? Math.round(100 * total / n) : 0, n: n, covered: covered, partial: partial, start: start, end: end };
  }
  function excerpt(from, to) {
    var words = [];
    for (var i = Math.max(0, from); i < Math.min(N, to); i++) words.push(tokens[i].raw);
    return words.join(' ').replace(/\s+/g, ' ');
  }
  function showResults(res, spokenWords, seconds) {
    $('scoreNum').textContent = res.score;
    $('scoreBox').className = 'score ' + tier(res.score);
    var wpm = seconds > 5 ? Math.round(60 * spokenWords / seconds) : 0;
    if (!res.n) {
      $('scoreT').textContent = 'No ideas to score in that stretch';
      $('scoreS').textContent = 'The run ended before the first idea past your starting point. Talk a little further next time.';
    } else {
      $('scoreT').textContent = res.covered + ' of ' + res.n + ' ideas covered' + (res.partial ? ', ' + res.partial + ' partly' : '');
      $('scoreS').textContent = (res.score >= 90 ? 'You have the flow. ' : res.score >= 75 ? 'Close. Look at the ideas marked below. ' : 'Run it again with the missed ideas in mind. ') +
        (wpm ? 'Pace: ' + wpm + ' words a minute.' : '');
    }
    $('spanNote').innerHTML = 'Scored from <b>“' + esc(excerpt(res.start, res.start + 6)) + '…”</b> through <b>“…' + esc(excerpt(res.end - 6, res.end)) + '”</b>';
    var html = '';
    res.groups.forEach(function (g) {
      html += '<div class="group"><h3>' + g.card.id + ' · ' + esc(g.card.title || 'Card ' + g.card.id) + '</h3><ul class="beats">';
      g.rows.forEach(function (r) {
        var mark = r.status === 'hit' ? '✓' : r.status === 'part' ? '◐' : '✗';
        html += '<li class="' + r.status + '"><span class="mark">' + mark + '</span><span class="label">' + esc(r.label) + '</span>';
        if (r.status !== 'hit') {
          html += '<span class="keys">' + r.hit.map(function (k) { return '<span class="k hit">' + esc(k) + '</span>'; }).join('') +
                  r.missed.map(function (k) { return '<span class="k miss">' + esc(k) + '</span>'; }).join('') + '</span>';
        }
        html += '</li>';
      });
      html += '</ul></div>';
    });
    $('groups').innerHTML = html;
    $('results').hidden = false;
    $('results').querySelector('.body').scrollTop = 0;
  }
  $('resClose').addEventListener('click', function () { $('results').hidden = true; });
  $('resDone').addEventListener('click', function () { $('results').hidden = true; });
  $('again').addEventListener('click', function () {
    $('results').hidden = true;
    committed = practiceStart;
    setCursor(practiceStart, { jump: true });
    setMark(practiceStart);
    startListening();
  });

  /* ---------- Speech recognition ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, committed = 0, finalCount = 0, wakeLock = null;
  var finals = [], interimText = '', startedAt = 0;

  function setMic(text, cls) { micEl.textContent = text; micEl.className = cls || ''; }

  function startRec() {
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';
    rec.maxAlternatives = 1;
    finalCount = 0;
    rec.onstart = function () { setMic('listening', 'live'); };
    rec.onresult = function (e) {
      var interim = [];
      for (var i = finalCount; i < e.results.length; i++) {
        var r = e.results[i];
        var txt = r[0].transcript.trim();
        var words = txt.split(/\s+/);
        if (r.isFinal) { committed = advance(committed, words); finalCount = i + 1; if (txt) finals.push(txt); }
        else { interim = interim.concat(words); }
      }
      interimText = interim.join(' ');
      var shown = advance(committed, interim);
      var lastRes = e.results[e.results.length - 1];
      var heard = lastRes ? lastRes[0].transcript.trim().split(/\s+/).slice(-6).join(' ') : '';
      heardEl.textContent = heard;
      if (shown !== cursor) setCursor(shown);
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        listening = false;
        stopRec();
        setMic('mic blocked: allow microphone access for this page', 'warn');
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        setMic('mic hiccup (' + e.error + '), retrying', 'warn');
      }
    };
    rec.onend = function () {
      if (interimText) { finals.push(interimText); interimText = ''; }
      if (listening) { setTimeout(function () { if (listening) { try { startRec(); } catch (err) {} } }, 200); }
      else setMic('mic off');
    };
    rec.start();
  }
  function stopRec() {
    if (rec) { try { rec.onend = null; rec.stop(); } catch (e) {} rec = null; }
    if (interimText) { finals.push(interimText); interimText = ''; }
    recBtn.classList.remove('on');
    recBtn.setAttribute('aria-pressed', 'false');
    recLabel.textContent = 'Record';
    setMic('mic off');
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  function requestWake() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && listening) requestWake();
  });
  function startListening() {
    if (!SR) { $('nosupport').hidden = false; return; }
    listening = true;
    committed = cursor;
    if (practice) setMark(cursor);
    finals = []; interimText = ''; startedAt = Date.now();
    recBtn.classList.add('on');
    recBtn.setAttribute('aria-pressed', 'true');
    recLabel.textContent = practice ? 'Stop & score' : 'Listening';
    setMic('starting mic…');
    requestWake();
    try { startRec(); } catch (e) { setMic('could not start mic', 'warn'); }
  }
  recBtn.addEventListener('click', function () {
    if (listening) {
      listening = false;
      stopRec();
      if (practice) {
        var spoken = finals.join(' ');
        var words = spoken.split(/\s+/).filter(Boolean).length;
        if (!words) { setMic('nothing heard, so nothing to score', 'warn'); return; }
        // The run reaches wherever the follower got to, or as far as the word count says if it lost you.
        var end = Math.min(N, Math.max(cursor, practiceStart + Math.round(words * 0.9)));
        showResults(scoreSpan(practiceStart, end, spoken), words, (Date.now() - startedAt) / 1000);
      }
      return;
    }
    startListening();
  });

  $('back').addEventListener('click', function () {
    var i = sentenceStart(cursor - 1);
    if (cursor - i < 2) i = sentenceStart(i - 1);
    committed = Math.max(0, i);
    setCursor(committed);
    if (practice && !listening) setMark(committed);
  });
  $('restart').addEventListener('click', function () {
    if (practice) { committed = practiceStart; setCursor(practiceStart, { jump: true }); return; }
    if (cursor > 0 && !confirm('Go back to the top of the keynote?')) return;
    committed = 0;
    setCursor(0, { jump: true });
  });

  /* ---------- Text size ---------- */
  var size = 30;
  try { size = +localStorage.getItem('door-prompter-size') || 30; } catch (e) {}
  function applySize() {
    document.documentElement.style.setProperty('--size', size + 'px');
    try { localStorage.setItem('door-prompter-size', String(size)); } catch (e) {}
    requestAnimationFrame(function () { scrollToCursor(true); });
  }
  $('bigger').addEventListener('click', function () { size = Math.min(56, size + 3); applySize(); });
  $('smaller').addEventListener('click', function () { size = Math.max(18, size - 3); applySize(); });
  $('dismiss').addEventListener('click', function () { $('nosupport').hidden = true; });

  /* ---------- Boot ---------- */
  applySize();
  var mode = 'live';
  try { mode = localStorage.getItem('door-prompter-mode') || 'live'; } catch (e) {}
  setMode(mode === 'practice');
  if (!SR) setMic('this browser cannot listen; tap sentences to advance', 'warn');
  window.addEventListener('resize', function () { scrollToCursor(true); });
  window.DoorPrompter = { scoreSpan: scoreSpan, showResults: showResults, beats: beats, tokens: tokens, sentenceStart: sentenceStart };
})();
</script>
</body>
</html>
