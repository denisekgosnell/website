<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Voice-following teleprompter for the Duality of AI keynote. Live mode follows your words through the whole talk; Practice mode scores any stretch you run, starting from whatever sentence you tap.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Hold the Door Prompter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #0b0d12;
    --panel: #12151d;
    --raised: #1a1e29;
    --line: #232837;
    --ink: #d9dde8;
    --ink-past: #4b5264;
    --ink-cue: #6b7a99;
    --amber: #ffc857;
    --amber-deep: #f2a93b;
    --record: #e2503c;
    --ok: #5ec48a;
    --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    --size: 30px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; width: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  #app { height: 100vh; height: 100dvh; width: 100%; min-width: 0; overflow: hidden; display: grid; grid-template-rows: auto auto 1fr; }

  /* Top bar */
  header {
    min-width: 0; max-width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding-top: max(10px, env(safe-area-inset-top));
  }
  button {
    font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 13px; cursor: pointer; font-size: 15px; line-height: 1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; white-space: nowrap;
  }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button:active { background: var(--raised); }
  #rec {
    display: inline-flex; align-items: center; gap: 9px; font-weight: 700;
    border-color: var(--record); color: var(--record); padding: 10px 16px;
  }
  #rec .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--record); }
  #rec.on { background: var(--record); color: #fff; }
  #rec.on .dot { background: #fff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .45; transform: scale(.7);} }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 9px 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active { background: var(--amber); color: #1a1405; font-weight: 700; }
  #hide.active { background: var(--raised); border-color: var(--amber-deep); color: var(--amber); }

  #status {
    min-width: 0; max-width: 100%;
    font-family: var(--mono); font-size: 12px; color: var(--ink-cue); line-height: 1.3;
    padding: 7px 14px 9px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; gap: 14px; align-items: baseline; white-space: nowrap; overflow: hidden;
  }
  #status #mic { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #status .live { color: var(--ok); }
  #status .warn { color: var(--amber-deep); }
  #heard { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--ink); opacity: .7; }
  #pct { font-variant-numeric: tabular-nums; }

  /* Script body */
  main#scroller { overflow-y: auto; overflow-x: hidden; position: relative; min-width: 0; max-width: 100%; -webkit-overflow-scrolling: touch; }
  #text {
    position: relative; padding: 26vh 12px 60vh; width: 100%; max-width: min(100%, 42em); margin: 0 auto;
    font-size: var(--size); line-height: 1.5; font-weight: 400;
    overflow-wrap: anywhere;
  }
  #text .p { margin: 0 0 .8em; }
  #text .cue {
    font-family: var(--mono); font-size: .48em; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-cue); margin: 1.6em 0 .9em; line-height: 1.4;
  }
  #text .cue.part { color: var(--amber-deep); border-top: 1px solid var(--line); padding-top: 1.2em; margin-top: 2.4em; }
  #text .cue.card { font-size: .42em; color: var(--ink-cue); margin: 1.4em 0 .8em; text-transform: none; letter-spacing: .02em; }
  #text .cue.inline { display: inline; margin: 0; padding: .1em .45em; border: 1px solid var(--line); border-radius: 6px; text-transform: none; letter-spacing: 0; }
  #text:not(.practice) .cue.card { display: none; }
  #text.practice .w.mark { box-shadow: inset 0 -3px 0 var(--amber-deep); }
  .w {
    display: inline-block; cursor: pointer; border-radius: .18em; padding: 0 .04em;
    transition: color .25s ease, transform .25s ease, text-shadow .25s ease, filter .3s ease;
    transform-origin: center bottom;
  }
  .w.past { color: var(--ink-past); }
  .w.up { color: var(--amber); font-weight: 700; }
  .w.hot { color: #fff; transform: scale(1.03); text-shadow: 0 0 16px rgba(255,200,87,.6); }
  #text.blur .w { filter: blur(7px); }
  #text.blur .w.hot { filter: blur(4px); }
  #text.blur .cue { filter: none; }

  /* Sheets: picker and results */
  .sheet {
    position: fixed; inset: 0; background: rgba(6,8,12,.78); display: grid; align-items: end; z-index: 20;
  }
  .sheet .panel {
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
    max-height: 88vh; max-height: 88dvh; display: flex; flex-direction: column;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .sheet .head {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .sheet .head h2 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; }
  .sheet .body { overflow-y: auto; padding: 8px 12px 12px; -webkit-overflow-scrolling: touch; }
  .sheet .foot { display: flex; gap: 8px; padding: 10px 12px 0; flex-wrap: wrap; }
  .sheet .foot button { flex: 1; padding: 12px 14px; }
  .sheet .foot button.primary { background: var(--amber); color: #1a1405; border-color: var(--amber); font-weight: 700; }
  .x { width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 18px; line-height: 1; }


  .score { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 8px 4px 14px; }
  .score .big {
    font-size: 54px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .score .big small { font-size: 22px; font-weight: 400; color: var(--ink-cue); }
  .score.good .big { color: var(--ok); } .score.mid .big { color: var(--amber); } .score.low .big { color: var(--record); }
  .score .t { font-size: 16px; font-weight: 700; }
  .score .s { font-size: 13px; color: var(--ink-cue); margin-top: 3px; line-height: 1.4; }
  .span { font-size: 13px; color: var(--ink-cue); line-height: 1.45; padding: 0 4px 12px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .span b { color: var(--ink); font-weight: 400; }
  .group { margin: 6px 0 14px; }
  .group h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-cue); margin: 0 0 6px 4px; }
  .beats { list-style: none; margin: 0; padding: 0; }
  .beats li {
    display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 10px; border-radius: 10px; margin-bottom: 5px;
    font-size: 15px; line-height: 1.4; background: var(--raised);
  }
  .beats li .mark { font-weight: 700; text-align: center; }
  .beats li.hit { border-left: 3px solid var(--ok); } .beats li.hit .mark { color: var(--ok); }
  .beats li.part { border-left: 3px solid var(--amber); } .beats li.part .mark { color: var(--amber); }
  .beats li.miss { border-left: 3px solid var(--record); } .beats li.miss .mark { color: var(--record); }
  .beats li.miss .label, .beats li.part .label { color: var(--ink); }
  .beats li.hit .label { color: var(--ink-past); }
  .beats .keys { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .beats .k { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--panel); color: var(--ink-cue); }
  .beats .k.hit { color: var(--ok); } .beats .k.miss { color: var(--record); text-decoration: line-through; }

  #nosupport {
    position: fixed; inset: 0; background: rgba(11,13,18,.94); display: grid; place-items: center; padding: 30px; text-align: center;
    font-size: 18px; line-height: 1.5; z-index: 30;
  }
  #nosupport code { font-family: var(--mono); color: var(--amber); }

  @media (prefers-reduced-motion: reduce) {
    .w { transition: none; }
    #rec.on .dot { animation: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="rec" aria-pressed="false"><span class="dot"></span><span id="reclabel">Record</span></button>
    <span class="seg" role="group" aria-label="Mode">
      <button id="modeLive" class="active">Live</button>
      <button id="modePractice">Practice</button>
    </span>
    <button id="hide" hidden aria-pressed="false">Hide words</button>
    <button id="back" title="Back one sentence">◂ Sentence</button>
    <span class="spacer"></span>
    <span class="seg">
      <button id="smaller" aria-label="Smaller text">A−</button>
      <button id="bigger" aria-label="Larger text">A+</button>
    </span>
    <button id="restart">Restart</button>
  </header>
  <div id="status">
    <span id="mic">mic off</span>
    <span id="heard"></span>
    <span id="pct">0%</span>
  </div>
  <main id="scroller"><div id="text"></div></main>
</div>

<div id="results" class="sheet" hidden>
  <div class="panel">
    <div class="head"><h2 id="resTitle">Practice score</h2><button class="x" id="resClose" aria-label="Close">×</button></div>
    <div class="body">
      <div class="score" id="scoreBox">
        <div class="big"><span id="scoreNum">0</span><small>%</small></div>
        <div><div class="t" id="scoreT"></div><div class="s" id="scoreS"></div></div>
      </div>
      <div class="span" id="spanNote"></div>
      <div id="groups"></div>
    </div>
    <div class="foot">
      <button id="again" class="primary">Run it again from the same spot</button>
      <button id="resDone">Done</button>
    </div>
  </div>
</div>

<div id="nosupport" hidden>
  <div>
    <p><strong>This browser can't listen.</strong></p>
    <p>Speech recognition works in <code>Chrome</code>, <code>Edge</code>, or <code>Safari</code> on iPhone and Mac. Open this link in one of those. You can still tap any sentence to move the prompter by hand.</p>
    <p><button id="dismiss">Continue without listening</button></p>
  </div>
</div>

<script>// Text normalization and matching shared by the practice page (browser) and the build/verification step (node).

  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.KeynoteText = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  var UNITS = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };
  var TENS = { twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
  var SCALES = { hundred: 100, thousand: 1000, million: 1000000, billion: 1000000000 };
  var ALIASES = {
    jay: 'j', barbecue: 'bbq', barbeque: 'bbq', doctor: 'dr', mister: 'mr', okay: 'ok',
    mica: 'micah', mika: 'micah', mikah: 'micah', myka: 'micah', micha: 'micah', barry: 'berry', berrys: 'berrys',
    twenties: '20s', thirties: '30s', forties: '40s', fifties: '50s', sixties: '60s', seventies: '70s', eighties: '80s', nineties: '90s',
    fourty: 'forty'
  };
  var FILLERS = { um: 1, uh: 1, umm: 1, uhh: 1, hmm: 1, mm: 1, er: 1, ah: 1, uhm: 1 };
  var STOP = {};
  ('a an the and or but so if then than that this these those there here it its i me my we our us you your he him his she her they them their ' +
   'is am are was were be been being do does did done have has had having will would can could should may might must shall ' +
   'of in on at to for from by with about into onto over under up down out off as through between after before again ' +
   'not no nor yes very really just also too even still only ever never always often sometimes somewhere else ' +
   'what which who whom whose when where why how all any both each few more most much some such own same other another ' +
   'because while until since though although whether like kind kinda sort get got gets getting go goes going went gone ' +
   'one thing things something someone somebody anything everything everyone everybody nothing nobody way ways well let lets ' +
   'now today back right little lot lots part parts bit make makes made making take takes took taking put say says said saying ' +
   'know knew think thought see saw seen come came coming want wanted look looked looking around theyre were dont im ive youre ' +

  function isDigits(w) { return /^\d+$/.test(w); }
  function isNumWord(w) { return (w in UNITS) || (w in TENS) || (w in SCALES); }

  function basicTokens(text) {
    var s = text.toLowerCase();
    s = s.replace(/[’‘`]/g, "'").replace(/[“”]/g, '"');
    s = s.replace(/c\+\+/g, ' c plus plus ');
    s = s.replace(/&/g, ' and ');
    s = s.replace(/%/g, ' percent ');
    s = s.replace(/(\d),(\d{3})/g, '$1$2').replace(/(\d),(\d{3})/g, '$1$2');

  // "nineteen fifty" == "1950", "twenty million" == "20 million". Tokens are {t, src}.

      // "eighteen" + "90s" -> "1890s"

  function unionSrc(run) { var s = []; run.forEach(function (r) { r.src.forEach(function (v) { if (s.indexOf(v) < 0) s.push(v); }); }); return s; }
  function numberRun(run) {

    var hasScale = words.some(function (w) { return w in SCALES; });
    var src = unionSrc(run);
    if (!hasScale) {
      var groups = [], open = false;
      words.forEach(function (w) {

        else if (UNITS[w] !== undefined) {
          if (open && UNITS[w] > 0 && UNITS[w] < 10) { groups[groups.length - 1] += UNITS[w]; open = false; }
          else { groups.push(UNITS[w]); open = false; }
        } else if (isDigits(w)) { groups.push(parseInt(w, 10)); open = false; }
      });
      if (groups.length === 2 && groups[0] >= 10 && groups[0] <= 99 && groups[1] >= 10 && groups[1] <= 99) {

      }

  }

    if (bag.set[st]) return true;

    mergeNumbers: mergeNumbers, prepareSpoken: prepareSpoken, lev: lev, stem: stem, stemsMatch: stemsMatch, spokenBag: spokenBag,
    bagHas: bagHas, phraseIn: phraseIn };
});
</script>
<script>
(function () {
  'use strict';
  var DATA = {"sections":[{"title":"Part 1. Personal anecdote—when you first saw the power of Opening Doors for others","cards":4,"words":621,"short":"Part 1 · Micah","color":"#d97706"},{"title":"Part 2. Who I am / Introduction of the “Duality of AI”","cards":9,"words":1898,"short":"Part 2 · Who I Am","color":"#0d9488"},{"title":"Part 3. Duality and the Tensions We Must Resolve","cards":3,"words":519,"short":"Part 3 · Tensions","color":"#64748b"},{"title":"The First Great Tension: AI Will Eliminate Jobs—and Create New Ones","cards":5,"words":1072,"short":"Tension 1 · Jobs","color":"#2563eb"},{"title":"The Second Great Tension: AI Can Create Shared Prosperity—or Become Extractive","cards":5,"words":1007,"short":"Tension 2 · Prosperity","color":"#16a34a"},{"title":"The Third Great Tension: AI Can Democratize Control—or Concentrate It","cards":7,"words":1662,"short":"Tension 3 · Control","color":"#e11d48"},{"title":"PART 4. STRATEGY AND EXECUTION: WRITING IS THINKING","cards":5,"words":766,"short":"Part 4 · Writing","color":"#c2410c"},{"title":"PART 5. CONCLUSION: BE A DOOR-OPENER","cards":6,"words":968,"short":"Part 5 · Door-Opener","color":"#7c3aed"}],"cards":[{"section":0,"paragraphs":["In late April of 2014, I was 27 years old, standing at the front of a lecture hall, just down the street.","It was room 525 in the brand new Min Kao building. I was proctoring the final exam for Dr. Mike Berry's spring CS 102 class. This was my last final as a teaching assistant. There were about a hundred and twenty students, heads down, working through the written part of their computer science final. This was their last gate before summer break, and you could feel the freedom boxed into the lecture hall, yearning to be set loose.","Like any college class, some of the students were deeply passionate about the subject. This was what they loved. Others were simply checking a “general education” box in order to graduate. They thought computer science would be easy or interesting enough compared to their other choices like stats or calculus."],"id":1,"words":150,"beats":[{"label":"Late April 2014, I was 27, at the front of a lecture hall just down the street","keys":[["april"],["2014"],["27"],["lecture hall"],["down the street"]]},{"label":"Room 525 in the brand new Min Kao building","keys":[["525"],["min kao","min cow","minkao"],["brand new"]]},{"label":"Proctoring Dr. Mike Berry's spring CS 102 final, my last as a teaching assistant","keys":[["proctoring"],["berry"],["102"],["last final"],["teaching assistant","ta"]]},{"label":"About 120 students, heads down, working through the written part of their final","keys":[["120"],["heads down"],["written"],["students"]]},{"label":"Their last gate before summer break; freedom boxed into the hall, yearning to be set loose","keys":[["last gate"],["summer break"],["freedom"],["set loose"]]},{"label":"Some students were deeply passionate, this was what they loved; others were checking a general-education box to graduate","keys":[["passionate"],["loved"],["general education"],["box"]]},{"label":"They figured CS would be easy or interesting enough compared to stats or calculus","keys":[["easy"],["interesting"],["stats"],["calculus"]]}],"title":"Room 525: the lecture hall, April 2014"},{"section":0,"paragraphs":["One of those students was Micah. Micah was just shy of 6 feet tall, dark haired. Kinda generic college student from central casting for your “average student.” In the beginning, he mostly attended classes, got middle of the pack grades, and usually turned in his homework. He reminds me of so many of my colleagues and employees: they show up, do the work, and don’t make waves in either direction.","Micah never really stood out. But he was a curious student. As the semester went on, you could see him getting more and more energized by the subject. The “mostly showed up” turned into “always showed up.” I could see that something was clicking for him. Something was energizing him. I get energized just thinking about how excited he was—I can still see his face, his smile when he figured out “for loops” in the lab by printing out each iteration’s data.","That was when Micah saw the compounding benefits of automation."],"id":2,"words":162,"beats":[{"label":"One of those students was Micah: just shy of 6 feet tall, dark haired","keys":[["micah"],["6 feet"],["dark haired"]]},{"label":"Generic college student from central casting, your average student","keys":[["generic"],["central casting"],["average student"]]},{"label":"Mostly attended, middle-of-the-pack grades, usually turned in his homework","keys":[["attended"],["middle of the pack"],["grades"],["homework"]]},{"label":"Like so many colleagues and employees: show up, do the work, don't make waves","keys":[["colleagues"],["employees"],["show up"],["do the work"],["waves"]]},{"label":"Micah never stood out, but he was a curious student","keys":[["stood out"],["curious"]]},{"label":"As the semester went on he got more and more energized; \"mostly showed up\" became \"always showed up\"","keys":[["semester"],["energized"],["mostly showed up"],["always showed up"]]},{"label":"Something was clicking; I can still see his smile when he figured out for loops by printing out each iteration's data","keys":[["clicking"],["smile"],["for loops"],["printing"],["iteration"]]},{"label":"That was when Micah saw the compounding benefits of automation","keys":[["compounding"],["benefits"],["automation"]]}],"title":"Micah: from middle of the pack to lit on fire"},{"section":0,"paragraphs":["So there I was, standing in room 525, in front of Dr. Berry’s CS 102 final exam. Students are finishing, turning in their blue books—remember those? Well, they’re probably coming back.","Then, Micah puts his pencil down, packs up, walks to the front, and instead of placing his blue book on the desk, he hands it to me. Then he proceeds to give me the biggest bear hug of my life, lifts me clean off the ground.","He puts me down, thanks me and tells me that he took this class just wanting a box checked, but somewhere in the semester he found a new passion for solving invisible math puzzles. Which is pretty much what computer science in industry actually feels like…if you add in solving those puzzles while driving a speeding Ferrari down a moving highway of burning cars and collapsing bridges, that’s exactly what it feels like today, but I’m skipping ahead."],"id":3,"words":155,"beats":[{"label":"So there I was, standing in room 525, at Dr. Berry's CS 102 final exam","keys":[["525"],["berry"],["102"],["final exam"]]},{"label":"Students finishing, turning in blue books; remember those? They're probably coming back","keys":[["blue books"],["remember those"],["coming back"]]},{"label":"Micah puts his pencil down, packs up, walks to the front, and hands his blue book to me instead of the desk","keys":[["pencil"],["packs up"],["front"],["desk"],["hands it to me"]]},{"label":"The biggest bear hug of my life; lifts me clean off the ground","keys":[["bear hug"],["biggest"],["lifts"],["off the ground"]]},{"label":"He puts me down, thanks me: he took the class just wanting a box checked","keys":[["puts me down"],["thanks me"],["box checked"]]},{"label":"Somewhere in the semester he found a new passion for solving invisible math puzzles","keys":[["passion"],["invisible math puzzles","invisible"],["puzzles"]]},{"label":"That's what industry CS feels like, plus a speeding Ferrari down a highway of burning cars and collapsing bridges; but I'm skipping ahead","keys":[["ferrari"],["speeding"],["burning cars"],["collapsing bridges"],["skipping ahead"]]}],"title":"Back in room 525: blue books and the bear hug"},{"section":0,"paragraphs":["Micah walked out of the room, and Dr. Berry turned to me and said, \"I've never seen anything like that. The way you share your curiosity and your passion for computing, you've lit that kid on fire.\" Micah later told Dr. Berry that he was switching his major to computer science, and he wanted to thank me for showing him his path.","And that is why I'm standing here today.","We live through millions of moments. Most pass through us. Some become memories. A small handful become something more. They become a part of the story we tell about who we are. Psychologists call them self-defining memories—moments that stick with us and define what we believe about ourselves.","I thought I had spent the semester teaching computer science. What I had really done was open a door. Micah was the one who walked through it. But first, somebody had to make the door visible.","[~3.5 min]"],"id":4,"words":154,"beats":[{"label":"Micah walked out; Dr. Berry turned to me: \"I've never seen anything like that\"","keys":[["walked out"],["berry"],["never seen anything like that"]]},{"label":"\"The way you share your curiosity and passion for computing, you've lit that kid on fire\"","keys":[["curiosity"],["passion"],["computing"],["lit that kid on fire"]]},{"label":"Micah later told Dr. Berry he was switching his major to computer science and wanted to thank me for showing him his path","keys":[["switching his major","switched his major","changed his major"],["major"],["thank me","thanked me"],["showing him his path","his path"]]},{"label":"And that is why I'm standing here today","keys":[["standing here today"]]},{"label":"We live through millions of moments; most pass through us, some become memories, a small handful become part of the story we tell about who we are","keys":[["millions of moments"],["pass through"],["memories"],["handful"],["story"]]},{"label":"Psychologists call them self-defining memories","keys":[["psychologists"],["self-defining memories"]]},{"label":"I thought I'd taught computer science; what I really did was open a door; Micah walked through it, but first somebody had to make the door visible","keys":[["teaching computer science"],["open a door"],["walked through"],["visible"]]}],"title":"Dr. Berry's words, and the door made visible"},{"section":1,"paragraphs":["Good morning and Welcome to the inaugural AI-NO-vation Summit. My name is Denise Gosnell.","I love a good puzzle. Whether it’s the “invisible math puzzles” that Micah discovered he loved, or the practical business puzzle, or the 2000 piece jigsaw puzzle of the Appalachian Trail…I can lose myself in them for hours or days on end. Puzzles have never once felt like work.","I’m fortunate in that way. I love what I get to do.","And like many things in life, I got here because of a happy accident…or rather an unhappy one at first that turned into a happy one.","I didn't plan on this field. When the 2008 crash took the job market with it, math sent me back to school, and two people at Tennessee, Dr. Langston and Dr. Cynthia Peterson, opened the door to computer science for a mathematician who didn't yet know she belonged there.","I met Micah on my way to earning my PhD in computer science from the Center for Intelligent Systems and Machine Learning at the University of Tennessee."],"id":5,"words":177,"beats":[{"label":"Good morning, welcome to the inaugural AI-NO-vation Summit; my name is Denise Gosnell","keys":[["good morning"],["inaugural"],["summit"],["denise gosnell"]]},{"label":"I love a good puzzle: invisible math puzzles, the business puzzle, the 2000-piece Appalachian Trail jigsaw","keys":[["puzzle"],["business puzzle"],["2000"],["appalachian trail"],["jigsaw"]]},{"label":"Hours or days on end; puzzles never once felt like work; I'm fortunate, I love what I get to do","keys":[["hours"],["days"],["felt like work"],["fortunate"],["love what I get to do"]]},{"label":"A happy accident, or an unhappy one at first that turned into a happy one","keys":[["happy accident"],["unhappy"]]},{"label":"I didn't plan on this field; the 2008 crash took the job market, and math sent me back to school","keys":[["plan"],["2008"],["crash"],["job market"],["back to school"]]},{"label":"Dr. Langston and Dr. Cynthia Peterson opened the door to CS for a mathematician who didn't yet know she belonged","keys":[["langston"],["peterson","cynthia"],["opened the door"],["mathematician"],["belonged"]]},{"label":"I met Micah on my way to my PhD at UT's Center for Intelligent Systems and Machine Learning","keys":[["micah"],["phd"],["intelligent systems"],["machine learning"],["university of tennessee"]]}],"title":"Good morning: puzzles, and a happy accident"},{"section":1,"paragraphs":["After finishing my PhD, there was only one destination for me: Silicon Valley. I wanted to learn and build from the best. I wanted to learn how the best builders in the world turned code into products. But I also wanted to see how those products became things people could actually use. How people’s jobs or lives were impacted and enhanced by things that started out as an idea and some code.","While in Silicon Valley, I quickly fell into the gravity well of open source. Think of open source like academia at its best. Everyone's invited, everyone shares, and the reward isn't hoarding what you know. It's being the one who figured it out first and told everybody.","I became a leader in open-source graph technology and helped dozens of organizations like Netflix, Starbucks, Home Depot, FedEx, SnapChat, and the Federal Government connect data in ways that break silos. Of course, a broken silo itself is a duality—it breaks somebody's closed, comfortable model of how the world was supposed to work and replaces it with an opportunity for someone else."],"id":6,"words":181,"beats":[{"label":"After my PhD, one destination: Silicon Valley, to learn and build from the best","keys":[["phd"],["destination"],["silicon valley"],["learn and build"],["best"]]},{"label":"How the best builders turned code into products, and how products became things people could actually use","keys":[["builders"],["code into products"],["actually use"]]},{"label":"How people's jobs and lives were impacted and enhanced by an idea and some code","keys":[["jobs"],["lives"],["impacted"],["enhanced"],["idea"]]},{"label":"In Silicon Valley I fell into the gravity well of open source","keys":[["silicon valley"],["gravity well"],["open source"]]},{"label":"Open source is academia at its best: everyone's invited, everyone shares; the reward isn't hoarding, it's figuring it out first and telling everybody","keys":[["academia"],["invited"],["shares"],["hoarding"],["first"],["told everybody"]]},{"label":"I became a leader in open-source graph technology and helped dozens of organizations, Netflix, Starbucks, Home Depot, FedEx, SnapChat, the Federal Government, connect data in ways that break silos","keys":[["leader"],["graph"],["dozens of organizations"],["netflix"],["starbucks"],["home depot"],["fedex"],["snapchat"],["federal government"],["break silos"]]},{"label":"A broken silo is itself a duality: it breaks somebody's closed, comfortable model of the world and replaces it with someone else's opportunity","keys":[["broken silo"],["duality"],["comfortable"],["model"],["opportunity"]]}],"title":"Silicon Valley, open source, and breaking silos"},{"section":1,"paragraphs":["Like that time - Right after my PhD here at Tennessee, at a healthcare startup, I helped to expose a $20M medicare fraud scheme simply by connecting data sets together.","That same start-up built automated healthcare claims processing and saved people real money. But it did it by making pharmaceutical drug prices transparent and exposed games the PBMs were running…  so you can guess what happened next: [pause] a PBM sued us out of existence.","After enough times, you stop seeing innovation as one thing. What you build as a door for one person is a wall coming down for someone else.","The technology doesn't pick. People do."],"id":7,"words":107,"beats":[{"label":"Like that time: right after my PhD, at a healthcare startup, I helped expose a $20M Medicare fraud scheme by connecting data sets","keys":[["like that time"],["healthcare startup"],["20 million"],["medicare"],["fraud"],["connecting data sets"]]},{"label":"That startup automated claims processing and saved people real money","keys":[["claims processing"],["saved"],["real money"]]},{"label":"It made drug prices transparent and exposed the PBMs' games, so a PBM sued us out of existence","keys":[["drug prices"],["transparent"],["pbms"],["sued"],["out of existence"]]},{"label":"You stop seeing innovation as one thing: a door for one person is a wall coming down for someone else","keys":[["innovation"],["one thing"],["door"],["wall coming down"]]},{"label":"The technology doesn't pick. People do.","keys":[["technology doesn't pick"],["people do"]]}],"title":"Like that time: the healthcare startup and the PBM"},{"section":1,"paragraphs":["So here's something else about me. I've always felt like I lived in a duality between what makes sense to me and what everybody else says is true. This isn’t like colorblindness where I think green looks orange. Or my firm belief that Peyton Manning is the actual mayor of Knoxville, period. It’s more that my biggest moments of synthesis often don’t arrive in the moment, while reading at my desk, or listening to a lecture back here in my grad days. Rather, they arrive later, when I’m moving.","Once, while I was swimming laps at the Allen Jones aquatic center, the last piece of an algorithm I had been working on suddenly clicked into place in my brain. I immediately climbed out, wrapped myself in a towel, got into my car soaking wet, and drove straight home to the wall-sized whiteboard in my apartment so I could get it down before it disappeared.","That is how my mind works. I understand by moving. Talking. Testing. Making. If you go down the research rabbit hole on this, professionals in this space sort people’s creating and learning styles into four buckets.","1. Visual.","2. Auditory.","3. Reading and writing.","4. Kinesthetic.","I’m the kinesthetic type. Things click for me when I’m moving."],"id":8,"words":207,"beats":[{"label":"I've always lived in a duality between what makes sense to me and what everybody else says is true","keys":[["duality"],["makes sense"],["everybody else"],["true"]]},{"label":"Not colorblindness where green looks orange, or my firm belief that Peyton Manning is the mayor of Knoxville","keys":[["colorblindness"],["green"],["orange"],["peyton manning"],["mayor"],["knoxville"]]},{"label":"My biggest moments of synthesis don't arrive at my desk or in a lecture; they arrive later, when I'm moving","keys":[["synthesis"],["desk"],["lecture"],["moving"]]},{"label":"Swimming laps at the Allen Jones aquatic center, the last piece of an algorithm clicked into place","keys":[["swimming laps"],["allen jones"],["aquatic center"],["algorithm"],["clicked"]]},{"label":"Climbed out, towel, into the car soaking wet, straight home to the wall-sized whiteboard before it disappeared","keys":[["climbed out"],["towel"],["soaking wet"],["whiteboard"],["disappeared"]]},{"label":"That's how my mind works: I understand by moving, talking, testing, making","keys":[["mind works"],["moving"],["talking"],["testing"],["making"]]},{"label":"Researchers sort learning styles into four buckets: visual, auditory, reading and writing, kinesthetic","keys":[["four buckets"],["visual"],["auditory"],["reading and writing"],["kinesthetic"]]},{"label":"I'm the kinesthetic type; things click for me when I'm moving","keys":[["kinesthetic type"],["click"],["moving"]]}],"title":"Living in a duality: the swim, the whiteboard, kinesthetic"},{"section":1,"paragraphs":["Traditional software development works for builders, like me, but it’s not tailor-made for us. Software development is really tailored for the reading and writing learners. That’s the biggest door. And even moreso, it’s tailored for people in that group who can articulate a solution to a problem through one or more foreign languages, by which I mean Python, Java, Javascript, Ruby, C, C++. If that’s hard for you, then you will struggle in this world. If it’s hard, you were not in the club. You were standing outside the door.","Now, however, I’m watching AI create new doorways. A new set of doors for creating and sharing, open to other people who were stuck on the outside before.","Someone who cannot read or write or think in computer programming languages can now simply speak a problem in plain English—or French or Mandarin or Hungarian—and begin to build their solution. Someone who struggles to turn an idea into a polished memo can literally talk it through and discuss it with Claude to find the shape of their argument. Someone overwhelmed by a dozen competing responsibilities can create a system that gives them more of their day—and more of themselves—back.","That is real. I see it happening in front of me. We all do."],"id":9,"words":212,"beats":[{"label":"Traditional software development works for builders like me, but it is not tailor-made for us","keys":[["traditional"],["software development"],["builders"],["tailor-made"]]},{"label":"Software development is really tailored for reading-and-writing learners; that's the biggest door","keys":[["reading and writing"],["learners"],["biggest door"]]},{"label":"Even more for those who can articulate a solution in foreign languages: Python, Java, Javascript, Ruby, C, C++","keys":[["articulate"],["foreign languages"],["python"],["java"],["javascript"],["ruby"],["c++"]]},{"label":"If that's hard for you, you struggle; you were not in the club; you were standing outside the door","keys":[["struggle"],["club"],["outside the door"]]},{"label":"Now I'm watching AI create new doorways for people who were stuck on the outside","keys":[["new doorways"],["stuck"],["outside"]]},{"label":"Someone who can't think in programming languages can speak a problem in plain English, or French, Mandarin, Hungarian, and begin to build","keys":[["programming languages"],["plain english"],["french"],["mandarin"],["hungarian"],["build"]]},{"label":"Someone who struggles to write a memo can talk it through with Claude to find the shape of their argument","keys":[["memo"],["talk it through"],["claude"],["shape"],["argument"]]},{"label":"Someone overwhelmed by a dozen responsibilities can create a system that gives them their day, and themselves, back","keys":[["overwhelmed"],["dozen"],["responsibilities"],["system"],["more of their day"]]},{"label":"That is real; I see it happening in front of me; we all do","keys":[["real"],["happening"],["we all do"]]}],"title":"The biggest door, and the new doorways AI creates"},{"section":1,"paragraphs":["But even as I talk about the positives AI delivers, I need to acknowledge that AI is not immune from the duality of technology. The disruption, the displacement, the fear—these are real too.","It is not irrational for people to worry about their job security. It is not irrational for people to worry about their elderly parents falling victim to identity theft or deepfake scams. It is not irrational for people to worry about their children growing up in a less stable world disrupted more quickly than a UT freshman changes majors.","Some of the most powerful people in the AI world use language that leaves an independent observer uneasy. And for good reason.","This is the Duality of AI.","AI can give voice to people who have been talked over—and it can make it easier to counterfeit someone’s voice and steal their identity.","AI can help a first-time builder create something valuable—and it can allow a small group of companies to control the tools on which every builder depends.","AI can give us time back which we can use for our families, our friends, or ourselves—and it can tempt us to automate away the relationships that make the time worth having.","Both sides are real. Neither is guaranteed.","AI is not Field of Dreams. If we build it, the positive side will not magically come. As much as I love James Earl Jones and want this to be true.","No. The positive side of the duality has to be built on purpose. It requires people in positions of leadership—in technology, in business, in society—to become door openers.","But when we open the door and show people through, we create a whole new group of builders who can finally be seen, and who build better human experiences."],"id":10,"words":297,"beats":[{"label":"Even with the positives, AI isn't immune from the duality of technology: disruption, displacement, fear are real too","keys":[["positives"],["immune"],["duality"],["disruption"],["displacement"],["fear"]]},{"label":"Not irrational to worry about job security, elderly parents and identity theft or deepfake scams, or children in a less stable world disrupted faster than a UT freshman changes majors","keys":[["irrational"],["job security"],["elderly parents"],["identity theft"],["deepfake"],["children"],["freshman"],["majors"]]},{"label":"Some of the most powerful people in AI use language that leaves an observer uneasy, for good reason; this is the Duality of AI","keys":[["powerful people"],["language"],["uneasy"],["good reason"],["duality of ai"]]},{"label":"AI can give voice to the talked-over, and make it easier to counterfeit a voice and steal an identity","keys":[["voice"],["talked over"],["counterfeit"],["steal"],["identity"]]},{"label":"AI can help a first-time builder create value, and let a small group of companies control the tools every builder depends on","keys":[["first-time builder"],["valuable"],["small group of companies"],["control the tools"],["depends"]]},{"label":"AI can give us time back for family and friends, and tempt us to automate away the relationships that make the time worth having","keys":[["time back"],["families"],["friends"],["automate away"],["relationships"],["worth having"]]},{"label":"Both sides are real; neither is guaranteed","keys":[["both sides"],["real"],["neither"],["guaranteed"]]},{"label":"AI is not Field of Dreams: build it and the positive side won't magically come, much as I love James Earl Jones","keys":[["field of dreams"],["build it"],["magically"],["james earl jones"]]},{"label":"The positive side has to be built on purpose: leaders in technology, business, and society becoming door openers","keys":[["on purpose"],["leadership"],["technology"],["business"],["society"],["door openers"]]},{"label":"When we open the door and show people through, we get a new group of builders who can finally be seen and who build better human experiences","keys":[["open the door"],["show people through"],["builders"],["seen"],["human experiences"]]}],"title":"The Duality of AI: real fears, both sides, built on purpose"},{"section":1,"paragraphs":["Take J, my chief of staff. J is a former pro golfer. She won on the LPGA tour. Then, she excelled in a career as an operations expert in tech. I showed her how to use plain language to design an app in Lovable. She's built a whole series of apps since.","The one she is most proud of solved a problem that had her completely buried. She was running a charity golf event for Folds of Honor. The whole thing was being run out of her inbox. Sourcing donations over email, tracking donations over email, all of it. And the donors had no way to follow the players, who were golfing 185 holes in a single day to raise money to fund the education of kids for fallen military members.","J built a Lovable app to manage the donations coming in and send status updates back out. It took her a few hours. Then she added live scoring. Then she added a way for donors to send messages to the players while they were out on the course. All of this in a weekend.","What used to keep her up working until 2am just to stay afloat was now a slick app that not only let her get some sleep at night but was a better experience for the donors to a good cause.","I'll never forget how excited she was to tell me her app got over a thousand views on the day of the event.","Now, I can't stand up here and tell you that application views went up some clean percentage year over year. There's no baseline. That's the whole point. We're talking about doing brand-new things. Solving problems people used to be buried under. J could do it because she finally had a door open to her that, when she walked through it, enabled her to design and build software."],"id":11,"words":315,"beats":[{"label":"J, my chief of staff: former pro golfer, won on the LPGA tour, then an operations expert in tech","keys":[["j","jay"],["chief of staff"],["pro golfer"],["lpga"],["operations"]]},{"label":"I showed her plain-language app design in Lovable; she's built a whole series of apps since","keys":[["plain language"],["lovable","loveable"],["series of apps"]]},{"label":"Her proudest one solved a problem that had her buried: a Folds of Honor charity golf event run out of her inbox","keys":[["proud"],["buried"],["folds of honor"],["charity"],["inbox"]]},{"label":"Sourcing and tracking donations over email; donors had no way to follow players golfing 185 holes in a single day","keys":[["donations"],["email"],["donors"],["185"],["holes"],["single day"]]},{"label":"To fund the education of kids of fallen military members","keys":[["education"],["kids"],["fallen"],["military"]]},{"label":"J built a Lovable app for donations and status updates in a few hours; then live scoring, then donor messages to players; all in a weekend","keys":[["lovable","loveable"],["status updates"],["few hours"],["live scoring"],["messages"],["weekend"]]},{"label":"What kept her up until 2am became a slick app: some sleep, and a better experience for donors to a good cause","keys":[["2am"],["slick"],["sleep"],["better experience"],["good cause"]]},{"label":"She was so excited it got over a thousand views on the day of the event","keys":[["excited"],["thousand views"],["day of the event"]]},{"label":"I can't cite a clean year-over-year percentage; there's no baseline; that's the whole point: brand-new things, problems people were buried under","keys":[["percentage"],["year over year"],["baseline"],["whole point"],["brand-new"],["buried"]]},{"label":"J could do it because a door was finally open to her, and she walked through it to design and build software","keys":[["door"],["walked through"],["design and build"],["software"]]}],"title":"J, the LPGA pro who built the Folds of Honor app"},{"section":1,"paragraphs":["Or take an executive I work with, Karen. She owns tech for a multi-billion-dollar company. Before we ever met, Karen spent millions out of her own P&L on a project with Salesforce to modernize and secure her data infrastructure. A year and a half later, it still didn't work.","Karen walked into our first meeting like someone on a losing streak, bracing for one more. She'd been buried under a run of projects that didn't land, and somewhere in there she'd started to believe the problem was her.","It wasn't. So we didn't hire an army. We used open source, patterns, templates, and AI. And we built. Ninety days later she had the thing Salesforce couldn't deliver in eighteen months, and it cost her about 40% less.","The numbers aren't the only part I remember. What I remember is the text she sent me after. It said, \"working with you was the best decision in my career.\"","That’s not self promotion. All I did was open the door for her.","For years those tools sat behind a vendor and a purchase order, and Karen figured that door was closed to her. It wasn't. Open source had been open the whole time, everyone invited to the party, and the moment Karen walked through it she stopped buying software and started building it."],"id":12,"words":221,"beats":[{"label":"Karen owns tech for a multi-billion-dollar company","keys":[["karen"],["owns tech"],["multi-billion"],["company"]]},{"label":"She'd spent millions from her own P&L with Salesforce to modernize and secure her data infrastructure; a year and a half later it still didn't work","keys":[["millions"],["p&l"],["salesforce"],["modernize"],["secure"],["data infrastructure"],["year and a half"],["didn't work"]]},{"label":"She walked into our first meeting like someone on a losing streak, bracing for one more","keys":[["first meeting"],["losing streak"],["bracing"]]},{"label":"Buried under projects that didn't land, she'd started to believe the problem was her","keys":[["buried"],["projects"],["didn't land"],["problem was her"]]},{"label":"It wasn't. We didn't hire an army; open source, patterns, templates, AI, and we built","keys":[["hire an army"],["open source"],["patterns"],["templates"],["built"]]},{"label":"Ninety days later she had what Salesforce couldn't deliver in eighteen months, at about 40% less","keys":[["ninety days"],["salesforce"],["eighteen months"],["40 percent"]]},{"label":"What I remember is her text: \"working with you was the best decision in my career\"","keys":[["text"],["best decision"],["career"]]},{"label":"That's not self-promotion; all I did was open the door","keys":[["self promotion"],["open the door"]]},{"label":"Those tools sat behind a vendor and a purchase order; Karen figured that door was closed to her","keys":[["vendor"],["purchase order"],["door"],["closed"]]},{"label":"It wasn't; open source had been open the whole time, everyone invited to the party; she stopped buying software and started building it","keys":[["open source"],["whole time"],["invited"],["party"],["stopped buying"],["started building"]]}],"title":"Karen: 18 months with Salesforce, 90 days with open source"},{"section":1,"paragraphs":["Over more than a decade since I left Tennessee, my hands have been on code, and ideas, and product direction that touch a big share of the Fortune 100's technology stacks.","And when I decided to leave AWS, and start my own company in April 2025, with a mission to educate the curious about AI and to connect people through technology, Dr. Mike Berry sent me a note. It said, \"I've been waiting for you to do this.\"","And so this is what I want to talk about. This is why I am glad to be standing here and for you all to be here with me today.","This is the group of people who can help build the positive side of the duality. This is the group of people who can help open doors for more people.","I want to show you three places where that choice, that opportunity is already in front of us. At each one, I am going to hand you a question to carry out of this room so we can all be better door openers","[~17 min]"],"id":13,"words":181,"beats":[{"label":"Over a decade since Tennessee, my hands on code, ideas, and product direction across a big share of Fortune 100 tech stacks","keys":[["decade"],["tennessee"],["code"],["product direction"],["fortune 100"],["technology stacks"]]},{"label":"I left AWS in April 2025 to start my company: educate the curious about AI, connect people through technology","keys":[["aws"],["april 2025"],["educate"],["curious"],["connect people"]]},{"label":"Dr. Mike Berry sent a note: \"I've been waiting for you to do this\"","keys":[["berry"],["note"],["waiting for you"]]},{"label":"This is what I want to talk about; glad to be standing here with you all today","keys":[["talk about"],["glad"],["here with me"]]},{"label":"This is the group that can build the positive side of the duality and open doors for more people","keys":[["positive side"],["duality"],["open doors"],["more people"]]},{"label":"Three places where that choice, that opportunity, is already in front of us; at each one I'll hand you a question to carry out of this room, so we can all be better door openers","keys":[["three places"],["in front of us"],["each one"],["hand you a question"],["carry out of this room"],["door openers"]]}],"title":"Fortune 100, Dr. Berry's note, and three places"},{"section":2,"paragraphs":["Let me show you a quote that I read recently that rings true to me:","\"Today we stand on the threshold of a new industrial revolution, the revolution of automation. This is a revolution bright with the hope of a new prosperity for labor and a new abundance for America. But it is also a revolution which carries the dark menace of industrial dislocation, increasing unemployment, and deepening poverty.\"","Anyone know who that was? Any guesses?","That's John F. Kennedy. Read it again and try to tell me it wasn't written for this moment. What does that tell us? What does it tell us that a quote from the early 60s is equally applicable today? I suspect if we looked hard enough—or asked AI to look for us—we could find something similar from the 1890s or 1920s. In prehistoric times, Thog probably lamented the downfall of his sledge business when Grog invented the wheel.","As Mark Twain said—probably apocryphal because most things attributed to him weren’t said by him—history doesn’t repeat, but it rhymes. And AI is one of those rhymes of history."],"id":14,"words":183,"beats":[{"label":"A quote I read recently that rings true to me","keys":[["quote"],["recently"],["rings true"]]},{"label":"\"Threshold of a new industrial revolution, the revolution of automation; bright with the hope of new prosperity for labor and new abundance for America\"","keys":[["threshold"],["industrial revolution"],["automation"],["prosperity"],["labor"],["abundance"],["america"]]},{"label":"\"But also a revolution which carries the dark menace of industrial dislocation, increasing unemployment, and deepening poverty\"","keys":[["dark menace"],["dislocation"],["unemployment"],["poverty"]]},{"label":"Anyone know who that was? Any guesses? That's John F. Kennedy; try to tell me it wasn't written for this moment","keys":[["guesses"],["kennedy"],["written for this moment"]]},{"label":"What does it tell us that a quote from the early 60s applies today? Look hard enough, or ask AI, and you'd find one from the 1890s or 1920s","keys":[["early 60s"],["1890s"],["1920s"],["ask ai"]]},{"label":"Prehistoric times: Thog lamented the downfall of his sledge business when Grog invented the wheel","keys":[["prehistoric"],["thog"],["sledge"],["grog"],["wheel"]]},{"label":"Mark Twain, probably apocryphal: history doesn't repeat, but it rhymes; AI is one of those rhymes of history","keys":[["mark twain"],["apocryphal"],["repeat"],["rhymes"]]}],"title":"The JFK quote, Thog and Grog, history rhymes"},{"section":2,"paragraphs":["We invent new things. Those new things bring change. Change is disruptive. That disruption has positive effects and negative effects. This is the inherent tension in change.","But humans don’t like change. Macro, we are very adaptable as a species. Micro, we individuals like our things the way we like them.","We may understand intellectually that change is inevitable. But when it happens to us—when it alters our routines, threatens something we worked hard to build, or removes a path we thought we could count on—it does not feel like progress. It feels like loss. And sometimes, these paths we were counting on were built over years, decades, or even a whole lifetime. What do we do then?","And that is important, because it is tempting for those of us who are excited about AI to dismiss resistance as ignorance. We tell people they need to understand the technology better. We tell them disruption has happened before. We tell them that, in the long run, innovation creates more prosperity.","And that’s true, but tell that to the person who lost their job."],"id":15,"words":182,"beats":[{"label":"We invent new things; they bring change; change is disruptive, with positive and negative effects; that's the inherent tension in change","keys":[["invent"],["change"],["disruptive"],["positive"],["negative"],["inherent tension"]]},{"label":"Humans don't like change: macro, we're adaptable as a species; micro, we like our things the way we like them","keys":[["humans"],["macro"],["adaptable"],["species"],["micro"],["the way we like them"]]},{"label":"We understand intellectually that change is inevitable, but when it alters our routines, threatens what we built, or removes a path we counted on, it feels like loss, not progress","keys":[["intellectually"],["inevitable"],["routines"],["threatens"],["path"],["count on"],["progress"],["loss"]]},{"label":"Sometimes those paths took years, decades, or a whole lifetime; what do we do then?","keys":[["years"],["decades"],["lifetime"],["what do we do then"]]},{"label":"It's tempting for those excited about AI to dismiss resistance as ignorance: understand the tech better, disruption happened before, the long run creates prosperity","keys":[["tempting"],["dismiss"],["resistance"],["ignorance"],["understand the technology"],["happened before"],["long run"],["prosperity"]]},{"label":"That's true, but tell that to the person who lost their job","keys":[["tell that"],["lost their job"]]}],"title":"Change feels like loss, not progress"},{"section":2,"paragraphs":["The long run is an abstraction. People live in the present. They experience change one job, one bill, one community, and one decision at a time.","That is where leadership comes in. That is where people in this room with the power to resolve these tensions and open doors comes in.","The leaders in this room cannot make every consequence of AI positive. We cannot promise that no job will disappear, no community will face new costs, and no powerful institution will use AI in ways we wish it would not.","But we can influence how the change is experienced.","We can make the benefits more accessible. We can anticipate who is likely to carry the costs. We can help people move from one opportunity to the next. We can give more people a voice in the decisions that will shape their lives.","That is what it means to navigate the Duality of AI.","[21 MIN]"],"id":16,"words":154,"beats":[{"label":"The long run is an abstraction; people live in the present, one job, one bill, one community, one decision at a time","keys":[["long run"],["abstraction"],["present"],["one job"],["one bill"],["one community"],["one decision"]]},{"label":"That's where leadership comes in: people in this room with the power to resolve these tensions and open doors","keys":[["leadership"],["this room"],["power"],["resolve"],["tensions"],["open doors"]]},{"label":"Leaders can't make every consequence positive; we can't promise no job disappears, no community faces new costs, no powerful institution misuses AI","keys":[["every consequence"],["promise"],["disappear"],["new costs"],["powerful institution"]]},{"label":"But we can influence how the change is experienced","keys":[["influence"],["experienced"]]},{"label":"Make the benefits more accessible; anticipate who carries the costs; help people move to the next opportunity; give more people a voice in the decisions shaping their lives","keys":[["benefits"],["accessible"],["anticipate"],["costs"],["opportunity"],["voice"],["decisions"]]},{"label":"That is what it means to navigate the Duality of AI","keys":[["navigate"],["duality of ai"]]}],"title":"The long run is an abstraction: where leadership comes in"},{"section":3,"paragraphs":["Let’s take the first great tension: jobs.","As with every major technological disruption, AI will eliminate jobs.","That is as inevitable as the decline of Thog’s sledge-making shop.","But equally inevitable is the creation of new work.","Grog needed someone to make wheels. Then someone had to build the cart. Someone had to repair it, improve it, sell it, and figure out what else could be moved once moving things became easier.","Sometimes, the skills transfer.","If you can make a sledge, probably you can make a cart. Perhaps you can learn to make a wheel.","But sometimes, the skills do not transfer easily.","When a robot automates an assembly-line job, it is technically possible that the displaced worker will retrain in advanced robotics or software engineering.","But “technically possible” is doing a lot of work there.","The evidence from previous waves of automation does not give us great confidence that everyone who loses a job will simply move into one of the new jobs being created. In 1950, almost 1.5 million people worked as telephone switchboard operators, either for the Bell system or in offices, hotels, and factories. By 1984 that number fell to 40,000. Today, it’s under 2,000.","These jobs disappeared as new ones were created—first people to design and build the automation systems, engineering jobs; then people to maintain that automation, like linemen and other electrical and mechanical repair jobs; then eventually it’s computerized, which is a whole new category of jobs, and so on. Those new jobs may require different skills. They may be located somewhere else. They may arrive years after the old job disappears. And they may go to entirely different people.","That is the part we lose when we talk only in aggregate.","Economists treat jobs as a statistic. But for an individual, they are mortgages, college tuitions, food on the table; and they are also identity, dignity, community, and a sense of value."],"id":17,"words":321,"beats":[{"label":"First great tension, jobs: like every disruption, AI will eliminate jobs, as inevitable as the decline of Thog's sledge-making shop","keys":[["first great tension"],["eliminate"],["inevitable"],["thog"],["sledge"]]},{"label":"Equally inevitable: the creation of new work; Grog needed wheel makers, cart builders, repairers, sellers, and people to figure out what else to move","keys":[["equally inevitable"],["creation"],["new work"],["grog"],["wheels"],["cart"],["repair"],["sell"],["moved"]]},{"label":"Sometimes the skills transfer: a sledge maker can make a cart, maybe learn to make a wheel; but sometimes they don't transfer easily","keys":[["skills transfer"],["sledge"],["cart"],["wheel"],["transfer easily"]]},{"label":"A robot automates an assembly-line job; it's \"technically possible\" the displaced worker retrains in robotics or software engineering","keys":[["robot"],["assembly-line"],["technically possible"],["retrain"],["robotics"],["software engineering"]]},{"label":"\"Technically possible\" is doing a lot of work there","keys":[["technically possible"],["lot of work"]]},{"label":"Previous waves of automation don't give us confidence that everyone who loses a job moves into a new one","keys":[["previous waves"],["confidence"],["loses a job"],["new jobs"]]},{"label":"In 1950, almost 1.5 million telephone switchboard operators, for the Bell system or in offices, hotels, and factories","keys":[["1950"],["1.5 million","half million"],["telephone"],["switchboard"],["operators"],["bell"],["hotels"]]},{"label":"By 1984 that fell to 40,000; today it's under 2,000","keys":[["1984"],["40,000"],["today"],["2,000"]]},{"label":"New jobs came: first engineers to design and build the automation; then maintenance, linemen, electrical and mechanical repair; then it's computerized, a whole new category","keys":[["design and build"],["automation"],["engineering"],["maintain"],["linemen"],["electrical"],["mechanical"],["computerized"],["category"]]},{"label":"New jobs may require different skills, be located somewhere else, arrive years after the old job disappears, and go to entirely different people","keys":[["different skills"],["somewhere else"],["years after"],["different people"]]},{"label":"That's the part we lose when we talk only in aggregate","keys":[["lose"],["aggregate"]]},{"label":"Economists treat jobs as a statistic; for an individual they're mortgages, college tuitions, food on the table, and identity, dignity, community, a sense of value","keys":[["statistic"],["mortgages"],["tuitions"],["food on the table"],["identity"],["dignity"],["sense of value"]]}],"title":"Jobs: Thog's sledge shop, the switchboard operators, and what we lose in aggregate"},{"section":3,"paragraphs":["And what happens when the disruption begins early in a career?","AI is already capable of performing some of the basic work traditionally assigned to entry-level employees: initial research, first drafts, basic analysis, routine coding, and administrative coordination.","Those tasks may not be glamorous. But they are often how people learn.","The first rung of a career is where someone watches more experienced colleagues, makes manageable mistakes, begins developing judgment, and earns the opportunity to take on more consequential work.","If AI removes the first rung, how does the next generation reach the second? We told young people to get an education and prepare for the jobs of the future. They did. And today, 42% of recent college graduates are underemployed—working in jobs that don’t require degrees and another 6% cannot find work at all.","And it’s not just the lack of opportunity. It’s deeper. A young person can do everything we told them to do—study hard, earn the credential, develop the right skills—and still discover that the bargain changed while they were preparing to enter it.","That’s a recipe for someone losing faith in the system."],"id":18,"words":187,"beats":[{"label":"What happens when the disruption begins early in a career?","keys":[["disruption"],["early"],["career"]]},{"label":"AI already does entry-level work: initial research, first drafts, basic analysis, routine coding, administrative coordination","keys":[["entry-level"],["initial research"],["first drafts"],["basic analysis"],["routine coding"],["administrative coordination"]]},{"label":"Not glamorous, but that's often how people learn","keys":[["glamorous"],["how people learn"]]},{"label":"The first rung: watch experienced colleagues, make manageable mistakes, develop judgment, earn more consequential work","keys":[["first rung"],["experienced colleagues"],["manageable mistakes"],["judgment"],["consequential"]]},{"label":"If AI removes the first rung, how does the next generation reach the second?","keys":[["removes the first rung"],["next generation"],["second"]]},{"label":"We told young people to get an education for the jobs of the future; they did; today 42% of recent grads are underemployed and another 6% can't find work","keys":[["education"],["jobs of the future"],["42 percent"],["underemployed"],["degrees"],["6 percent"]]},{"label":"It's deeper than lack of opportunity: study hard, earn the credential, develop the skills, and still find the bargain changed while you were preparing to enter it","keys":[["deeper"],["study hard"],["credential"],["bargain"],["changed"]]},{"label":"That's a recipe for someone losing faith in the system","keys":[["recipe"],["faith"],["system"]]}],"title":"The first rung: entry-level work and Gen Z"},{"section":3,"paragraphs":["We should not answer that anxiety with a lecture about productivity.","We should answer it with honesty.","Some jobs will disappear. Some career paths will narrow. Some hard-earned skills will become less valuable. That is one side of the Duality. But it is not the only side.","At the same time that AI is closing off some forms of work, it is dramatically lowering the threshold for creating others.","My dear friend Joyce is a Pilates instructor. She runs her own studio. She is talented, disciplined, and exceptionally capable — she has helped people like me, with severe disabling injuries, find mobility again.","But she never thought of herself as a software developer.","In one hour, I showed her how she could use AI to create an email agent.","I did not build anything for her. I did not hand her a finished answer.","I simply helped her see that a door she had assumed was closed was now open."],"id":19,"words":160,"beats":[{"label":"Don't answer that anxiety with a lecture about productivity; answer it with honesty","keys":[["anxiety"],["lecture"],["productivity"],["honesty"]]},{"label":"Some jobs will disappear, some career paths narrow, some hard-earned skills become less valuable","keys":[["disappear"],["narrow"],["hard-earned"],["less valuable"]]},{"label":"That's one side of the duality; but not the only side","keys":[["one side"],["duality"],["only side"]]},{"label":"Even as AI closes off some work, it dramatically lowers the threshold for creating other work","keys":[["closing off"],["dramatically"],["lowering the threshold"],["creating others"]]},{"label":"My dear friend Joyce, a Pilates instructor with her own studio; talented, disciplined, exceptionally capable; she helped people like me with severe disabling injuries find mobility again","keys":[["joyce"],["pilates"],["studio"],["talented"],["disabling injuries"],["mobility"]]},{"label":"But she never thought of herself as a software developer","keys":[["software developer"],["never thought"]]},{"label":"In one hour I showed her how she could use AI to create an email agent","keys":[["one hour"],["email agent"]]},{"label":"I didn't build anything or hand her a finished answer; I helped her see that a door she assumed was closed was now open","keys":[["did not build","didn't build"],["finished answer"],["door"],["assumed"],["closed"],["open"]]}],"title":"Answer with honesty; the other side of the duality: Joyce"},{"section":3,"paragraphs":["Joyce started as a one-woman shop teaching one-on-one lessons. Her business has since grown into a full gym — a room of clients, multiple teachers, and genuinely complicated schedules. The hour we spent together was on a Claude agent to help her with email.","Two weeks later, I opened her scheduling app to book a class and noticed something new. I could type: book me in the Tuesday 8am class for the next ten weeks.","And it just happened.","No hundred clicks. One sentence in English. She had gone from an email agent to connecting Claude and MCP servers into her business's actual stack.","I never asked her to build that. I only showed her how.","Now I save my time and show up differently at her studio. And in class, I hear other clients talking about the new feature and how much it helps them too.","It was something useful that had never existed, built by someone who had never thought the word \"builder\" applied to her.","That is also real.","AI can expand the range of things people are capable of doing. It can allow someone who understands a problem—but lacks technical vocabulary, formal credentials, or a large budget—to begin creating a solution."],"id":20,"words":205,"beats":[{"label":"Joyce went from a one-woman shop with one-on-one lessons to a full gym: a room of clients, multiple teachers, complicated schedules","keys":[["one-woman"],["one-on-one"],["full gym"],["clients"],["teachers"],["schedules"]]},{"label":"The hour we spent together was on a Claude agent to help with her email","keys":[["hour"],["claude agent"],["email"]]},{"label":"Two weeks later her scheduling app let me type \"book me in the Tuesday 8am class for the next ten weeks,\" and it just happened","keys":[["two weeks"],["scheduling app"],["tuesday"],["8am"],["ten weeks"],["just happened"]]},{"label":"No hundred clicks; one sentence in English; she'd gone from an email agent to connecting Claude and MCP servers into her business's actual stack","keys":[["hundred clicks"],["one sentence"],["english"],["mcp"],["actual stack"]]},{"label":"I never asked her to build that; I only showed her how","keys":[["never asked"],["showed her how"]]},{"label":"Now I save my time and show up differently at her studio; other clients talk about how much the new feature helps them too","keys":[["save my time"],["show up differently"],["studio"],["clients"],["new feature"]]},{"label":"Something useful that had never existed, built by someone who never thought the word \"builder\" applied to her; that is also real","keys":[["useful"],["never existed"],["builder"],["applied"],["also real"]]},{"label":"AI expands what people are capable of: someone who understands a problem but lacks technical vocabulary, formal credentials, or a large budget can begin creating a solution","keys":[["expand"],["capable"],["understands a problem"],["technical vocabulary"],["credentials"],["budget"],["solution"]]}],"title":"Joyce's scheduling app: one sentence in English"},{"section":3,"paragraphs":["But people will not automatically discover that potential simply because the technology exists.","AI is not magic opportunity dust. We cannot scatter it across an organization and assume everyone will benefit.","Joyce did not need me to build her app. But she did need someone to show her that she could. She did need someone to open the door for her.","That is the leadership responsibility inside this tension.","Who in your organization could do more meaningful work if someone made these new capabilities accessible to them?","Who has insight but not the title? Who understands the problem but lacks the technical vocabulary? Who has never been invited to see themselves as a builder?","And at the same time, who is standing in front of a closing door with no clear path to the next one?","Opening doors means doing both: giving people genuine access to the new tools and helping people navigate the disruption those tools create.","So here is the first question I want you to carry out of this room. Who gets the tools, and who gets a path when their old one closes?","Because access without transition is abandonment, and protection without access is exclusion.","[28]"],"id":21,"words":199,"beats":[{"label":"People won't automatically discover that potential just because the technology exists","keys":[["automatically"],["discover"],["potential"],["technology exists"]]},{"label":"AI is not magic opportunity dust to scatter across an organization","keys":[["magic opportunity dust"],["scatter"],["organization"]]},{"label":"Joyce didn't need me to build her app; she needed someone to show her that she could, to open the door; that's the leadership responsibility inside this tension","keys":[["joyce"],["build her app"],["show her"],["open the door"],["leadership responsibility"]]},{"label":"Who in your organization could do more meaningful work if these new capabilities were made accessible to them?","keys":[["organization"],["meaningful work"],["capabilities"],["accessible"]]},{"label":"Who has insight but not the title, understands the problem but lacks the vocabulary, has never been invited to see themselves as a builder?","keys":[["insight"],["title"],["vocabulary"],["invited"],["builder"]]},{"label":"And who is standing in front of a closing door with no clear path to the next one?","keys":[["closing door"],["clear path"],["next one"]]},{"label":"Opening doors means doing both: genuine access to the new tools, and help navigating the disruption those tools create","keys":[["doing both"],["genuine access"],["new tools"],["navigate"],["disruption"]]},{"label":"The first question to carry out of this room: who gets the tools, and who gets a path when their old one closes?","keys":[["first question"],["carry out of this room"],["who gets the tools"],["path"],["old one closes"]]},{"label":"Because access without transition is abandonment, and protection without access is exclusion","keys":[["transition"],["abandonment"],["protection"],["exclusion"]]}],"title":"Not magic opportunity dust: the leadership responsibility"},{"section":4,"paragraphs":["The second great tension is about who benefits—and who pays.","AI has the potential to create extraordinary value. It can help businesses grow, enable entrepreneurs to compete, accelerate scientific research, improve public services, and bring entirely new investment or products to places and communities that stand to benefit.","But economic growth does not automagically equate to community prosperity.","A company can become more productive while employing fewer people locally. Small businesses can gain powerful new capabilities and simultaneously find themselves competing against companies with vastly greater access to data and computing power. And the physical infrastructure required to power AI can bring new investment while placing new demands on land, electricity, water, and noise pollution. This is the data center debate that is raging today.","There are real benefits and real costs. That is the tension. And this tension demands we acknowledge the responsibility that comes with those benefits.","A community can gain investment and still feel strained by it—again, data centers are not simply a cost-free economic boon. A business can become more productive while its workers feel less secure. A new technology can create real opportunity without making that opportunity visible or accessible to the people who live nearby.","That is the tension. And we need to be honest about it.","Will AI help more communities build durable prosperity? Or will its greatest benefits pass through them—or pass them by—while they absorb much of the disruption?"],"id":22,"words":238,"beats":[{"label":"The second great tension: who benefits, and who pays","keys":[["second great tension"],["benefits"],["pays"]]},{"label":"AI can create extraordinary value: businesses grow, entrepreneurs compete, research accelerates, public services improve, new investment reaches communities that stand to benefit","keys":[["extraordinary value"],["businesses grow"],["entrepreneurs"],["scientific research"],["public services"],["investment"],["communities"]]},{"label":"But economic growth does not automagically equate to community prosperity","keys":[["economic growth"],["automagically"],["community prosperity"]]},{"label":"A company gets more productive while employing fewer people locally; small businesses gain capabilities yet compete against companies with vastly more data and computing power","keys":[["productive"],["fewer people"],["locally"],["small businesses"],["capabilities"],["competing"],["computing power"]]},{"label":"AI's physical infrastructure brings investment while demanding land, electricity, water, and creating noise; that's the data center debate raging today","keys":[["physical infrastructure"],["land"],["electricity"],["water"],["noise"],["data center debate"]]},{"label":"Real benefits and real costs; that is the tension; it demands we acknowledge the responsibility that comes with the benefits","keys":[["real benefits"],["real costs"],["tension"],["responsibility"]]},{"label":"A community can gain investment and still feel strained; data centers aren't a cost-free boon; workers can feel less secure; opportunity can be invisible to the people nearby","keys":[["strained"],["cost-free"],["boon"],["less secure"],["visible"],["nearby"]]},{"label":"That's the tension; be honest: will AI help communities build durable prosperity, or will its benefits pass through them or pass them by while they absorb the disruption?","keys":[["honest"],["durable prosperity"],["pass through"],["pass them by"],["absorb"],["disruption"]]}],"title":"Data centers: who benefits and who pays"},{"section":4,"paragraphs":["Those questions are not anti-business or anti-technology. They are fundamental business questions.","What will this investment require? What value will it create? Who will be able to participate?","Henry Ford was an advocate for paying his workers a good wage because he knew the way to sell more cars was to facilitate more people with the wherewithal to buy them.","This tension demands we acknowledge the responsibility that comes with those benefits.","Responsible business leaders want AI investment to leave communities stronger than it found them. Because this creates a virtuous cycle of opportunity for the business.","That can mean creating pathways into new kinds of work rather than simply importing talent. It can mean helping local businesses adopt AI rather than allowing only the largest companies to capture its productivity gains. It can mean partnering with schools, universities, and workforce programs so that the capabilities created locally remain local.","And yes, it also means paying attention to infrastructure.","For many people, a data center is the first part of the AI economy they can actually see.","The model is abstract. The algorithm is invisible. But the building at the edge of town is concrete."],"id":23,"words":195,"beats":[{"label":"Not anti-business or anti-technology; fundamental business questions: what will it require, what value will it create, who can participate?","keys":[["anti-business"],["anti-technology"],["fundamental"],["require
