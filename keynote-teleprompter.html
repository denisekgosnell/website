  var DATA = {"sections":[{"title":"Part 1. Personal anecdote—when you first saw the power of Opening Doors for others","cards":3,"words":587,"short":"Part 1 · Micah","color":"#d97706"},{"title":"Part 2. Who I am / Introduction of the “Duality of AI”","cards":15,"words":1433,"short":"Part 2 · Who I Am","color":"#0d9488"},{"title":"The First Great Tension: AI Will Create new Jobs—and Eliminate others","cards":7,"words":611,"short":"Tension 1 · Jobs","color":"#2563eb"},{"title":"The Second Great Tension: AI Can Create Shared Prosperity—or Become Extractive","cards":8,"words":767,"short":"Tension 2 · Prosperity","color":"#16a34a"},{"title":"The Third Great Tension: AI Can Democratize Control—or Concentrate It","cards":8,"words":996,"short":"Tension 3 · Control","color":"#e11d48"},{"title":"PART 4. STRATEGY AND EXECUTION: WRITING IS THINKING","cards":15,"words":1291,"short":"Part 4 · Writing","color":"#c2410c"},{"title":"PART 5. CONCLUSION: BE A DOOR-OPENER","cards":2,"words":564,"short":"Part 5 · Door-Opener","color":"#7c3aed"}],"cards":[{"section":0,"paragraphs":["In late April of 2014, I was 27 years old, standing at the front of a lecture hall, just down the street.","It was room 525 in the brand new Min Kao building. I was proctoring the final exam for Dr. Mike Berry's spring CS 102 class. This was my last final as a teaching assistant. There were about a hundred and twenty students, heads down, working through the written part of their computer science final. This was their last gate before summer break, and you could feel the freedom boxed into the lecture hall, yearning to be set loose.","Like any college class, some of the students were deeply passionate about the subject. This was what they loved. Others were simply checking a “general education” box in order to graduate. They thought computer science would be easy or interesting enough compared to their other choices like stats or calculus."],"id":1,"words":150,"beats":[{"label":"Late April 2014, I was 27, at the front of a lecture hall just down the street","keys":[["april"],["2014"],["27"],["lecture hall"],["down the street"]]},{"label":"Room 525 in the brand new Min Kao building","keys":[["525"],["min kao","min cow","minkao"],["brand new"]]},{"label":"Proctoring Dr. Mike Berry's spring CS 102 final, my last as a teaching assistant","keys":[["proctoring"],["berry"],["102"],["last final"],["teaching assistant","ta"]]},{"label":"About 120 students, heads down, working through the written part of their final","keys":[["120"],["heads down"],["written"],["students"]]},{"label":"Their last gate before summer break; freedom boxed into the hall, yearning to be set loose","keys":[["last gate"],["summer break"],["freedom"],["set loose"]]},{"label":"Some students were deeply passionate, this was what they loved; others were checking a general-education box to graduate","keys":[["passionate"],["loved"],["general education"],["box"]]},{"label":"They figured CS would be easy or interesting enough compared to stats or calculus","keys":[["easy"],["interesting"],["stats"],["calculus"]]}],"title":"Slide 2 · TN PHOTOS"},{"section":0,"paragraphs":["One of those students was Micah. Micah was just shy of 6 feet tall, dark haired. Kinda generic college student from central casting for your “average student.” In the beginning, he mostly attended classes, got middle of the pack grades, and usually turned in his homework. He reminds me of so many of my colleagues and employees: they show up, do the work, and don’t make waves in either direction.","Micah never really stood out. But he was a curious student. As the semester went on, you could see him getting more and more energized by the subject. The “mostly showed up” turned into “always showed up.” I could see that something was clicking for him. Something was energizing him. I get energized just thinking about how excited he was—I can still see his face, his smile when he figured out “for loops” in the lab by printing out each iteration’s data.","That was when Micah saw the compounding benefits of automation.","So there I was, standing in room 525, in front of Dr. Berry’s CS 102 final exam. Students are finishing, turning in their blue books—remember those? Well, they’re probably coming back.","Then, Micah puts his pencil down, packs up, walks to the front, and instead of placing his blue book on the desk, he hands it to me. Then he proceeds to give me the biggest bear hug of my life, lifts me clean off the ground.","He puts me down, thanks me and tells me that he took this class just wanting a box checked, but somewhere in the semester he found a new passion for solving invisible math puzzles. Which is pretty much what computer science in industry actually feels like…if you add in solving those puzzles while driving a speeding Ferrari down a moving highway of burning cars and collapsing bridges, that’s exactly what it feels like today, but I’m skipping ahead.","Micah walked out of the room, and Dr. Berry turned to me and said, \"I've never seen anything like that. The way you share your curiosity and your passion for computing, you've lit that kid on fire.\" Micah later told Dr. Berry that he was switching his major to computer science, and he wanted to thank me for showing him his path.","And that is why I'm standing here today."],"id":2,"words":387,"beats":[{"label":"One of those students was Micah: just shy of 6 feet tall, dark haired","keys":[["micah"],["6 feet"],["dark haired"]]},{"label":"Generic college student from central casting, your average student","keys":[["generic"],["central casting"],["average student"]]},{"label":"Mostly attended, middle-of-the-pack grades, usually turned in his homework","keys":[["attended"],["middle of the pack"],["grades"],["homework"]]},{"label":"Like so many colleagues and employees: show up, do the work, don't make waves","keys":[["colleagues"],["employees"],["show up"],["do the work"],["waves"]]},{"label":"Micah never stood out, but he was a curious student","keys":[["stood out"],["curious"]]},{"label":"As the semester went on he got more and more energized; \"mostly showed up\" became \"always showed up\"","keys":[["semester"],["energized"],["mostly showed up"],["always showed up"]]},{"label":"Something was clicking; I can still see his smile when he figured out for loops by printing out each iteration's data","keys":[["clicking"],["smile"],["for loops"],["printing"],["iteration"]]},{"label":"That was when Micah saw the compounding benefits of automation","keys":[["compounding"],["benefits"],["automation"]]},{"label":"So there I was, standing in room 525, at Dr. Berry's CS 102 final exam","keys":[["525"],["berry"],["102"],["final exam"]]},{"label":"Students finishing, turning in blue books; remember those? They're probably coming back","keys":[["blue books"],["remember those"],["coming back"]]},{"label":"Micah puts his pencil down, packs up, walks to the front, and hands his blue book to me instead of the desk","keys":[["pencil"],["packs up"],["front"],["desk"],["hands it to me"]]},{"label":"The biggest bear hug of my life; lifts me clean off the ground","keys":[["bear hug"],["biggest"],["lifts"],["off the ground"]]},{"label":"He puts me down, thanks me: he took the class just wanting a box checked","keys":[["puts me down"],["thanks me"],["box checked"]]},{"label":"Somewhere in the semester he found a new passion for solving invisible math puzzles","keys":[["passion"],["invisible math puzzles","invisible"],["puzzles"]]},{"label":"That's what industry CS feels like, plus a speeding Ferrari down a highway of burning cars and collapsing bridges; but I'm skipping ahead","keys":[["ferrari"],["speeding"],["burning cars"],["collapsing bridges"],["skipping ahead"]]},{"label":"Micah walked out; Dr. Berry turned to me: \"I've never seen anything like that\"","keys":[["walked out"],["berry"],["never seen anything like that"]]},{"label":"\"The way you share your curiosity and passion for computing, you've lit that kid on fire\"","keys":[["curiosity"],["passion"],["computing"],["lit that kid on fire"]]},{"label":"Micah later told Dr. Berry he was switching his major to computer science and wanted to thank me for showing him his path","keys":[["switching his major","switched his major","changed his major"],["major"],["thank me","thanked me"],["showing him his path","his path"]]},{"label":"And that is why I'm standing here today","keys":[["standing here today"]]}],"title":"Slide 3 · ONE STUDENT"},{"section":0,"paragraphs":["I thought I had spent the semester teaching computer science. What I had really done was open a door. Micah was the one who walked through it.","But first, somebody had to make the door visible.","Good morning and Welcome to the inaugural AI-NO-vation Summit. My name is Denise Gosnell."],"id":3,"words":50,"beats":[{"label":"Good morning, welcome to the inaugural AI-NO-vation Summit; my name is Denise Gosnell","keys":[["good morning"],["inaugural"],["summit"],["denise gosnell"]]},{"label":"I thought I had taught computer science; what I had really done was open a door; Micah walked through it, but first somebody had to make the door visible","keys":[["teaching computer science"],["open a door"],["walked through"],["visible"]]}],"title":"Slide 4 · DOOR"},{"section":1,"paragraphs":["I love a good puzzle. Whether it’s the “invisible math puzzles” that Micah discovered he loved, or the practical business puzzle, or the 2000 piece jigsaw puzzle of the Appalachian Trail…I can lose myself in them for hours or days on end. Puzzles have never once felt like work.","I’m fortunate in that way. I love what I get to do."],"id":4,"words":61,"beats":[{"label":"I love a good puzzle: invisible math puzzles, the business puzzle, the 2000-piece Appalachian Trail jigsaw","keys":[["puzzle"],["business puzzle"],["2000"],["appalachian trail"],["jigsaw"]]},{"label":"Hours or days on end; puzzles never once felt like work; I'm fortunate, I love what I get to do","keys":[["hours"],["days"],["felt like work"],["fortunate"],["love what I get to do"]]}],"title":"Slide 5 · PUZZLE PIECES"},{"section":1,"paragraphs":["After finishing my PhD, there was only one destination for me: Silicon Valley. I wanted to learn and build from the best. I wanted to learn how the best builders in the world turned code into products. But I also wanted to see how those products became things people could actually use. How people’s jobs or lives were impacted and enhanced by things that started out as an idea and some code.","While in Silicon Valley, I quickly fell into the gravity well of open source. Think of open source like academia at its best. Everyone's invited, everyone shares, and the reward isn't hoarding what you know. It's being the one who figured it out first and told everybody.","I became a leader in open-source graph technology and helped dozens of organizations like Netflix, Starbucks, Home Depot, FedEx, SnapChat, and the Federal Government connect data in ways that break silos. Of course, a broken silo itself is a duality—it breaks somebody's closed, comfortable model of how the world was supposed to work and replaces it with an opportunity for someone else."],"id":5,"words":181,"beats":[{"label":"After my PhD, one destination: Silicon Valley, to learn and build from the best","keys":[["phd"],["destination"],["silicon valley"],["learn and build"],["best"]]},{"label":"How the best builders turned code into products, and how products became things people could actually use","keys":[["builders"],["code into products"],["actually use"]]},{"label":"How people's jobs and lives were impacted and enhanced by an idea and some code","keys":[["jobs"],["lives"],["impacted"],["enhanced"],["idea"]]},{"label":"In Silicon Valley I fell into the gravity well of open source","keys":[["silicon valley"],["gravity well"],["open source"]]},{"label":"Open source is academia at its best: everyone's invited, everyone shares; the reward isn't hoarding, it's figuring it out first and telling everybody","keys":[["academia"],["invited"],["shares"],["hoarding"],["first"],["told everybody"]]},{"label":"I became a leader in open-source graph technology and helped dozens of organizations, Netflix, Starbucks, Home Depot, FedEx, SnapChat, the Federal Government, connect data in ways that break silos","keys":[["leader"],["graph"],["dozens of organizations"],["netflix"],["starbucks"],["home depot"],["fedex"],["snapchat"],["federal government"],["break silos"]]},{"label":"A broken silo is itself a duality: it breaks somebody's closed, comfortable model of the world and replaces it with someone else's opportunity","keys":[["broken silo"],["duality"],["comfortable"],["model"],["opportunity"]]}],"title":"Slide 6 · SILICON VALLEY"},{"section":1,"paragraphs":["Like that time - Right after my PhD at a healthcare startup here in Charleston South Carolina, I helped to expose a $20M medicare fraud scheme simply by connecting data sets together.","That same start-up built automated healthcare claims processing and saved people real money. But it did it by making pharmaceutical drug prices transparent and exposed games the PBMs were running… so you can guess what happened next: [pause] a PBM sued us out of existence.","After enough times, you stop seeing innovation as one thing. What you build as a door for one person is a wall coming down for someone else."],"id":6,"words":103,"beats":[{"label":"That startup automated claims processing and saved people real money","keys":[["claims processing"],["saved"],["real money"]]},{"label":"It made drug prices transparent and exposed the PBMs' games, so a PBM sued us out of existence","keys":[["drug prices"],["transparent"],["pbms"],["sued"],["out of existence"]]},{"label":"You stop seeing innovation as one thing: a door for one person is a wall coming down for someone else","keys":[["innovation"],["one thing"],["door"],["wall coming down"]]},{"label":"Like that time - Right after my PhD at…","keys":[["time"],["right"],["after"]]}],"title":"Slide 7 · HEALTHCARE GRAPH"},{"section":1,"paragraphs":["Here’s the important thing about that:","The technology doesn't pick. People do.","So here's something else about me. I've always felt like I lived in a duality between what makes sense to me and what everybody else says is true. This isn’t like colorblindness where I think green looks orange. Or my firm belief that Peyton Manning is the actual mayor of Knoxville, period.","It’s more that my biggest moments of synthesis often don’t arrive in the moment, while reading at my desk, or listening to a lecture back here in my grad days. Rather, they arrive later, when I’m moving.","Some of my best thoughts arrive while I’m swimming laps, for example. That is how my mind works. I understand by moving. Talking. Testing. Making."],"id":7,"words":126,"beats":[{"label":"The technology doesn't pick. People do.","keys":[["technology doesn't pick"],["people do"]]},{"label":"My biggest moments of synthesis don't arrive at my desk or in a lecture; they arrive later, when I'm moving","keys":[["synthesis"],["desk"],["lecture"],["moving"]]},{"label":"That's how my mind works: I understand by moving, talking, testing, making","keys":[["mind works"],["moving"],["talking"],["testing"],["making"]]},{"label":"Here’s the important thing about that:","keys":[["heres"],["important"],["thing"]]},{"label":"So here's something else about me. I've always felt…","keys":[["heres"],["something"],["else"]]},{"label":"Some of my best thoughts arrive while I’m swimming…","keys":[["best"],["thoughts"],["arrive"]]}],"title":"Slide 8 · DOOR: HEADLINE"},{"section":1,"paragraphs":["If you go down the research rabbit hole on this, professionals in this space sort people’s creating and learning styles into four buckets.","1. Visual.","2. Auditory.","3. Reading and writing.","4. Kinesthetic.","I’m the kinesthetic type. Things click for me when I’m moving.","Traditional software development is really tailored for the reading and writing learners who can express ideas in languages like Python, Java, C++. If that’s hard for you, you were standing outside the door."],"id":8,"words":73,"beats":[{"label":"Researchers sort learning styles into four buckets: visual, auditory, reading and writing, kinesthetic","keys":[["four buckets"],["visual"],["auditory"],["reading and writing"],["kinesthetic"]]},{"label":"I'm the kinesthetic type; things click for me when I'm moving","keys":[["kinesthetic type"],["click"],["moving"]]},{"label":"If you go down the research rabbit hole on…","keys":[["research"],["rabbit"],["hole"]]},{"label":"Traditional software development is really tailored for the reading…","keys":[["traditional"],["software"],["development"]]}],"title":"Slide 9 · LEARNING STYLES"},{"section":1,"paragraphs":["AI, however, is opening that door.","Someone who can describe the problem in plain English—or French or Mandarin or Hungarian—can begin to build their solution.","Someone who struggles to turn an idea into a polished memo can literally talk it through and discuss it with Claude to find the shape of their argument.","Someone overwhelmed by a dozen competing responsibilities can create a system that gives them more of their day—and more of themselves—back.","That is real. I see it happening in front of me. We all do.","When we open the door and show people through, we create a whole new group of builders who can finally be seen, and who build better human experiences."],"id":9,"words":116,"beats":[{"label":"That is real; I see it happening in front of me; we all do","keys":[["real"],["happening"],["we all do"]]},{"label":"Someone who struggles to write a memo can talk it through with Claude to find the shape of their argument","keys":[["memo"],["talk it through"],["claude"],["shape"],["argument"]]},{"label":"Someone overwhelmed by a dozen responsibilities can create a system that gives them their day, and themselves, back","keys":[["overwhelmed"],["dozen"],["responsibilities"],["system"],["more of their day"]]},{"label":"AI, however, is opening that door.","keys":[["however"],["opening"],["door"]]},{"label":"Someone who can describe the problem in plain English—or…","keys":[["someone"],["describe"],["problem"]]},{"label":"When we open the door and show people through,…","keys":[["open"],["door"],["show"]]}],"title":"Slide 10 · CODE"},{"section":1,"paragraphs":["Take J, my chief of staff. J is a former pro golfer. She won on the LPGA tour. Then, she excelled in a career as an operations expert in tech. I showed her how to use plain language to design an app in Lovable. She's built a whole series of apps since.","The one she is most proud of solved a problem that had her completely buried. She was running a charity golf event for Folds of Honor."],"id":10,"words":78,"beats":[{"label":"J, my chief of staff: former pro golfer, won on the LPGA tour, then an operations expert in tech","keys":[["j","jay"],["chief of staff"],["pro golfer"],["lpga"],["operations"]]},{"label":"I showed her plain-language app design in Lovable; she's built a whole series of apps since","keys":[["plain language"],["lovable","loveable"],["series of apps"]]},{"label":"The one she is most proud of solved a…","keys":[["proud"],["solved"],["problem"]]}],"title":"Slide 11 · J SWING"},{"section":1,"paragraphs":["J built a Lovable app to manage the donations coming in and send status updates back out. It took her a few hours. Then she added live scoring. Then she added a way for donors to send messages to the players while they were out on the course. All of this in a weekend.","I'll never forget how excited she was to tell me her app got over a thousand views on the day of the event."],"id":11,"words":77,"beats":[{"label":"J built a Lovable app for donations and status updates in a few hours; then live scoring, then donor messages to players; all in a weekend","keys":[["lovable","loveable"],["status updates"],["few hours"],["live scoring"],["messages"],["weekend"]]},{"label":"She was so excited it got over a thousand views on the day of the event","keys":[["excited"],["thousand views"],["day of the event"]]}],"title":"Slide 12 · J APP VIEW"},{"section":1,"paragraphs":["Or take an executive I work with, Karen. She owns tech for a multi-billion-dollar company. Before we ever met, Karen spent millions out of her own P&L on a project with Salesforce to modernize and secure her data infrastructure. A year and a half later, it still didn't work.","Karen walked into our first meeting like someone on a losing streak, bracing for one more. She'd been buried under a run of projects that didn't land."],"id":12,"words":76,"beats":[{"label":"Karen owns tech for a multi-billion-dollar company","keys":[["karen"],["owns tech"],["multi-billion"],["company"]]},{"label":"She'd spent millions from her own P&L with Salesforce to modernize and secure her data infrastructure; a year and a half later it still didn't work","keys":[["millions"],["p&l"],["salesforce"],["modernize"],["secure"],["data infrastructure"],["year and a half"],["didn't work"]]},{"label":"Karen walked into our first meeting like someone on…","keys":[["karen"],["walked"],["first"]]}],"title":"Slide 13 · KAREN EXEC"},{"section":1,"paragraphs":["Together, using open source and AI, we built. Ninety days later she had the thing Salesforce couldn't deliver in eighteen months, and it cost her about 40% less.","For J and Karen - I didn’t perform a miracle. All I did was open the door for them."],"id":13,"words":47,"beats":[{"label":"Together, using open source and AI, we built. Ninety…","keys":[["together"],["using"],["open"]]},{"label":"For J and Karen - I didn’t perform a…","keys":[["karen"],["didnt"],["perform"]]}],"title":"Slide 14 · KAREN · 90 DAYS"},{"section":1,"paragraphs":["But even as I talk about the positives, we need to acknowledge that AI is not immune from the duality of technology. The disruption, the displacement, the fear.","It is not irrational for people to worry about their job.","It is not irrational for people to worry about their elderly parents falling victim to deepfake scams.","It is not irrational for people to worry about their children growing up in a less stable world disrupted more quickly than a UT freshman changes majors."],"id":14,"words":83,"beats":[{"label":"But even as I talk about the positives, we…","keys":[["even"],["talk"],["positives"]]},{"label":"It is not irrational for people to worry about…","keys":[["irrational"],["people"],["worry"]]}],"title":"Slide 15 · SAD MAN"},{"section":1,"paragraphs":["This is the Duality of AI.","AI can open doors, but just as easily, AI can close them.","AI can give voice to people who have been talked over—and it can make it easier to counterfeit someone’s voice and steal their identity.","AI can help a first-time builder create something valuable—and it can allow a small group of companies to control the tools on which every builder depends.","AI can give us time back which we can use for our families, our friends, or ourselves—and it can tempt us to automate away the relationships that make the time worth having.","Both sides are real. Neither is guaranteed."],"id":15,"words":107,"beats":[{"label":"AI can give voice to the talked-over, and make it easier to counterfeit a voice and steal an identity","keys":[["voice"],["talked over"],["counterfeit"],["steal"],["identity"]]},{"label":"AI can help a first-time builder create value, and let a small group of companies control the tools every builder depends on","keys":[["first-time builder"],["valuable"],["small group of companies"],["control the tools"],["depends"]]},{"label":"AI can give us time back for family and friends, and tempt us to automate away the relationships that make the time worth having","keys":[["time back"],["families"],["friends"],["automate away"],["relationships"],["worth having"]]},{"label":"Both sides are real; neither is guaranteed","keys":[["both sides"],["real"],["neither"],["guaranteed"]]},{"label":"This is the Duality of AI.","keys":[["duality"]]},{"label":"AI can open doors, but just as easily, AI…","keys":[["open"],["doors"],["easily"]]}],"title":"Slide 16 · TREE"},{"section":1,"paragraphs":["AI is not Field of Dreams. If we build it, the positive side will not magically come. As much as I love James Earl Jones and want this to be true.","No. The positive side of the duality has to be built on purpose. It requires people in positions of leadership—in technology, in business, in society—to become door openers.","So that’s what I am really here to talk about today.","Doors.","I want to talk about three places where the Duality of AI is present in all of our lives. Where we already have the choice to open or close doors for…","…For individuals and their jobs.","…For communities and their prosperity.","…For our own agency."],"id":16,"words":116,"beats":[{"label":"AI is not Field of Dreams: build it and the positive side won't magically come, much as I love James Earl Jones","keys":[["field of dreams"],["build it"],["magically"],["james earl jones"]]},{"label":"The positive side has to be built on purpose: leaders in technology, business, and society becoming door openers","keys":[["on purpose"],["leadership"],["technology"],["business"],["society"],["door openers"]]},{"label":"So that’s what I am really here to talk…","keys":[["thats"],["talk"],["today"]]},{"label":"Doors.","keys":[["doors"]]},{"label":"I want to talk about three places where the…","keys":[["want"],["talk"],["places"]]},{"label":"…For individuals and their jobs.","keys":[["individuals"],["their"],["jobs"]]},{"label":"…For communities and their prosperity.","keys":[["communities"],["their"],["prosperity"]]},{"label":"…For our own agency.","keys":[["agency"]]}],"title":"Slide 17 · BASEBALL DIAMOND"},{"section":1,"paragraphs":["I call these the Three Great Tensions of AI.","Tension 1: AI will create new jobs…and eliminate others without offering a path forward for individuals","Tension 2: AI will create shared prosperity…or extract it from communities","Tension 3: Ai will democratize control… or concentrate it in the hands of a few individuals and companies","Let me ask you: Who here wants to open doors for individuals, for their communities, and for society? [Raise hand — ask people to raise their hands if it isn’t obviously getting hands to raise]","Who here wants to close doors instead? [Lower hand]","Great. You’re in the right room.","But the “door closed” future doesn’t actually require any of us to hold ill will or purposefully close doors. It can emerge from thousands of smaller choices made in the name of speed, efficiency, convenience, growth. None of those things are bad. But they don’t have to lead to closed doors either.","That is the Duality of AI."],"id":17,"words":143,"beats":[{"label":"I call these the Three Great Tensions of AI.","keys":[["call"],["these"],["great"]]},{"label":"Tension 1: AI will create new jobs…and eliminate others…","keys":[["tension"],["create"],["jobs"]]},{"label":"Tension 2: AI will create shared prosperity…or extract it…","keys":[["tension"],["create"],["shared"]]},{"label":"Tension 3: Ai will democratize control… or concentrate it…","keys":[["tension"],["democratize"],["control"]]},{"label":"Let me ask you: Who here wants to open…","keys":[["wants"],["open"],["doors"]]},{"label":"Who here wants to close doors instead?","keys":[["wants"],["close"],["doors"]]},{"label":"Great. You’re in the right room.","keys":[["great"],["youre"],["right"]]},{"label":"But the “door closed” future doesn’t actually require any…","keys":[["door"],["closed"],["future"]]},{"label":"That is the Duality of AI.","keys":[["duality"]]}],"title":"Slide 18 · THREE TENSIONS"},{"section":1,"paragraphs":["But let me say it again, the technology doesn't pick. People do. We Do.","So let me walk you through this Duality in the form of the Three Great Tensions of AI as I see them, and let’s see how we can all be door openers."],"id":18,"words":46,"beats":[{"label":"But let me say it again, the technology doesn't…","keys":[["again"],["technology"],["doesnt"]]},{"label":"So let me walk you through this Duality in…","keys":[["walk"],["through"],["duality"]]}],"title":"Slide 19 · PEOPLE DO. WE DO."},{"section":2,"paragraphs":["Let me show you a quote I read recently that rings true to me:"],"id":19,"words":14,"beats":[{"label":"Let me show you a quote I read recently…","keys":[["show"],["quote"],["read"]]}],"title":"Slide 20 · FIRST TENSION DIVIDER"},{"section":2,"paragraphs":["[Read Quote] \"Today we stand on the threshold of a new industrial revolution, the revolution of automation. This is a revolution bright with the hope of a new prosperity for labor and a new abundance for America. But it is also a revolution which carries the dark menace of industrial dislocation, increasing unemployment, and deepening poverty.\"","Anyone know who that was? Any guesses?","That's John F. Kennedy. Read it again and try to tell me it wasn't written for this moment. What does that tell us? What does it tell us that a quote from the early 60s is equally applicable today? I suspect if we looked hard enough—or asked AI to look for us—we could find something similar from the 1890s or 1920s."],"id":20,"words":122,"beats":[{"label":"\"Threshold of a new industrial revolution, the revolution of automation; bright with the hope of new prosperity for labor and new abundance for America\"","keys":[["threshold"],["industrial revolution"],["automation"],["prosperity"],["labor"],["abundance"],["america"]]},{"label":"\"But also a revolution which carries the dark menace of industrial dislocation, increasing unemployment, and deepening poverty\"","keys":[["dark menace"],["dislocation"],["unemployment"],["poverty"]]},{"label":"Anyone know who that was? Any guesses? That's John F. Kennedy; try to tell me it wasn't written for this moment","keys":[["guesses"],["kennedy"],["written for this moment"]]},{"label":"What does it tell us that a quote from the early 60s applies today? Look hard enough, or ask AI, and you'd find one from the 1890s or 1920s","keys":[["early 60s"],["1890s"],["1920s"],["ask ai"]]}],"title":"Slide 21 · JFK QUOTE"},{"section":2,"paragraphs":["In prehistoric times, Thog probably lamented the downfall of his sledge business when Grog invented the wheel.","We invent new things. Those new things bring change. Change is disruptive. That disruption has positive effects and negative effects. This is the inherent tension in change."],"id":21,"words":44,"beats":[{"label":"We invent new things; they bring change; change is disruptive, with positive and negative effects; that's the inherent tension in change","keys":[["invent"],["change"],["disruptive"],["positive"],["negative"],["inherent tension"]]},{"label":"Prehistoric times: Thog lamented the downfall of his sledge business when Grog invented the wheel","keys":[["prehistoric"],["thog"],["sledge"],["grog"],["wheel"]]}],"title":"Slide 22 · THOG & GROG"},{"section":2,"paragraphs":["But humans don’t like change.","Macro, we are very adaptable as a species.","Micro, we individuals like our things the way we like them.","We may understand intellectually that change is inevitable. But when it happens to us—when it alters our routines, threatens something we worked hard to build, or removes a path we thought we could count on—it does not feel like progress.","It feels like loss.","And sometimes, this affects us in bigger ways, like our careers, paths we were counting on or built over years, decades, or even a whole lifetime.","That’s not just a loss of convenience or routine.","That’s a loss of identity.","We lose who we are."],"id":22,"words":113,"beats":[{"label":"Humans don't like change: macro, we're adaptable as a species; micro, we like our things the way we like them","keys":[["humans"],["macro"],["adaptable"],["species"],["micro"],["the way we like them"]]},{"label":"We may understand intellectually that change is inevitable. But…","keys":[["understand"],["intellectually"],["change"]]},{"label":"It feels like loss.","keys":[["feels"],["loss"]]},{"label":"And sometimes, this affects us in bigger ways, like…","keys":[["sometimes"],["affects"],["bigger"]]},{"label":"That’s not just a loss of convenience or routine.","keys":[["thats"],["loss"],["convenience"]]},{"label":"That’s a loss of identity.","keys":[["thats"],["loss"],["identity"]]},{"label":"We lose who we are.","keys":[["lose"]]}],"title":"Slide 23 · TECHNOLOGY DISRUPTION MONTAGE"},{"section":2,"paragraphs":["What do we do then?","And that is important, because it is tempting for those of us who are excited about AI to dismiss resistance as ignorance.","We tell people they need to understand the technology better.","We tell them disruption has happened before.","We tell them that, in the long run, innovation creates more prosperity.","And that’s true, but tell that to the person who lost their job.","As with every major technological disruption, AI will eliminate jobs.","But equally inevitable is the creation of new work.","Sometimes, the skills transfer.","If you can make a sledge, probably you can make a cart. Perhaps you can learn to make a wheel.","But sometimes, the skills do not transfer easily.","When a robot automates an assembly-line job, it is technically possible that the displaced worker will retrain in advanced robotics or software engineering.","But “technically possible” is doing a lot of work there."],"id":23,"words":153,"beats":[{"label":"That's true, but tell that to the person who lost their job","keys":[["tell that"],["lost their job"]]},{"label":"Sometimes the skills transfer: a sledge maker can make a cart, maybe learn to make a wheel; but sometimes they don't transfer easily","keys":[["skills transfer"],["sledge"],["cart"],["wheel"],["transfer easily"]]},{"label":"A robot automates an assembly-line job; it's \"technically possible\" the displaced worker retrains in robotics or software engineering","keys":[["robot"],["assembly-line"],["technically possible"],["retrain"],["robotics"],["software engineering"]]},{"label":"\"Technically possible\" is doing a lot of work there","keys":[["technically possible"],["lot of work"]]},{"label":"It's tempting for those excited about AI to dismiss resistance as ignorance: understand the tech better, disruption happened before, the long run creates prosperity","keys":[["tempting"],["dismiss"],["resistance"],["ignorance"],["understand the technology"],["happened before"],["long run"],["prosperity"]]},{"label":"As with every major technological disruption, AI will eliminate…","keys":[["major"],["technological"],["disruption"]]},{"label":"But equally inevitable is the creation of new work.","keys":[["equally"],["inevitable"],["creation"]]}],"title":"Slide 24 · HELP"},{"section":2,"paragraphs":["The evidence from previous waves of automation does not give us great confidence that everyone who loses a job will simply move into one of the new jobs being created. In 1950, almost 1.5 million people worked as telephone switchboard operators, either for the Bell system or in offices, hotels, and factories. By 1984 that number fell to 40,000. Today, it’s under 2,000.","These jobs disappeared even as new ones were created—first, people to design and build the automation systems, engineering jobs; then, people to maintain that automation, like linemen and other electrical and mechanical repair jobs; then, eventually, it’s computerized, which is a whole new category of jobs, and so on.","But those new jobs may require different skills. They may be located somewhere else. They may arrive years after the old job disappears. And they may go to entirely different people.","That is the part we risk losing when we talk only in aggregate."],"id":24,"words":156,"beats":[{"label":"Previous waves of automation don't give us confidence that everyone who loses a job moves into a new one","keys":[["previous waves"],["confidence"],["loses a job"],["new jobs"]]},{"label":"In 1950, almost 1.5 million telephone switchboard operators, for the Bell system or in offices, hotels, and factories","keys":[["1950"],["1.5 million","half million"],["telephone"],["switchboard"],["operators"],["bell"],["hotels"]]},{"label":"By 1984 that fell to 40,000; today it's under 2,000","keys":[["1984"],["40,000"],["today"],["2,000"]]},{"label":"New jobs came: first engineers to design and build the automation; then maintenance, linemen, electrical and mechanical repair; then it's computerized, a whole new category","keys":[["design and build"],["automation"],["engineering"],["maintain"],["linemen"],["electrical"],["mechanical"],["computerized"],["category"]]},{"label":"That's the part we lose when we talk only in aggregate","keys":[["lose"],["aggregate"]]},{"label":"These jobs disappeared even as new ones were created—first,…","keys":[["these"],["jobs"],["disappeared"]]},{"label":"But those new jobs may require different skills. They…","keys":[["those"],["jobs"],["require"]]},{"label":"That is the part we risk losing when we…","keys":[["part"],["risk"],["losing"]]}],"title":"Slide 25 · OPERATORS CHART"},{"section":2,"paragraphs":["We risk losing the part that makes us human."],"id":25,"words":9,"beats":[{"label":"We risk losing the part that makes us human.","keys":[["risk"],["losing"],["part"]]}],"title":"Slide 26 · RISK LOSING HUMAN"},{"section":3,"paragraphs":["The second great tension is about who benefits—and who pays. It is the tension between innovation and community—whether innovation adds to community or extracts from it.","AI has the potential to create extraordinary value. It can help businesses grow, enable entrepreneurs to compete, and accelerate research. It can also be used to improve public services and bring entirely new investment or products to places and communities that stand to benefit.","But economic growth does not automagically equate to community prosperity."],"id":26,"words":80,"beats":[{"label":"But economic growth does not automagically equate to community prosperity","keys":[["economic growth"],["automagically"],["community prosperity"]]},{"label":"The second great tension is about who benefits—and who…","keys":[["second"],["great"],["tension"]]},{"label":"AI has the potential to create extraordinary value. It…","keys":[["potential"],["create"],["extraordinary"]]}],"title":"Slide 27 · SECOND TENSION DIVIDER"},{"section":3,"paragraphs":["A company can become more innovative and productive while employing fewer people locally.","Small businesses can gain powerful new capabilities and simultaneously find themselves competing against companies with vastly greater access to data, talent, and computing power.","And the physical infrastructure that powers AI can bring many millions or even billions in new investment while consuming the land, electricity, water, and public capacity of the communities where it is built.","The innovation may be global. The benefits may flow to customers, investors, and businesses around the world.","But the burden is local.","It is the community that supplies the land, the power, the water, and the public infrastructure. And there is no guarantee that the value created will return to the people who live there."],"id":27,"words":125,"beats":[{"label":"A company can become more innovative and productive while…","keys":[["company"],["become"],["innovative"]]},{"label":"Small businesses can gain powerful new capabilities and simultaneously…","keys":[["small"],["businesses"],["gain"]]},{"label":"And the physical infrastructure that powers AI can bring…","keys":[["physical"],["infrastructure"],["powers"]]},{"label":"The innovation may be global. The benefits may flow…","keys":[["innovation"],["global"],["benefits"]]},{"label":"But the burden is local.","keys":[["burden"],["local"]]},{"label":"It is the community that supplies the land, the…","keys":[["community"],["supplies"],["land"]]}],"title":"Slide 28 · DIVIDED COMMUNITY"},{"section":3,"paragraphs":["For many people, a data center is the first part of the AI economy they can actually see. Data centers are the pinata in the room they can hit.","An AI model is abstract. The algorithm is invisible. But the building at the edge of town? That’s concrete.","A data center can expand the tax base, support construction, strengthen infrastructure, and connect a region to one of the most important technological transformations of our time.","It can also draw enormous amounts of electricity, occupy land, use water, create noise, and require significant public investment.","The answer is not to stop building."],"id":28,"words":101,"beats":[{"label":"A data center can expand the tax base, support construction, strengthen infrastructure, and connect a region to one of the most important transformations of our time","keys":[["tax base"],["construction"],["infrastructure"],["region"],["transformations"]]},{"label":"It can also draw enormous electricity, occupy land, use water, create noise, and require significant public investment","keys":[["electricity"],["occupy land"],["water"],["noise"],["public investment"]]},{"label":"For many people the data center is the first part of the AI economy they can actually see; the model is abstract, the algorithm invisible, the building at the edge of town is concrete","keys":[["data center"],["first part"],["ai economy"],["abstract"],["invisible"],["edge of town"],["concrete"]]},{"label":"Data centers are the pinata in the room people can hit","keys":[["pinata"],["hit"]]},{"label":"An AI model is abstract. The algorithm is invisible.…","keys":[["model"],["abstract"],["algorithm"]]},{"label":"The answer is not to stop building.","keys":[["answer"],["stop"],["building"]]}],"title":"Slide 29 · PINATA"},{"section":3,"paragraphs":["It is to build in a way that earns and sustains community support and trust. That means listening before the major decisions have already been made. It means being candid about costs as well as benefits. It means investing in the infrastructure a project requires rather than quietly shifting those burdens onto everyone else.","And it means asking what else we can build."],"id":29,"words":63,"beats":[{"label":"And it means asking what else we can build","keys":[["what else"],["build"]]},{"label":"It is to build in a way that earns…","keys":[["build"],["earns"],["sustains"]]}],"title":"Slide 30 · COMMUNITY"},{"section":3,"paragraphs":["Dr. Katie Schuman and I were doing our PhD research at the University of Tennessee at the same time. I left for Silicon Valley. Dr. Schuman stayed and became one of the leading neuromorphic-computing researchers in the world.","Neuromorphic computing uses chips designed more like a brain than a conventional processor. For our purposes today, the essential point is power: certain learning tasks can be performed using a fraction of the energy required by standard approaches."],"id":30,"words":76,"beats":[{"label":"Dr. Katie Schuman and I did our PhD research at UT at the same time; I left for Silicon Valley; she stayed and became a leading neuromorphic-computing researcher","keys":[["schuman","schumann","shuman"],["phd"],["silicon valley"],["stayed"],["neuromorphic","neuro morphic"],["researchers"]]},{"label":"Neuromorphic chips are designed more like a brain than a conventional processor","keys":[["chips"],["brain"],["conventional processor"]]},{"label":"The essential point is power: certain learning tasks use a fraction of the energy of standard approaches","keys":[["power"],["learning tasks"],["fraction"],["energy"],["standard approaches"]]}],"title":"Slide 31 · SCHUMAN & PARKER"},{"section":3,"paragraphs":["I toured Dr. Schuman’s lab. Her summer research students demonstrated chips learning the classic pole-balancing problem. Using less than 10% of the energy required using today’s GPUs. I watched a different computing future take shape on a sliver of the power—right here in Tennessee.","Then they handed me a tray of the early chips.","And I dropped them.","My stomach fell through the floor. I thought I had just dropped millions of dollars of research.","The students looked at me and said, “Oh, don’t worry. Those are from years ago. We’re already generations past those. We wouldn’t hand you one of the new ones.”","Which made me feel better and worse at exactly the same time.","But those chips represented something important."],"id":31,"words":122,"beats":[{"label":"In her lab, summer students showed chips learning pole-balancing using under 10% of the energy of today's GPUs; a different computing future on a sliver of the power, right here in Tennessee","keys":[["lab"],["summer"],["students"],["pole-balancing"],["10 percent"],["gpus","gpu"],["sliver"],["tennessee"]]},{"label":"Then they handed me a tray of the early chips, and I dropped them","keys":[["tray"],["early chips"],["dropped"]]},{"label":"My stomach fell through the floor; I thought I'd dropped millions of dollars of research","keys":[["stomach"],["floor"],["millions of dollars"],["research"]]},{"label":"The students: \"Don't worry, those are from years ago, we're generations past those, we wouldn't hand you one of the new ones\"","keys":[["don't worry"],["years ago"],["generations"],["new ones"]]},{"label":"Better and worse at exactly the same time; but those chips represented something important","keys":[["better"],["worse"],["same time"],["represented"],["important"]]}],"title":"Slide 32 · CHIPS"},{"section":3,"paragraphs":["We sometimes talk about the demands created by AI as if they are simply the unavoidable price of progress.","They are not.","They are shaped by decisions: what we fund, what we build, which technical approaches we pursue, and whose needs we consider along the way.","We can invest in more efficient architectures. We can support local research. We can build smaller and more specialized models. We can prepare local workers and businesses to participate. We can ensure that new infrastructure strengthens the systems communities will continue relying on long after construction is complete.","The leadership responsibility inside this tension is not to choose between innovation and community.","It is to connect them.","A community can gain investment and still feel strained by it. That is the tension. And we need to be honest about it.","Will AI help more communities build durable prosperity? Or will its greatest benefits pass through them—or pass them by?","Those questions are not anti-business or anti-technology. They are human business questions.","That is what we miss when we measure the opportunity of innovation and not the cost of what stays behind."],"id":32,"words":187,"beats":[{"label":"We talk about the demands of AI as the unavoidable price of progress; they are not","keys":[["demands"],["unavoidable"],["price of progress"],["they are not"]]},{"label":"They are shaped by decisions: what we fund, what we build, which technical approaches we pursue, whose needs we consider","keys":[["shaped by decisions"],["fund"],["build"],["technical approaches"],["whose needs"]]},{"label":"Invest in efficient architectures, support local research, build smaller specialized models, prepare local workers and businesses to participate, ensure infrastructure strengthens the systems communities rely on after construction","keys":[["efficient architectures"],["local research"],["smaller"],["specialized models"],["local workers"],["participate"],["strengthens"],["construction"]]},{"label":"The leadership responsibility isn't to choose between innovation and community; it is to connect them","keys":[["leadership responsibility"],["innovation"],["community"],["connect them"]]},{"label":"A community can gain investment and still feel strained…","keys":[["community"],["gain"],["investment"]]},{"label":"Will AI help more communities build durable prosperity? Or…","keys":[["help"],["communities"],["build"]]},{"label":"Those questions are not anti-business or anti-technology. They are…","keys":[["those"],["questions"],["anti"]]},{"label":"That is what we miss when we measure the…","keys":[["miss"],["measure"],["opportunity"]]}],"title":"Slide 33 · DECISIONS"},{"section":3,"paragraphs":["We risk hollowing out the communities we are supposed to be building up."],"id":33,"words":13,"beats":[{"label":"We risk hollowing out the communities we are supposed…","keys":[["risk"],["hollowing"],["communities"]]}],"title":"Slide 34 · WE RISK · HOLLOWING"},{"section":4,"paragraphs":["And that brings us to the third great tension: control.","Who gets to build with AI? Who gets to inspect it, question it, adapt it, and decide how it is used? And who retains agency over the parts of their lives that AI increasingly touches?","This tension can be narrow."],"id":34,"words":50,"beats":[{"label":"The third great tension: control","keys":[["third great tension"],["control"]]},{"label":"Who gets to build with AI, inspect it, question it, adapt it, decide how it's used, and who retains agency over their lives?","keys":[["build"],["inspect"],["question"],["adapt"],["agency"]]},{"label":"This tension can be narrow.","keys":[["tension"],["narrow"]]}],"title":"Slide 35 · THIRD TENSION DIVIDER"},{"section":4,"paragraphs":["[ZUCK QUOTE IN BACKGROUND ON SLIDE; DO NOT READ ALOUD: “You’re going to get a handful of companies that run these closed models that are going to be in control of the APIs and therefore able to tell you what you can build.”]","Will AI democratize software development, allowing far more people to build tools and solve problems more easily and more effectively than before?","Or will the essential technology be controlled by a handful of companies, with everyone else renting access on terms they did not set, having to forfeit their data, their privacy, their deeply personal thoughts?","But the tension can also be much wider."],"id":35,"words":64,"beats":[{"label":"Or a handful of companies controlling it, everyone else renting access on terms they didn't set, forfeiting their data, privacy, and personal thoughts?","keys":[["handful of companies"],["renting access"],["terms"],["forfeit"],["privacy"],["personal thoughts"]]},{"label":"The narrow version: will AI democratize software development so far more people can build tools and solve problems?","keys":[["democratize"],["software development"],["more people"],["solve problems"]]},{"label":"But the tension can also be much wider.","keys":[["tension"],["much"],["wider"]]}],"title":"Slide 36 · ZUCK QUOTE"},{"section":4,"paragraphs":["[ALTMAN QUOTE IN BACKGROUND ON SLIDE; DO NOT READ ALOUD: “We see a future where intelligence is a utility, like electricity or water, and people buy it from us on a meter.\"]","Will AI give individuals more control over their time, knowledge, work, and choices? In short, will AI give people more control over their own lives?","Or will it give institutions more power to monitor people, predict them, influence them, and make decisions about them?","Believe me, I’m not an alarmist, but these kinds of quote by those responsible for building the AI tools that will power our future should give most sane people pause.","Is this future opening doors or closing them?","Here’s the part where I get to talk about what really gets me excited: Open Source."],"id":36,"words":98,"beats":[{"label":"Or give institutions more power to monitor people, predict them, influence them, and make decisions about them?","keys":[["institutions"],["monitor"],["predict"],["influence"],["decisions"]]},{"label":"The part where I get to talk about what really excites me: open source","keys":[["excited"],["open source"]]},{"label":"The wider version: will AI give individuals more control over their time, knowledge, work, choices, their own lives?","keys":[["individuals"],["control"],["time"],["knowledge"],["choices"],["own lives"]]},{"label":"Believe me, I’m not an alarmist, but these kinds…","keys":[["believe"],["alarmist"],["these"]]},{"label":"Is this future opening doors or closing them?","keys":[["future"],["opening"],["doors"]]}],"title":"Slide 37 · ALTMAN QUOTE"},{"section":4,"paragraphs":["The architecture of a technology helps determine the distribution of power around it. I have spent a significant part of my career in open source technology.","Open source does not mean that everything must be free, nor does it mean unsafe and insecure and that everyone has access to your technology or data.","Open source is about transparency and collaboration. It’s about security and innovation in a sort of “strength in numbers” sort of way. Because more people with different backgrounds and different needs are all relying on and improving on the same underlying code, and because everyone has a shared commitment to transparency and collaboration, everyone can benefit.","It’s a positive sum game.","On the flip side, closed is not a synonym for “bad.”","Closed systems can offer real benefits: integration, consistency, technical support, simplicity, and clearer lines of accountability.","Anyone who is an Apple user knows what I’m talking about. Apple controls the entire experience, and much of the time, that is precisely why the experience works so well. It’s a beautiful walled garden on the inside. If you’re into that sorta thing.","The risk calculus changes, however, when the closed system is not simply operating our phone or laptop, but determining things like what information reaches us, what choices are place before us, and what decisions are made for us.","Closed systems become problematic when they control too much for too many. Google often got in trouble in the EU for what was effectively a monopoly on the distribution of (and therefore access to) information.","AI is that, but on steroids."],"id":37,"words":264,"beats":[{"label":"The architecture of a technology helps determine the distribution of power around it; a big part of my career has been open source","keys":[["architecture"],["distribution of power"],["career"],["open source"]]},{"label":"On the flip side, closed is not a synonym for bad","keys":[["flip side"],["closed"],["synonym"],["bad"]]},{"label":"Closed systems offer integration, consistency, technical support, simplicity, clearer lines of accountability","keys":[["integration"],["consistency"],["technical support"],["simplicity"],["accountability"]]},{"label":"Apple users know: Apple controls the entire experience, and that's often precisely why it works so well; a beautiful walled garden, if you're into that sorta thing","keys":[["apple"],["entire experience"],["works so well"],["walled garden"],["sorta thing"]]},{"label":"Google got in trouble in the EU for what was effectively a monopoly on the distribution of information; this is that, on steroids","keys":[["eu"],["monopoly"],["distribution"],["steroids"]]},{"label":"Open source does not mean that everything must be…","keys":[["open"],["source"],["does"]]},{"label":"Open source is about transparency and collaboration. It’s about…","keys":[["open"],["source"],["transparency"]]},{"label":"It’s a positive sum game.","keys":[["positive"],["game"]]},{"label":"The risk calculus changes, however, when the closed system…","keys":[["risk"],["calculus"],["changes"]]},{"label":"Closed systems become problematic when they control too much…","keys":[["closed"],["systems"],["become"]]},{"label":"AI is that, but on steroids.","keys":[["steroids"]]}],"title":"Slide 38 · ARCHITECTURE"},{"section":4,"paragraphs":["We ask AI in chat what is true.","We ask AI what matters.","We ask it to summarize arguments, evaluate choices, recommend actions, organize our work, draft our words.","And increasingly, we ask AI to act on our behalf.","That can be extraordinarily empowering. Remember J’s charity golf app she built on Loveable?","Used well, AI can increase our capacity to think and act to reach beyond the limitations of our learned skills and unlock the potential of our imagination and creativity.","But the same technology can also weaken the very capabilities it appears to expand.","If we routinely ask AI what to think before we have tried to think, we risk outsourcing more than a task. We risk outsourcing the struggle through which judgment develops."],"id":38,"words":126,"beats":[{"label":"And increasingly we ask AI to act on our behalf","keys":[["act on our behalf"]]},{"label":"That can be extraordinarily empowering; remember J's charity golf app built on Loveable?","keys":[["empowering"],["charity golf","jay"],["loveable","lovable"]]},{"label":"But the same technology can weaken the very capabilities it appears to expand","keys":[["weaken"],["capabilities"],["expand"]]},{"label":"If we ask AI what to think before we've tried to think, we outsource more than a task: the struggle through which judgment develops","keys":[["what to think"],["outsourcing"],["struggle"],["judgment"]]},{"label":"We ask AI what is true and what matters; to summarize, evaluate, recommend, organize, draft; how much of this keynote did I write versus OpenAI's data centers?","keys":[["what is true"],["matters"],["summarize"],["evaluate"],["recommend"],["draft"]]},{"label":"Used well, AI can increase our capacity to think…","keys":[["used"],["well"],["increase"]]}],"title":"Slide 39 · WE ASK AI"},{"section":4,"paragraphs":["I’m talking about analytical cognition, about critical thinking.","Analytical cognition is not simply the production of an answer.","It is the process of examining evidence, tolerating uncertainty, recognizing assumptions, acknowledging our own bias, reconciling the evidence with what we know or thought we knew and sometimes even changing our minds.","AI is a tool that can enhance that process.","Or it can short-circuit the process if we just take the answer as gospel without putting in the critical thinking.","Don’t get me wrong. It’s convenient. So is Google. When’s the last time anyone went to a library or got into an argument at a bar with a friend over who had more passing Touchdowns, Manning or Brady?"],"id":39,"words":117,"beats":[{"label":"I’m talking about analytical cognition, about critical thinking.","keys":[["talking"],["analytical"],["cognition"]]},{"label":"Analytical cognition is not simply the production of an…","keys":[["analytical"],["cognition"],["simply"]]},{"label":"It is the process of examining evidence, tolerating uncertainty,…","keys":[["process"],["examining"],["evidence"]]},{"label":"AI is a tool that can enhance that process.","keys":[["tool"],["enhance"],["process"]]},{"label":"Or it can short-circuit the process if we just…","keys":[["short"],["circuit"],["process"]]},{"label":"Don’t get me wrong. It’s convenient. So is Google.…","keys":[["dont"],["wrong"],["convenient"]]}],"title":"Slide 40 · BRAIN"},{"section":4,"paragraphs":["But the convenience of AI can conceal a transfer of control. That’s the risk.","If a system chooses which sources to summarize, which arguments to emphasize, and which options to present, then it is influencing how we understand and act in the world.","That does not mean we should reject AI assistance, much less AI in general. It means we need to understand this tension clearly.","Are we asking AI to help us reason or asking it to reason for us?","Are we using it to expand our choices or allowing it to narrow them without our awareness?","Are we gaining greater control over our lives or becoming more dependent on systems we cannot inspect, challenge, or leave?","Open source is one response to that tension. It is not the only response, but it is oneI happen to love and one we touch every day. Because open source and openness in general is not just about access to code or innovation or collaboration. It is about control and freedom of choice. It is about whether we or anyone else outside the center retains the power to understand the system, to question its choices, to build upon it and if we so choose, it’s about the power to create an alternative.","Closed systems can also serve us well. But when a handful of companies control the systems through which we increasingly learn, decide, create, and act, something more fundamental is at stake.","That is what we miss when we measure everything AI can do for us without quantifying how much control we surrender in return."],"id":40,"words":264,"beats":[{"label":"But the convenience of AI can conceal a transfer…","keys":[["convenience"],["conceal"],["transfer"]]},{"label":"If a system chooses which sources to summarize, which…","keys":[["system"],["chooses"],["sources"]]},{"label":"That does not mean we should reject AI assistance,…","keys":[["does"],["mean"],["should"]]},{"label":"Are we asking AI to help us reason or…","keys":[["asking"],["help"],["reason"]]},{"label":"Are we using it to expand our choices or…","keys":[["using"],["expand"],["choices"]]},{"label":"Are we gaining greater control over our lives or…","keys":[["gaining"],["greater"],["control"]]},{"label":"Open source is one response to that tension. It…","keys":[["open"],["source"],["response"]]},{"label":"Closed systems can also serve us well. But when…","keys":[["closed"],["systems"],["serve"]]},{"label":"That is what we miss when we measure everything…","keys":[["miss"],["measure"],["everything"]]}],"title":"Slide 41 · TRANSFER OF CONTROL"},{"section":4,"paragraphs":["We risk surrendering our agency to systems we cannot question, change, or leave."],"id":41,"words":13,"beats":[{"label":"We risk surrendering our agency to systems we cannot…","keys":[["risk"],["surrendering"],["agency"]]}],"title":"Slide 42 · WE RISK · AGENCY"},{"section":5,"paragraphs":["Now, you all are leaders. In your community, at your company, in your industry. And like it or not, the hand we have been dealt is a life during a period of great change.","Change is hard. Successfully navigating that change requires good leadership.","Good leadership requires clarity—of strategy and of execution.","For my money, there is no better company at executing software strategy than Amazon. Amazon has sixteen leadership principles. You don’t need sixteen. You just need to know the underlying habit beneath all of them."],"id":42,"words":87,"beats":[{"label":"Now, you all are leaders. In your community, at…","keys":[["leaders"],["community"],["company"]]},{"label":"Change is hard. Successfully navigating that change requires good…","keys":[["change"],["hard"],["successfully"]]},{"label":"Good leadership requires clarity—of strategy and of execution.","keys":[["good"],["leadership"],["requires"]]},{"label":"For my money, there is no better company at…","keys":[["money"],["better"],["company"]]}],"title":"Slide 43 · STRATEGY & EXECUTION"},{"section":5,"paragraphs":["Writing is thinking.","Good strategic thinking starts at the end. What is the outcome we are trying to achieve?","At Amazon, we took that to the extreme. We called it Working Backwards. Before we built a product, we wrote the press release for the finished thing. Then we wrote our way back from that announcement to the very first requirements. The whole plan existed on paper before anything existed in code.","But here is the real trick. It was never about the documents themselves. It was about shared clarity. Finance, engineering, marketing, legal, operations, every function with its own needs and skills, all worked from the same small set of core pages.","One set of pages.","Many readers.","Everyone thinking together, everyone clear on what we were trying to accomplish."],"id":43,"words":130,"beats":[{"label":"Good strategic thinking starts at the end: what outcome are we trying to achieve?","keys":[["strategic thinking"],["starts at the end"],["outcome"],["achieve"]]},{"label":"At Amazon we took that to the extreme and called it Working Backwards","keys":[["extreme"],["working backwards"]]},{"label":"We wrote the press release for the finished thing first, then wrote back to the first requirements; the plan existed on paper before anything existed in code","keys":[["press release"],["finished thing"],["requirements"],["on paper"],["in code"]]},{"label":"One set of pages, many readers, everyone thinking together and clear on what we were trying to accomplish","keys":[["one set of pages"],["many readers"],["thinking together"],["accomplish"]]},{"label":"Writing is thinking.","keys":[["writing"],["thinking"]]},{"label":"But here is the real trick. It was never…","keys":[["real"],["trick"],["never"]]}],"title":"Slide 44 · WRITING IS THINKING"},{"section":5,"paragraphs":["Much like a football play. You may not be Peyton Manning. Maybe you’re Marvin Harrison. But you know not only where you are supposed to be, but you know where your other receivers are, where the blockers are, so if the ball comes to you, you know what to do after you catch it.","Same at Amazon. When it came time to execute, the strategy was clear to everyone, and we were all on the same literal page."],"id":44,"words":78,"beats":[{"label":"Much like a football play. You may not be…","keys":[["much"],["football"],["play"]]},{"label":"Same at Amazon. When it came time to execute,…","keys":[["same"],["amazon"],["came"]]}],"title":"Slide 45 · FOOTBALL PLAY"},{"section":5,"paragraphs":["Back to the present. Here we are. In the world of AI, at risk of AI happening TO, at risk of the technology choosing instead of the people.","It is incumbent on us, the leaders in this room and other leaders in similar rooms around the US and the world, to exercise our agency and decide that it is not the technology that chooses, it is the people.","To get there, though, we need a strategy.","And that means we need to take a page from the Amazon playbook and get to a shared clarity.","But how do we do that? We lack clarity not because we haven’t done this before but because everything is new. It’s moving so fast. We can’t keep up.","Some of the most fundamental questions remain unanswered—what is AI going to do to us, to our company, to our society? What even is AI?","Well, I want to help you with that by offering a simple thought that will demystify this and bring some clarity:"],"id":45,"words":170,"beats":[{"label":"Back to the present. Here we are. In the…","keys":[["back"],["present"],["world"]]},{"label":"It is incumbent on us, the leaders in this…","keys":[["incumbent"],["leaders"],["room"]]},{"label":"To get there, though, we need a strategy.","keys":[["though"],["need"],["strategy"]]},{"label":"And that means we need to take a page…","keys":[["means"],["need"],["take"]]},{"label":"But how do we do that? We lack clarity…","keys":[["lack"],["clarity"],["because"]]},{"label":"Some of the most fundamental questions remain unanswered—what is…","keys":[["fundamental"],["questions"],["remain"]]},{"label":"Well, I want to help you with that by…","keys":[["well"],["want"],["help"]]}],"title":"Slide 46 · CLARITY"},{"section":5,"paragraphs":["AI agents are just files.","AI agents are just files.","Strip away the hype, and it’s just a set of instructions, some context, and the output you want back.","When you realize that, the Amazon playbook still works. Start at the end, write your way to a shared clarity of thought, and then execute. Yes, there is a major new variable to consider with the potential for great good and great bad. But it’s not magic.","If you take the time to write your strategy and think it through, you already have the inputs you need to take advantage of AI to the fullest. The thinking is the work. The agents just read.","Every leader in this room is deciding how their organization is going to navigate this moment, how to get more of the positive and less of the negative from the Duality of AI."],"id":46,"words":146,"beats":[{"label":"Write your strategy and think it through and you already have the inputs to use AI to the fullest; the thinking is the work, the agents just read","keys":[["inputs"],["fullest"],["thinking is the work"],["agents just read"]]},{"label":"AI agents are just files.","keys":[["agents"],["files"]]},{"label":"Strip away the hype, and it’s just a set…","keys":[["strip"],["away"],["hype"]]},{"label":"When you realize that, the Amazon playbook still works.…","keys":[["realize"],["amazon"],["playbook"]]},{"label":"Every leader in this room is deciding how their…","keys":[["leader"],["room"],["deciding"]]}],"title":"Slide 47 · AI AGENTS ARE JUST FILES"},{"section":5,"paragraphs":["[Tension 1: AI will eliminate jobs and create new ones / Tension 2: AI will create shared prosperity or extract it / Tension 3: Ai will democratize control or concentrate it]","As you are thinking, and writing to think, I want you to have those 3 tensions in your mind.","The leaders in this room cannot make every consequence of AI positive. We cannot promise that no job will disappear, no community will face new costs, and no powerful institution will use AI in ways we wish it would not.","We cannot resolve all of these tensions.","But we can influence how the change is experienced.","We can help people move from one opportunity to the next. We can make the benefits more accessible. We can give more people a voice in the decisions that will shape their lives."],"id":47,"words":108,"beats":[{"label":"Leaders can't make every consequence positive; we can't promise no job disappears, no community faces new costs, no powerful institution misuses AI","keys":[["every consequence"],["promise"],["disappear"],["new costs"],["powerful institution"]]},{"label":"But we can influence how the change is experienced","keys":[["influence"],["experienced"]]},{"label":"As you are thinking, and writing to think, I…","keys":[["thinking"],["writing"],["think"]]},{"label":"We cannot resolve all of these tensions.","keys":[["cannot"],["resolve"],["these"]]},{"label":"We can help people move from one opportunity to…","keys":[["help"],["people"],["move"]]}],"title":"Slide 48 · THREE TENSIONS AGAIN"},{"section":5,"paragraphs":["[RESOLUTION 1]","Some jobs will disappear. Some career paths will narrow. Some hard-earned skills will become less valuable. At the same time that AI is closing off some forms of work, it is dramatically lowering the threshold for creating others.","That is the leadership responsibility inside this tension."],"id":48,"words":46,"beats":[{"label":"Some jobs will disappear. Some career paths will narrow.…","keys":[["jobs"],["disappear"],["career"]]},{"label":"That is the leadership responsibility inside this tension.","keys":[["leadership"],["responsibility"],["inside"]]}],"title":"Slide 49 · TREE · RESOLUTION 1"},{"section":5,"paragraphs":["Who in your organization could do more meaningful work if someone made these new capabilities accessible to them? Who has insight but not the title? Who understands the problem but lacks the technical vocabulary? Who has never been invited to see themselves as a builder?","So here is the first question I want you to carry out of this room."],"id":49,"words":60,"beats":[{"label":"Who in your organization could do more meaningful work…","keys":[["organization"],["could"],["meaningful"]]},{"label":"So here is the first question I want you…","keys":[["first"],["question"],["want"]]}],"title":"Slide 50 · WHO IN YOUR ORG"},{"section":5,"paragraphs":["Who gets the tools, and who gets a path when their old one closes?"],"id":50,"words":14,"beats":[{"label":"Who gets the tools, and who gets a path…","keys":[["gets"],["tools"],["path"]]}],"title":"Slide 51 · DOOR #1"},{"section":5,"paragraphs":["[RESOLUTION 2]","AI investment can create enormous value. But the place where that value is created is not always the place where it stays.","That is the leadership responsibility inside this tension.","When you invest in a community, what capacity will remain after the announcement, the construction, or the initial wave of spending? Will local businesses be stronger? Will workers gain lasting skills? Will public infrastructure improve?","The goal is not simply to locate innovation in a community. It is to leave that community more capable than you found it.","That is not charity. It is stewardship. It is good business. It is creating durable economic growth and durable communities.","So here is the second question I want you to carry out of this room."],"id":51,"words":123,"beats":[{"label":"AI investment can create enormous value. But the place…","keys":[["investment"],["create"],["enormous"]]},{"label":"That is the leadership responsibility inside this tension.","keys":[["leadership"],["responsibility"],["inside"]]},{"label":"When you invest in a community, what capacity will…","keys":[["invest"],["community"],["capacity"]]},{"label":"The goal is not simply to locate innovation in…","keys":[["goal"],["simply"],["locate"]]},{"label":"That is not charity. It is stewardship. It is…","keys":[["charity"],["stewardship"],["good"]]},{"label":"So here is the second question I want you…","keys":[["second"],["question"],["want"]]}],"title":"Slide 52 · HOUSES · RESOLUTION 2"},{"section":5,"paragraphs":["Who benefits, and who pays?"],"id":52,"words":5,"beats":[{"label":"Who benefits, and who pays?","keys":[["benefits"],["pays"]]}],"title":"Slide 53 · DOOR #2"},{"section":5,"paragraphs":["[RESOLUTION 3]","AI systems will increasingly help us understand information, make decisions, and act. It is a really powerful tool. Some of the systems that enable this will be open. Some will be closed. But in either case, the people who depend on them must retain meaningful agency.","That is the leadership responsibility inside this tension.","When you adopt an AI system, can your employees understand and question it? Can your customers control their data? Can your organization change providers if the technology, the terms, or the leadership changes? Are you using AI to strengthen people’s judgement or simply reducing the number of judgements they are allowed to make?","Openness does not mean open source. It means preserving the ability to understand, challenge, choose, and build something different. It means preserving agency, control.","So here is the third question I want you to carry out of this room:"],"id":53,"words":146,"beats":[{"label":"AI systems will increasingly help us understand information, make…","keys":[["systems"],["increasingly"],["help"]]},{"label":"That is the leadership responsibility inside this tension.","keys":[["leadership"],["responsibility"],["inside"]]},{"label":"When you adopt an AI system, can your employees…","keys":[["adopt"],["system"],["employees"]]},{"label":"Openness does not mean open source. It means preserving…","keys":[["openness"],["does"],["mean"]]},{"label":"So here is the third question I want you…","keys":[["third"],["question"],["want"]]}],"title":"Slide 54 · SCALE · RESOLUTION 3"},{"section":5,"paragraphs":["Who can understand and question this, and who can leave?"],"id":54,"words":10,"beats":[{"label":"Who can understand and question this, and who can…","keys":[["understand"],["question"],["leave"]]}],"title":"Slide 55 · DOOR #3"},{"section":5,"paragraphs":["Now, as you go forth and talk about AI with colleagues, gain knowledge, and write those documents I want you remember and ask yourselves those three questions.","And I want you to run that review on every single one of your AI decisions.","Call it the Open Door Test."],"id":55,"words":49,"beats":[{"label":"Call it the Open Door Test","keys":[["open door test"]]},{"label":"Now, as you go forth and talk about AI…","keys":[["forth"],["talk"],["colleagues"]]},{"label":"And I want you to run that review on…","keys":[["want"],["review"],["single"]]}],"title":"Slide 56 · TREE · OPEN DOOR TEST"},{"section":5,"paragraphs":["Before your next AI decision, whether it is a vendor contract, a reorg, or the first Amazon Style Working Backwards document you write on Monday morning, ask yourself: does this open a door for people, or does it just happen to them?","And then apply those 3 simple checks from our 3 tensions as part of the Open Door Test:","1. Opportunity. Who gets the tools and a new path, and whose paths close?","2. Prosperity. Who benefits, and who pays?","3. Control. Who can understand and question this, and who is forced out?","If you can answer all three, you are opening doors. If you cannot answer one of them, you have found the door that is quietly closing on someone."],"id":56,"words":119,"beats":[{"label":"Opportunity: who gets the tools and a new path, and whose paths close?","keys":[["opportunity"],["tools"],["new path"],["whose paths close"]]},{"label":"Prosperity: who benefits, and who pays?","keys":[["prosperity"],["who benefits"],["who pays"]]},{"label":"Control: who can understand and question this, and who is forced out?","keys":[["control"],["understand and question"],["forced out"]]},{"label":"Answer all three and you are opening doors; miss one and you have found the door quietly closing on someone","keys":[["all three"],["opening doors"],["cannot answer"],["quietly closing"]]},{"label":"Before your next AI decision, whether it is a…","keys":[["before"],["next"],["decision"]]},{"label":"And then apply those 3 simple checks from our…","keys":[["apply"],["those"],["simple"]]}],"title":"Slide 57 · DOOR OPEN TEST"},{"section":6,"paragraphs":["So let me tell you what is really lighting me up. Because it isn’t the chips. I’d still drop those anyway. It isn’t the layoff numbers, or the record number of new businesses opening, or the potential jobs waiting to be created. It isn’t even the inventions and new possibilities AI will unlock.","No.","I do what I do for that kid who sees an open door—a door I helped open—and walks through. That kid who hugs me, lifts me off the ground, and tells me she found a new way to see the world. That kid who discovers an entire set of possibilities on the other side of a door she did not realize existed before.","Because for her, it didn’t.","Until it did.","And all she needed was for someone to open the door and show her where it was.","That’s it. That’s the whole thing. I do what I do for the Micahs of the world. I would go so far as to say I exist to light somebody else’s fire—and to help keep it burning.","That is my philosophical North Star. It is what gives me energy. It is what gives me purpose. And every one of the dualities we just walked through comes back to that same purpose.","These dualities are different in scale—individuals, communities, society--but each presents us with the same choice:","Will AI happen TO people, Or will we help people have agency in what happens next?","The headlines want you to be afraid.","And that fear is not unfounded.","Change is hard.","Fast change is unsettling.","Fast change that affects individuals, communities, and society simultaneously, a mile wide and a mile deep, that is in a word, terrifying.","But fear has a way of narrowing our field of vision. It makes us look for safety in certainty. It pushes us to pick a side:","* acceleration or obstruction,","* optimism or pessimism,","* opportunity or danger.","The Duality of AI demands something harder from us.","It asks us to see both sides at once. To acknowledge the danger without surrendering the possibility. To pursue the possibility without pretending the danger is not real.","We do not have to choose between a future in which AI succeeds and one in which people do. It does not have to be zero-sum. But the better future does not happen automatically. It will take the people in this room—the leaders of businesses, institutions, and communities—to make it happen.","So that is my challenge to you."],"id":57,"words":416,"beats":[{"label":"What is really lighting me up isn't the chips (I'd still drop those), the layoff numbers, the record new businesses, the jobs to be created, or the inventions AI will unlock","keys":[["lighting me up"],["chips"],["drop"],["layoff"],["new businesses"],["jobs"],["inventions"],["unlock"]]},{"label":"No. I do what I do for that kid who sees an open door, a door I helped open, and walks through","keys":[["kid"],["open door"],["helped open"],["walks through"]]},{"label":"The kid who hugs me, lifts me off the ground, and tells me she found a new way to see the world; who discovers possibil
