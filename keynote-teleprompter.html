  function coverage(si, start, end) {
    var sec = DATA.sections[si], span = sec.last - sec.first;
    var lo = Math.max(start, sec.first), hi = Math.min(end, sec.last);
    return span ? Math.max(0, hi - lo) / span : 0;
  }
  // Record a run against the Part it started in. Returns the run and that Part's history (oldest first, this run last).
  function recordRun(start, end, seconds, spokenWords, score) {
    var si = sectionOf(start);
    var run = { at: new Date().toISOString(), s: Math.round(seconds), words: spokenWords, cov: Math.round(100 * coverage(si, start, end)), score: score, saved: seconds >= MIN_SAVE };
    var runs = loadRuns(); var list = runs[si] || (runs[si] = []);
    var prev = list.slice();
    if (run.saved) { list.push(run); saveRuns(runs); }
    return { si: si, run: run, prev: prev };
  }
  function renderTiming(info) {
    var sec = DATA.sections[info.si], run = info.run, prev = info.prev;
    var target = sec.words / 150 * 60; // a comfortable keynote pace
    var html = '<div class="clock' + (run.saved ? '' : ' short') + '">' + mmss(run.s) + '</div><div>';
    html += '<div class="t">' + esc(sec.short) + (run.cov < 85 ? ' · ' + run.cov + '% of the part' : '') + '</div><div class="s">';
    if (!run.saved) html += 'Under ' + MIN_SAVE + ' seconds, so this run was not saved to your times. ';
    else if (!prev.length) html += 'First saved run for this part. ';
    else {
      var last = prev[prev.length - 1], best = Math.min.apply(null, prev.map(function (r) { return r.s; }));
      var avg = prev.reduce(function (a, r) { return a + r.s; }, 0) / prev.length;
      var d = run.s - last.s;
      html += '<span class="' + (d <= 0 ? 'up' : 'down') + '">' + signed(d) + '</span> vs your last run (' + mmss(last.s) + '). ';
      html += 'Best before this: <b>' + mmss(best) + '</b>. Average of ' + prev.length + ': <b>' + mmss(avg) + '</b>. ';
      if (run.s < best) html += 'New best. ';
    }
    html += 'At 150 words a minute this part reads in about <b>' + mmss(target) + '</b>.</div>';
    var all = prev.concat(run.saved ? [run] : []);
    if (all.length > 1) {
      var bestAll = Math.min.apply(null, all.map(function (r) { return r.s; }));
      html += '<div class="hist">' + all.slice(-8).map(function (r, i, arr) {
        var cls = (i === arr.length - 1 && run.saved) ? 'now' : (r.s === bestAll ? 'best' : '');
        return '<span class="' + cls + '">' + mmss(r.s) + '</span>';
      }).join('') + '</div>';
    }
    html += '</div>';
    $('timing').innerHTML = html; $('timing').hidden = false;
  }
  function renderTimes() {
    var runs = loadRuns(), html = '', any = false;
    var sessions = loadSessions();
    if (sessions.length) {
      any = true;
      html += '<div class="part"><h3><span>Runs \u00b7 time by part</span><b>' + sessions.length + (sessions.length === 1 ? ' run' : ' runs') + '</b></h3>';
      html += '<ul class="runs">' + sessions.slice().reverse().map(function (t, k) {
        var idx = sessions.length - 1 - k, dt = new Date(t.at), first = -1, last = -1;
        DATA.sections.forEach(function (sec, si) { if ((t.secs[si] || 0) >= 1) { if (first < 0) first = si; last = si; } });
        var range = first < 0 ? '' : first === last ? DATA.sections[first].short : DATA.sections[first].short.replace(/ \u00b7.*$/, '') + ' \u2192 ' + DATA.sections[last].short.replace(/ \u00b7.*$/, '');
        var when = dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + dt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        return '<li class="sess" data-sess="' + idx + '"><span>' + esc(when) + '<br><small>' + esc(range) + '</small></span><span class="mode ' + t.mode + '">' + t.mode + '</span><span class="d">' + mmss(t.total) + '</span><button data-del="' + idx + '" aria-label="Delete this run">\u00d7</button></li>';
      }).join('') + '</ul></div>';
    }
    DATA.sections.forEach(function (sec, si) {
      var list = runs[si] || [];
      if (!list.length) return; any = true;
      var best = Math.min.apply(null, list.map(function (r) { return r.s; }));
      var avg = list.reduce(function (a, r) { return a + r.s; }, 0) / list.length;
      var last = list[list.length - 1];
      html += '<div class="part"><h3><span>' + esc(sec.short) + '</span><b>' + list.length + (list.length === 1 ? ' run' : ' runs') + '</b></h3>';
      html += '<div class="stat"><div><div class="v">' + mmss(last.s) + '</div><div class="l">last</div></div>' +
              '<div><div class="v">' + mmss(best) + '</div><div class="l">best</div></div>' +
              '<div><div class="v">' + mmss(avg) + '</div><div class="l">average</div></div>' +
              '<div><div class="v">' + mmss(sec.words / 150 * 60) + '</div><div class="l">at 150 wpm</div></div></div>';
      html += '<ul class="runs">' + list.slice().reverse().map(function (r) {
        var idx = list.indexOf(r), dt = new Date(r.at);
        var when = dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + dt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        return '<li><span>' + esc(when) + '</span><span class="cov">' + r.cov + '%</span><span class="d">' + mmss(r.s) + '</span><button data-si="' + si + '" data-i="' + idx + '" aria-label="Delete this run">×</button></li>';
      }).join('') + '</ul></div>';
    });
    $('timesBody').innerHTML = any ? html : '<div class="empty">No saved runs yet. Hit Record, give the talk (or a part of it), then Stop: you get a report of how long each part took, and runs of ' + MIN_SAVE + ' seconds or more are kept here.</div>';
  }
  $('times').addEventListener('click', function () { renderTimes(); $('timesSheet').hidden = false; });
  $('timesClose').addEventListener('click', function () { $('timesSheet').hidden = true; });
  $('timesBody').addEventListener('click', function (e) {
    var del = e.target.closest('button[data-del]');
    if (del) {
      var ss = loadSessions(), t0 = ss[+del.dataset.del]; if (!t0) return;
      if (!confirm('Delete the ' + mmss(t0.total) + ' ' + t0.mode + ' run?')) return;
      ss.splice(+del.dataset.del, 1);
      try { localStorage.setItem(STORE + '-sessions', JSON.stringify(ss)); } catch (err) {}
      renderTimes(); return;
    }
    var row = e.target.closest('li[data-sess]');
    if (row) { var t1 = loadSessions()[+row.dataset.sess]; if (t1) { t1.total = t1.total; showReport(t1, t1.mode === 'live'); } return; }
    var b = e.target.closest('button[data-si]'); if (!b) return;
    var runs = loadRuns(), list = runs[b.dataset.si] || [];
    var r = list[+b.dataset.i]; if (!r) return;
    if (!confirm('Delete the ' + mmss(r.s) + ' run for ' + DATA.sections[+b.dataset.si].short + '?')) return;
    list.splice(+b.dataset.i, 1); if (!list.length) delete runs[b.dataset.si];
    saveRuns(runs); renderTimes();
  });

  /* ---------- Section stopwatch: how long each Part (and each slide) took, Live and Practice ---------- */
  var track = null, trackTimer = null;
  function cardOf(i) { for (var k = 0; k < DATA.cards.length; k++) if (i < DATA.cards[k].end) return k; return DATA.cards.length - 1; }
  function trackStart() {
    var here = Math.min(cursor, N - 1);
    track = { at: new Date().toISOString(), mode: practice ? 'practice' : 'live', t0: Date.now(), last: Date.now(),
              si: sectionOf(here), ci: cardOf(here), secs: {}, cards: {}, from: cursor, to: cursor };
    clearInterval(trackTimer); trackTimer = setInterval(trackTick, 1000);
    trackTick();
  }
  // Every second (and on stop) the time since the last tick goes to the Part and slide the cursor was in.
  function trackTick() {
    if (!track) return;
    var now = Date.now(), dt = (now - track.last) / 1000;
    track.secs[track.si] = (track.secs[track.si] || 0) + dt;
    track.cards[track.ci] = (track.cards[track.ci] || 0) + dt;
    track.last = now;
    var here = Math.min(cursor, N - 1);
    track.si = sectionOf(here); track.ci = cardOf(here);
    track.to = Math.max(track.to, cursor);
    clockEl.textContent = mmss((now - track.t0) / 1000) + ' \u00b7 ' + DATA.sections[track.si].short.replace(/^(Part \d|Tension \d).*$/, '$1') + ' ' + mmss(track.secs[track.si] || 0);
  }
  function trackStop() {
    clearInterval(trackTimer);
    if (!track) { clockEl.textContent = ''; return null; }
    trackTick(); var t = track; track = null; clockEl.textContent = '';
    t.total = (Date.now() - t.t0) / 1000;
    return t;
  }
  function loadSessions() { try { return JSON.parse(localStorage.getItem(STORE + '-sessions') || '[]') || []; } catch (e) { return []; } }
  function saveSession(t) {
    if (!t || t.total < MIN_SAVE) return false;
    var list = loadSessions();
    list.push({ at: t.at, mode: t.mode, total: Math.round(t.total), heard: t.heard || 0, from: t.from, to: t.to, secs: t.secs, cards: t.cards });
    while (list.length > 40) list.shift();
    try { localStorage.setItem(STORE + '-sessions', JSON.stringify(list)); } catch (e) {}
    return true;
  }
  function paceClass(s, target) { return !target ? '' : s > target * 1.1 ? 'slow' : s < target * 0.9 ? 'fast' : 'on'; }
  function sectionTable(t) {
    var html = '<table class="secs"><thead><tr><th>Part</th><th>time</th><th>split</th><th>vs 150 wpm</th></tr></thead><tbody>';
    var cum = 0, tgtTotal = 0, any = false;
    DATA.sections.forEach(function (sec, si) {
      var s = t.secs[si] || 0; if (s < 1) return; any = true;
      var cov = coverage(si, t.from, t.to), words = Math.round(sec.words * cov), target = words / 150 * 60;
      cum += s; tgtTotal += target;
      html += '<tr><td>' + esc(sec.short) + (cov < 0.9 ? ' <small>' + Math.round(cov * 100) + '% of it</small>' : '') + '</td>' +
              '<td class="d">' + mmss(s) + '</td><td class="d dim">' + mmss(cum) + '</td>' +
              '<td class="d ' + paceClass(s, target) + '">' + signed(s - target) + '</td></tr>';
      var slides = [];
      DATA.cards.forEach(function (c, ci) { if (c.section === si && (t.cards[ci] || 0) >= 1) slides.push({ c: c, s: t.cards[ci] }); });
      if (slides.length > 1) {
        html += '<tr class="detail"><td colspan="4"><details><summary>' + slides.length + ' slides in this part</summary><ul>' +
          slides.map(function (x) { return '<li><span>' + esc(x.c.title || 'Card ' + x.c.id) + '</span><span class="d">' + mmss(x.s) + '</span></li>'; }).join('') +
          '</ul></details></td></tr>';
      }
    });
    if (!any) return '';
    html += '</tbody><tfoot><tr><td>Total</td><td class="d">' + mmss(t.total) + '</td><td></td><td class="d ' + paceClass(t.total, tgtTotal) + '">' + signed(t.total - tgtTotal) + '</td></tr></tfoot></table>';
    return html;
  }
  function reportHTML(t) {
    var firstSi = -1, lastSi = -1, tgt = 0;
    DATA.sections.forEach(function (sec, si) {
      if ((t.secs[si] || 0) < 1) return;
      if (firstSi < 0) firstSi = si; lastSi = si;
      tgt += Math.round(sec.words * coverage(si, t.from, t.to)) / 150 * 60;
    });
    var range = firstSi < 0 ? '' : firstSi === lastSi ? DATA.sections[firstSi].short : DATA.sections[firstSi].short + ' \u2192 ' + DATA.sections[lastSi].short;
    var html = '<div class="timing"><div class="clock">' + mmss(t.total) + '</div><div><div class="t">' + esc(range || 'Run') + '</div><div class="s">';
    if (t.heard) html += '<b>' + t.heard + '</b> words heard, about <b>' + Math.round(60 * t.heard / t.total) + '</b> a minute. ';
    html += 'At 150 words a minute this stretch reads in about <b>' + mmss(tgt) + '</b>' +
            (tgt ? ' (<span class="' + (t.total > tgt ? 'down' : 'up') + '">' + signed(t.total - tgt) + '</span>)' : '') + '. ';
    html += '\u201cvs 150 wpm\u201d is how far each part ran over (+) or under (\u2212) that pace.</div></div></div>';
    html += sectionTable(t);
    return html;
  }
  function showReport(t, live) {
    $('repTitle').textContent = (live ? 'Live run' : 'Run') + ' \u00b7 ' + new Date(t.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + new Date(t.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    $('repBody').innerHTML = reportHTML(t) + (t.total < MIN_SAVE ? '<div class="empty">Under ' + MIN_SAVE + ' seconds, so this run was not saved.</div>' : '');
    $('report').hidden = false; $('repBody').scrollTop = 0;
  }
  $('repClose').addEventListener('click', function () { $('report').hidden = true; });
  $('repDone').addEventListener('click', function () { $('report').hidden = true; });

  function showResults(res, spokenWords, seconds, timingInfo, trk) {
    if (timingInfo) renderTiming(timingInfo); else $('timing').hidden = true;
    $('sections').innerHTML = trk ? sectionTable(trk) : '';
    $('scoreNum').textContent = res.score;
    $('scoreBox').className = 'score ' + tier(res.score);
    var wpm = seconds > 5 ? Math.round(60 * spokenWords / seconds) : 0;
    if (!res.n) {
      $('scoreT').textContent = 'No ideas to score in that stretch';
      $('scoreS').textContent = 'The run ended before the first idea past your starting point. Talk a little further next time.';
    } else {
      $('scoreT').textContent = res.covered + ' of ' + res.n + ' ideas covered' + (res.partial ? ', ' + res.partial + ' partly' : '');
      $('scoreS').textContent = (res.score >= 90 ? 'You have the flow. ' : res.score >= 75 ? 'Close. Look at the ideas marked below. ' : 'Run it again with the missed ideas in mind. ') +
        (wpm ? 'Pace: ' + wpm + ' words a minute.' : '');
    }
    $('spanNote').innerHTML = 'Scored from <b>“' + esc(excerpt(res.start, res.start + 6)) + '…”</b> through <b>“…' + esc(excerpt(res.end - 6, res.end)) + '”</b>';
    var html = '';
    res.groups.forEach(function (g) {
      html += '<div class="group"><h3>' + g.card.id + ' · ' + esc(g.card.title || 'Card ' + g.card.id) + '</h3><ul class="beats">';
      g.rows.forEach(function (r) {
        var mark = r.status === 'hit' ? '✓' : r.status === 'part' ? '◐' : '✗';
        html += '<li class="' + r.status + '"><span class="mark">' + mark + '</span><span class="label">' + esc(r.label) + '</span>';
        if (r.status !== 'hit') {
          html += '<span class="keys">' + r.hit.map(function (k) { return '<span class="k hit">' + esc(k) + '</span>'; }).join('') +
                  r.missed.map(function (k) { return '<span class="k miss">' + esc(k) + '</span>'; }).join('') + '</span>';
        }
        html += '</li>';
      });
      html += '</ul></div>';
    });
    $('groups').innerHTML = html;
    $('results').hidden = false;
    $('results').querySelector('.body').scrollTop = 0;
  }
  $('resClose').addEventListener('click', function () { $('results').hidden = true; });
  $('resDone').addEventListener('click', function () { $('results').hidden = true; });
  $('again').addEventListener('click', function () {
    $('results').hidden = true;
    committed = practiceStart;
    setCursor(practiceStart, { jump: true });
    setMark(practiceStart);
    startListening();
  });

  /* ---------- Speech recognition ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, committed = 0, finalCount = 0, wakeLock = null;
  var finals = [], interimText = '', startedAt = 0, recentFinal = [], resyncTimer = null;
  function noteResync(words) {
    setMic('re-synced ' + words + ' words ahead', 'warn');
    clearTimeout(resyncTimer);
    resyncTimer = setTimeout(function () { if (listening) setMic('listening', 'live'); }, 1800);
  }

  function setMic(text, cls) { micEl.textContent = text; micEl.className = cls || ''; }

  function startRec() {
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';
    rec.maxAlternatives = 1;
    finalCount = 0;
    rec.onstart = function () { setMic('listening', 'live'); };
    rec.onresult = function (e) {
      var interim = [], jumped = 0;
      for (var i = finalCount; i < e.results.length; i++) {
        var r = e.results[i];
        var txt = r[0].transcript.trim();
        var words = txt.split(/\s+/);
        if (r.isFinal) {
          var res = advance(committed, words, recentFinal);
          committed = res.cur; recentFinal = res.seq; jumped += res.jumped;
          finalCount = i + 1; if (txt) finals.push(txt);
        }
        else { interim = interim.concat(words); }
      }
      interimText = interim.join(' ');
      var live = advance(committed, interim, recentFinal);
      var shown = live.cur; jumped += live.jumped;
      if (jumped) noteResync(jumped);
      var lastRes = e.results[e.results.length - 1];
      var heard = lastRes ? lastRes[0].transcript.trim().split(/\s+/).slice(-6).join(' ') : '';
      heardEl.textContent = heard;
      if (shown !== cursor) setCursor(shown);
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        listening = false;
        stopRec(); trackStop();
        setMic('mic blocked: allow microphone access for this page', 'warn');
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        setMic('mic hiccup (' + e.error + '), retrying', 'warn');
      }
    };
    rec.onend = function () {
      if (interimText) { finals.push(interimText); interimText = ''; }
      if (listening) { setTimeout(function () { if (listening) { try { startRec(); } catch (err) {} } }, 200); }
      else setMic('mic off');
    };
    rec.start();
  }
  function stopRec() {
    if (rec) { try { rec.onend = null; rec.stop(); } catch (e) {} rec = null; }
    if (interimText) { finals.push(interimText); interimText = ''; }
    recBtn.classList.remove('on');
    recBtn.setAttribute('aria-pressed', 'false');
    recLabel.textContent = 'Record';
    setMic('mic off');
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  function requestWake() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && listening) requestWake();
  });
  function startListening() {
    if (!SR) { $('nosupport').hidden = false; return; }
    listening = true;
    committed = cursor;
    if (practice) setMark(cursor);
    finals = []; interimText = ''; startedAt = Date.now(); recentFinal = [];
    trackStart();
    recBtn.classList.add('on');
    recBtn.setAttribute('aria-pressed', 'true');
    recLabel.textContent = practice ? 'Stop & score' : 'Listening';
    setMic('starting mic…');
    requestWake();
    try { startRec(); } catch (e) { setMic('could not start mic', 'warn'); }
  }
  recBtn.addEventListener('click', function () {
    if (listening) {
      listening = false;
      stopRec();
      var trk = trackStop();
      var spoken = finals.join(' ');
      var words = spoken.split(/\s+/).filter(Boolean).length;
      if (trk) trk.heard = words;
      if (!practice) {                         // Live: report how long every part took
        if (trk) { saveSession(trk); showReport(trk, true); }
        return;
      }
      if (!words) { setMic('nothing heard, so nothing to score', 'warn'); return; }
      // The run reaches wherever the follower got to, or as far as the word count says if it lost you.
      var end = Math.min(N, Math.max(cursor, practiceStart + Math.round(words * 0.9)));
      var seconds = (Date.now() - startedAt) / 1000;
      var res = scoreSpan(practiceStart, end, spoken);
      if (trk) { trk.to = Math.max(trk.to, end); saveSession(trk); }
      showResults(res, words, seconds, recordRun(practiceStart, end, seconds, words, res.score), trk);
      return;
    }
    startListening();
  });

  $('back').addEventListener('click', function () {
    var i = sentenceStart(cursor - 1);
    if (cursor - i < 2) i = sentenceStart(i - 1);
    committed = Math.max(0, i);
    setCursor(committed);
    if (practice && !listening) setMark(committed);
  });
  $('restart').addEventListener('click', function () {
    if (practice) { committed = practiceStart; setCursor(practiceStart, { jump: true }); return; }
    if (cursor > 0 && !confirm('Go back to the top of the keynote?')) return;
    committed = 0;
    setCursor(0, { jump: true });
  });

  /* ---------- Text size ---------- */
  var size = 30;
  try { size = +localStorage.getItem(STORE + '-size') || 30; } catch (e) {}
  function applySize() {
    document.documentElement.style.setProperty('--size', size + 'px');
    try { localStorage.setItem(STORE + '-size', String(size)); } catch (e) {}
    requestAnimationFrame(function () { scrollToCursor(true); });
  }
  $('bigger').addEventListener('click', function () { size = Math.min(56, size + 3); applySize(); });
  $('smaller').addEventListener('click', function () { size = Math.max(18, size - 3); applySize(); });
  $('dismiss').addEventListener('click', function () { $('nosupport').hidden = true; });

  /* ---------- Boot ---------- */
  applySize();
  var mode = 'live';
  try { mode = localStorage.getItem(STORE + '-mode') || 'live'; } catch (e) {}
  setMode(mode === 'practice');
  if (!SR) setMic('this browser cannot listen; tap sentences to advance', 'warn');
  window.addEventListener('resize', function () { scrollToCursor(true); });
  window.DoorPrompter = { trackStart: trackStart, trackStop: trackStop, showReport: showReport, reportHTML: reportHTML, loadSessions: loadSessions, scoreSpan: scoreSpan, showResults: showResults, beats: beats, tokens: tokens, sentenceStart: sentenceStart, advance: advance, resyncLimit: resyncLimit, recordRun: recordRun, sectionOf: sectionOf, loadRuns: loadRuns, mmss: mmss, sections: DATA.sections };
})();
</script>
</body>
