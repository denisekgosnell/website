<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Voice-following teleprompter for the Duality of AI keynote. Live mode follows your words through the whole talk; Practice mode scores any stretch you run, starting from whatever sentence you tap.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Hold the Door Prompter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #0b0d12;
    --panel: #12151d;
    --raised: #1a1e29;
    --line: #232837;
    --ink: #d9dde8;
    --ink-past: #4b5264;
    --ink-cue: #6b7a99;
    --amber: #ffc857;
    --amber-deep: #f2a93b;
    --record: #e2503c;
    --slide: #ff2d95;
    --ok: #5ec48a;
    --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    --size: 30px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; width: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  #app { height: 100vh; height: 100dvh; width: 100%; min-width: 0; overflow: hidden; display: grid; grid-template-rows: auto auto 1fr; }

  /* Top bar */
  header {
    min-width: 0; max-width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding-top: max(10px, env(safe-area-inset-top));
  }
  button {
    font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 13px; cursor: pointer; font-size: 15px; line-height: 1;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; white-space: nowrap;
  }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button:active { background: var(--raised); }
  #rec {
    display: inline-flex; align-items: center; gap: 9px; font-weight: 700;
    border-color: var(--record); color: var(--record); padding: 10px 16px;
  }
  #rec .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--record); }
  #rec.on { background: var(--record); color: #fff; }
  #rec.on .dot { background: #fff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .45; transform: scale(.7);} }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 9px 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active { background: var(--amber); color: #1a1405; font-weight: 700; }
  .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-deep); border: 1px solid var(--amber-deep); border-radius: 999px; padding: 6px 10px; }
  #hide.active { background: var(--raised); border-color: var(--amber-deep); color: var(--amber); }

  #status {
    min-width: 0; max-width: 100%;
    font-family: var(--mono); font-size: 12px; color: var(--ink-cue); line-height: 1.3;
    padding: 7px 14px 9px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; gap: 14px; align-items: baseline; white-space: nowrap; overflow: hidden;
  }
  #status #mic { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #status .live { color: var(--ok); }
  #status .warn { color: var(--amber-deep); }
  #heard { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--ink); opacity: .7; }
  #pct { font-variant-numeric: tabular-nums; }
  #clock { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: var(--amber); }
  #clock:empty { display: none; }

  /* Script body */
  main#scroller { overflow-y: auto; overflow-x: hidden; position: relative; min-width: 0; max-width: 100%; -webkit-overflow-scrolling: touch; }
  #text {
    position: relative; padding: 26vh 12px 60vh; width: 100%; max-width: min(100%, 42em); margin: 0 auto;
    font-size: var(--size); line-height: 1.5; font-weight: 400;
    overflow-wrap: anywhere;
  }
  #text .p { margin: 0 0 .8em; }
  #text .cue {
    font-family: var(--mono); font-size: .48em; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-cue); margin: 1.6em 0 .9em; line-height: 1.4;
  }
  #text .cue.part { color: var(--amber-deep); border-top: 1px solid var(--line); padding-top: 1.2em; margin-top: 2.4em; }
  #text .cue.card { font-size: .42em; color: var(--ink-cue); margin: 1.4em 0 .8em; text-transform: none; letter-spacing: .02em; }
  /* Slide-change marker: a bright bar across the whole screen so it can't be missed at a glance */
  #text .cue.slide {
    display: block; width: 100vw; margin: 1.3em 0 .9em calc(50% - 50vw); padding: .4em 16px;
    font-size: .6em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: center;
    color: #fff; background: var(--slide); border-top: 5px solid #fff; border-bottom: 5px solid #fff;
    box-shadow: 0 0 28px rgba(255,45,149,.55); overflow-wrap: normal;
  }
  #text .cue.slide .lbl { display: block; font-weight: 400; letter-spacing: .04em; text-transform: none; font-size: .85em; opacity: .95; margin-top: .15em; }
  #text .cue.inline { display: inline; margin: 0; padding: .1em .45em; border: 1px solid var(--line); border-radius: 6px; text-transform: none; letter-spacing: 0; }
  #text.practice .w.mark { box-shadow: inset 0 -3px 0 var(--amber-deep); }
  .w {
    display: inline-block; cursor: pointer; border-radius: .18em; padding: 0 .04em;
    transition: color .25s ease, transform .25s ease, text-shadow .25s ease, filter .3s ease;
    transform-origin: center bottom;
  }
  .w.past { color: var(--ink-past); }
  .w.up { color: var(--amber); font-weight: 700; }
  .w.hot { color: #fff; transform: scale(1.03); text-shadow: 0 0 16px rgba(255,200,87,.6); }
  #text.blur .w { filter: blur(7px); }
  #text.blur .w.hot { filter: blur(4px); }
  #text.blur .cue { filter: none; }

  /* Sheets: picker and results */
  .sheet {
    position: fixed; inset: 0; background: rgba(6,8,12,.78); display: grid; align-items: end; z-index: 20;
  }
  .sheet .panel {
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
    max-height: 88vh; max-height: 88dvh; display: flex; flex-direction: column;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .sheet .head {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .sheet .head h2 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; }
  .sheet .body { overflow-y: auto; padding: 8px 12px 12px; -webkit-overflow-scrolling: touch; }
  .sheet .foot { display: flex; gap: 8px; padding: 10px 12px 0; flex-wrap: wrap; }
  .sheet .foot button { flex: 1; padding: 12px 14px; }
  .sheet .foot button.primary { background: var(--amber); color: #1a1405; border-color: var(--amber); font-weight: 700; }
  .x { width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 18px; line-height: 1; }


  .timing { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 6px 4px 14px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .timing .clock { font-family: var(--mono); font-size: 46px; font-weight: 500; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--amber); }
  .timing .clock.short { color: var(--ink-cue); }
  .timing .t { font-size: 15px; font-weight: 700; }
  .timing .s { font-size: 13px; color: var(--ink-cue); margin-top: 3px; line-height: 1.45; }
  .timing .s b { color: var(--ink); font-weight: 400; }
  .timing .s .up { color: var(--ok); } .timing .s .down { color: var(--record); }
  .hist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .hist span { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--raised); color: var(--ink-cue); font-variant-numeric: tabular-nums; }
  .hist span.now { color: var(--amber); border: 1px solid var(--amber-deep); }
  .hist span.best { color: var(--ok); }
  .part { margin: 8px 0 16px; }
  .part h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-cue); margin: 0 0 6px 4px; display: flex; justify-content: space-between; gap: 8px; }
  .part h3 b { color: var(--ink); font-weight: 500; text-transform: none; letter-spacing: 0; }
  .stat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .stat div { background: var(--raised); border-radius: 8px; padding: 8px 6px; text-align: center; }
  .stat .v { font-family: var(--mono); font-size: 16px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .stat .l { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-cue); margin-top: 3px; }
  .runs { list-style: none; margin: 0; padding: 0; }
  .runs li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-cue); }
  .runs li:nth-child(odd) { background: var(--raised); }
  .runs li .d { font-family: var(--mono); font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .runs li .cov { font-family: var(--mono); font-size: 11px; }
  .runs li button { padding: 4px 9px; font-size: 13px; border-color: transparent; color: var(--ink-cue); }
  .empty { color: var(--ink-cue); font-size: 14px; padding: 20px 8px; text-align: center; }
  /* Section stopwatch report */
  .secs { width: 100%; border-collapse: collapse; font-size: 14px; margin: 4px 0 12px; }
  .secs th { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-cue); text-align: right; padding: 4px 8px; font-weight: 400; }
  .secs th:first-child, .secs td:first-child { text-align: left; }
  .secs td { padding: 8px; border-top: 1px solid var(--line); text-align: right; vertical-align: top; }
  .secs td small { color: var(--ink-cue); font-size: 11px; }
  .secs .d { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  .secs .dim { color: var(--ink-cue); }
  .secs .slow { color: var(--amber-deep); } .secs .on { color: var(--ok); } .secs .fast { color: var(--ink-cue); }
  .secs tr.detail td { border-top: 0; padding: 0 8px 8px; text-align: left; }
  .secs details summary { cursor: pointer; font-size: 12px; color: var(--ink-cue); }
  .secs details ul { list-style: none; margin: 6px 0 0; padding: 0; }
  .secs details li { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-cue); padding: 3px 0 3px 10px; }
  .secs tfoot td { font-weight: 700; border-top: 2px solid var(--line); }
  .runs li.sess { cursor: pointer; }
  .runs li .mode { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--panel); }
  .runs li .mode.live { color: var(--record); }
  .score { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 8px 4px 14px; }
  .score .big {
    font-size: 54px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .score .big small { font-size: 22px; font-weight: 400; color: var(--ink-cue); }
  .score.good .big { color: var(--ok); } .score.mid .big { color: var(--amber); } .score.low .big { color: var(--record); }
  .score .t { font-size: 16px; font-weight: 700; }
  .score .s { font-size: 13px; color: var(--ink-cue); margin-top: 3px; line-height: 1.4; }
  .span { font-size: 13px; color: var(--ink-cue); line-height: 1.45; padding: 0 4px 12px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .span b { color: var(--ink); font-weight: 400; }
  .group { margin: 6px 0 14px; }
  .group h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-cue); margin: 0 0 6px 4px; }
  .beats { list-style: none; margin: 0; padding: 0; }
  .beats li {
    display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 10px; border-radius: 10px; margin-bottom: 5px;
    font-size: 15px; line-height: 1.4; background: var(--raised);
  }
  .beats li .mark { font-weight: 700; text-align: center; }
  .beats li.hit { border-left: 3px solid var(--ok); } .beats li.hit .mark { color: var(--ok); }
  .beats li.part { border-left: 3px solid var(--amber); } .beats li.part .mark { color: var(--amber); }
  .beats li.miss { border-left: 3px solid var(--record); } .beats li.miss .mark { color: var(--record); }
  .beats li.miss .label, .beats li.part .label { color: var(--ink); }
  .beats li.hit .label { color: var(--ink-past); }
  .beats .keys { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .beats .k { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--panel); color: var(--ink-cue); }
  .beats .k.hit { color: var(--ok); } .beats .k.miss { color: var(--record); text-decoration: line-through; }

  #nosupport {
    position: fixed; inset: 0; background: rgba(11,13,18,.94); display: grid; place-items: center; padding: 30px; text-align: center;
    font-size: 18px; line-height: 1.5; z-index: 30;
  }
  #nosupport code { font-family: var(--mono); color: var(--amber); }

  @media (prefers-reduced-motion: reduce) {
    .w { transition: none; }
    #rec.on .dot { animation: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="rec" aria-pressed="false"><span class="dot"></span><span id="reclabel">Record</span></button>
    <span class="seg" role="group" aria-label="Mode">
      <button id="modeLive" class="active">Live</button>
      <button id="modePractice">Practice</button>
    </span>
    <span id="variant" class="tag" hidden></span>
    <button id="hide" hidden aria-pressed="false">Hide words</button>
    <button id="times">Times</button>
    <button id="back" title="Back one sentence">◂ Sentence</button>
    <span class="spacer"></span>
    <span class="seg">
      <button id="smaller" aria-label="Smaller text">A−</button>
      <button id="bigger" aria-label="Larger text">A+</button>
    </span>
    <button id="restart">Restart</button>
  </header>
  <div id="status">
    <span id="mic">mic off</span>
    <span id="heard"></span>
    <span id="clock"></span>
    <span id="pct">0%</span>
  </div>
  <main id="scroller"><div id="text"></div></main>
</div>

<div id="results" class="sheet" hidden>
  <div class="panel">
    <div class="head"><h2 id="resTitle">Practice score</h2><button class="x" id="resClose" aria-label="Close">×</button></div>
    <div class="body">
      <div class="timing" id="timing" hidden></div>
      <div id="sections"></div>
      <div class="score" id="scoreBox">
        <div class="big"><span id="scoreNum">0</span><small>%</small></div>
        <div><div class="t" id="scoreT"></div><div class="s" id="scoreS"></div></div>
      </div>
      <div class="span" id="spanNote"></div>
      <div id="groups"></div>
    </div>
    <div class="foot">
      <button id="again" class="primary">Run it again from the same spot</button>
      <button id="resDone">Done</button>
    </div>
  </div>
</div>

<div id="report" class="sheet" hidden>
  <div class="panel">
    <div class="head"><h2 id="repTitle">Run report</h2><button class="x" id="repClose" aria-label="Close">×</button></div>
    <div class="body" id="repBody"></div>
    <div class="foot"><button id="repDone" class="primary">Done</button></div>
  </div>
</div>

<div id="timesSheet" class="sheet" hidden>
  <div class="panel">
    <div class="head"><h2>Your times</h2><button class="x" id="timesClose" aria-label="Close">×</button></div>
    <div class="body" id="timesBody"></div>
  </div>
</div>

<div id="nosupport" hidden>
  <div>
    <p><strong>This browser can't listen.</strong></p>
    <p>Speech recognition works in <code>Chrome</code>, <code>Edge</code>, or <code>Safari</code> on iPhone and Mac. Open this link in one of those. You can still tap any sentence to move the prompter by hand.</p>
    <p><button id="dismiss">Continue without listening</button></p>
  </div>
</div>

<script>__TEXTMATCH_JS__</script>
<script>
(function () {
  'use strict';
  var DATA = __KEYNOTE_DATA__;
  var STORE = 'door-prompter' + (DATA.variant ? '-' + DATA.variant : '');
  if (DATA.variantLabel) {
    document.title += ' · ' + DATA.variantLabel;
    var tag = document.getElementById('variant'); tag.textContent = DATA.variantLabel; tag.hidden = false;
  }
  var T = window.KeynoteText;
  var $ = function (id) { return document.getElementById(id); };
  var textEl = $('text'), scroller = $('scroller');
  var recBtn = $('rec'), recLabel = $('reclabel'), micEl = $('mic'), heardEl = $('heard'), pctEl = $('pct'), clockEl = $('clock');

  /* ---------- Build the script from the keynote data ---------- */
  var tokens = [];   // { norm, raw, el, end, para }
  var paraCount = 0; // paragraph index, so re-sync can be capped at "one paragraph ahead"
  function normalize(w) {
    return w.toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]/g, '');
  }
  function addWords(container, chunk) {
    var span = document.createElement('span');
    span.className = 'w';
    span.textContent = chunk;
    var parts = chunk.split(/[—–\-…]+|\.\.\./);
    var first = tokens.length;
    parts.forEach(function (p) {
      var n = normalize(p);
      if (n) tokens.push({ norm: n, raw: p, el: span, end: false, para: paraCount });
    });
    if (tokens.length > first) {
      if (/[.?!…]["”’)]*$/.test(chunk)) tokens[tokens.length - 1].end = true;
      span.dataset.i = first;
    } else {
      span.className = 'w past';
    }
    container.appendChild(span);
    container.appendChild(document.createTextNode(' '));
  }
  function addParagraph(container, line) {
    var t = line.trim();
    if (!t) return;
    if (/^\[.*\]$/.test(t)) {
      var c = document.createElement('div');
      c.className = 'cue';
      c.textContent = t;
      if (/slide/i.test(t)) {              // [NEXT SLIDE], [SLIDE: ...] -> full-width slide-change bar
        c.className = 'cue slide';
        c.textContent = '\u25B6 NEW SLIDE \u25B6';
        var d = document.createElement('span'); d.className = 'lbl'; d.textContent = t; c.appendChild(d);
      }
      container.appendChild(c);
      return;
    }
    var p = document.createElement('p');
    p.className = 'p';
    paraCount++;
    var segs = t.split(/(\[[^\]]*\])/);
    segs.forEach(function (seg, si) {
      if (!seg) return;
      if (/^\[[^\]]*\]$/.test(seg)) {
        var c = document.createElement('span');
        c.className = 'cue inline';
        c.textContent = seg;
        p.appendChild(c);
        // punctuation right after a cue stays attached to it: "[SLIDE]." not "[SLIDE] ."
        var next = (segs[si + 1] || '').replace(/^\s+/, '');
        if (!/^[.,;:?!]/.test(next)) p.appendChild(document.createTextNode(' '));
      } else {
        seg.trim().split(/\s+/).forEach(function (chunk) { if (chunk) addWords(p, chunk); });
      }
    });
    container.appendChild(p);
  }
  DATA.sections.forEach(function (sec, si) {
    var h = document.createElement('div');
    h.className = 'cue part';
    h.textContent = sec.title;
    textEl.appendChild(h);
    DATA.cards.filter(function (c) { return c.section === si; }).forEach(function (card) {
      var wrap = document.createElement('div');
      wrap.className = 'card';
      var label = document.createElement('div');
      if (/^Slide \d/.test(card.title || '')) {   // one card per slide: the card label IS the slide change
        label.className = 'cue slide';
        label.textContent = '\u25B6 NEW SLIDE \u25B6';
        var sl = document.createElement('span'); sl.className = 'lbl'; sl.textContent = card.title; label.appendChild(sl);
      } else {
        label.className = 'cue card';
        label.textContent = card.id + ' · ' + (card.title || 'Card ' + card.id);
      }
      wrap.appendChild(label);
      card.start = tokens.length;
      card.paragraphs.forEach(function (p) { addParagraph(wrap, p); });
      card.end = tokens.length;
      textEl.appendChild(wrap);
    });
  });
  var N = tokens.length;
  // Token range of each section (Part), for timing a practice run against the Part it was in.
  DATA.sections.forEach(function (sec, si) {
    var cs = DATA.cards.filter(function (c) { return c.section === si; });
    sec.first = cs.length ? cs[0].start : 0; sec.last = cs.length ? cs[cs.length - 1].end : 0;
  });
  function sectionOf(i) {
    for (var k = 0; k < DATA.sections.length; k++) if (i < DATA.sections[k].last) return k;
    return DATA.sections.length - 1;
  }
  // The last token of a paragraph always closes a sentence, even without punctuation.
  DATA.cards.forEach(function (c) { if (c.end > c.start) tokens[c.end - 1].end = true; });

  /* ---------- Where each idea beat sits in the text ---------- */
  // Every token gets the same stem the scorer uses, so a beat's first key phrase can be located.
  var stems = tokens.map(function (t) { var b = T.basicTokens(t.raw); return T.stem(b.length ? b[0] : t.norm); });
  function findPhrase(phrase, from, to) {
    var ph = T.prepareSpoken(phrase).map(T.stem);
    if (!ph.length) return -1;

      tgt += Math.round(sec.words * coverage(si, t.from, t.to)) / 150 * 60;
    });
    var range = firstSi < 0 ? '' : firstSi === lastSi ? DATA.sections[firstSi].short : DATA.sections[firstSi].short + ' \u2192 ' + DATA.sections[lastSi].short;
    var html = '<div class="timing"><div class="clock">' + mmss(t.total) + '</div><div><div class="t">' + esc(range || 'Run') + '</div><div class="s">';
    if (t.heard) html += '<b>' + t.heard + '</b> words heard, about <b>' + Math.round(60 * t.heard / t.total) + '</b> a minute. ';
    html += 'At 150 words a minute this stretch reads in about <b>' + mmss(tgt) + '</b>' +
            (tgt ? ' (<span class="' + (t.total > tgt ? 'down' : 'up') + '">' + signed(t.total - tgt) + '</span>)' : '') + '. ';
    html += '\u201cvs 150 wpm\u201d is how far each part ran over (+) or under (\u2212) that pace.</div></div></div>';
    html += sectionTable(t);
    return html;
  }
  function showReport(t, live) {
    $('repTitle').textContent = (live ? 'Live run' : 'Run') + ' \u00b7 ' + new Date(t.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + new Date(t.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    $('repBody').innerHTML = reportHTML(t) + (t.total < MIN_SAVE ? '<div class="empty">Under ' + MIN_SAVE + ' seconds, so this run was not saved.</div>' : '');
    $('report').hidden = false; $('repBody').scrollTop = 0;
  }
  $('repClose').addEventListener('click', function () { $('report').hidden = true; });
  $('repDone').addEventListener('click', function () { $('report').hidden = true; });

  function showResults(res, spokenWords, seconds, timingInfo, trk) {
    if (timingInfo) renderTiming(timingInfo); else $('timing').hidden = true;
    $('sections').innerHTML = trk ? sectionTable(trk) : '';
    $('scoreNum').textContent = res.score;
    $('scoreBox').className = 'score ' + tier(res.score);
    var wpm = seconds > 5 ? Math.round(60 * spokenWords / seconds) : 0;
    if (!res.n) {
      $('scoreT').textContent = 'No ideas to score in that stretch';
      $('scoreS').textContent = 'The run ended before the first idea past your starting point. Talk a little further next time.';
    } else {
      $('scoreT').textContent = res.covered + ' of ' + res.n + ' ideas covered' + (res.partial ? ', ' + res.partial + ' partly' : '');
      $('scoreS').textContent = (res.score >= 90 ? 'You have the flow. ' : res.score >= 75 ? 'Close. Look at the ideas marked below. ' : 'Run it again with the missed ideas in mind. ') +
        (wpm ? 'Pace: ' + wpm + ' words a minute.' : '');
    }
    $('spanNote').innerHTML = 'Scored from <b>“' + esc(excerpt(res.start, res.start + 6)) + '…”</b> through <b>“…' + esc(excerpt(res.end - 6, res.end)) + '”</b>';
    var html = '';
    res.groups.forEach(function (g) {
      html += '<div class="group"><h3>' + g.card.id + ' · ' + esc(g.card.title || 'Card ' + g.card.id) + '</h3><ul class="beats">';
      g.rows.forEach(function (r) {
        var mark = r.status === 'hit' ? '✓' : r.status === 'part' ? '◐' : '✗';
        html += '<li class="' + r.status + '"><span class="mark">' + mark + '</span><span class="label">' + esc(r.label) + '</span>';
        if (r.status !== 'hit') {
          html += '<span class="keys">' + r.hit.map(function (k) { return '<span class="k hit">' + esc(k) + '</span>'; }).join('') +
                  r.missed.map(function (k) { return '<span class="k miss">' + esc(k) + '</span>'; }).join('') + '</span>';
        }
        html += '</li>';
      });
      html += '</ul></div>';
    });
    $('groups').innerHTML = html;
    $('results').hidden = false;
    $('results').querySelector('.body').scrollTop = 0;
  }
  $('resClose').addEventListener('click', function () { $('results').hidden = true; });
  $('resDone').addEventListener('click', function () { $('results').hidden = true; });
  $('again').addEventListener('click', function () {
    $('results').hidden = true;
    committed = practiceStart;
    setCursor(practiceStart, { jump: true });
    setMark(practiceStart);
    startListening();
  });

  /* ---------- Speech recognition ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, committed = 0, finalCount = 0, wakeLock = null;
  var finals = [], interimText = '', startedAt = 0, recentFinal = [], resyncTimer = null;
  function noteResync(words) {
    setMic('re-synced ' + words + ' words ahead', 'warn');
    clearTimeout(resyncTimer);
    resyncTimer = setTimeout(function () { if (listening) setMic('listening', 'live'); }, 1800);
  }

  function setMic(text, cls) { micEl.textContent = text; micEl.className = cls || ''; }

  function startRec() {
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';
    rec.maxAlternatives = 1;
    finalCount = 0;
    rec.onstart = function () { setMic('listening', 'live'); };
    rec.onresult = function (e) {
      var interim = [], jumped = 0;
      for (var i = finalCount; i < e.results.length; i++) {
        var r = e.results[i];
        var txt = r[0].transcript.trim();
        var words = txt.split(/\s+/);
        if (r.isFinal) {
          var res = advance(committed, words, recentFinal);
          committed = res.cur; recentFinal = res.seq; jumped += res.jumped;
          finalCount = i + 1; if (txt) finals.push(txt);
        }
        else { interim = interim.concat(words); }
      }
      interimText = interim.join(' ');
      var live = advance(committed, interim, recentFinal);
      var shown = live.cur; jumped += live.jumped;
      if (jumped) noteResync(jumped);
      var lastRes = e.results[e.results.length - 1];
      var heard = lastRes ? lastRes[0].transcript.trim().split(/\s+/).slice(-6).join(' ') : '';
      heardEl.textContent = heard;
      if (shown !== cursor) setCursor(shown);
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        listening = false;
        stopRec(); trackStop();
        setMic('mic blocked: allow microphone access for this page', 'warn');
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        setMic('mic hiccup (' + e.error + '), retrying', 'warn');
      }
    };
    rec.onend = function () {
      if (interimText) { finals.push(interimText); interimText = ''; }
      if (listening) { setTimeout(function () { if (listening) { try { startRec(); } catch (err) {} } }, 200); }
      else setMic('mic off');
    };
    rec.start();
  }
  function stopRec() {
    if (rec) { try { rec.onend = null; rec.stop(); } catch (e) {} rec = null; }
    if (interimText) { finals.push(interimText); interimText = ''; }
    recBtn.classList.remove('on');
    recBtn.setAttribute('aria-pressed', 'false');
    recLabel.textContent = 'Record';
    setMic('mic off');
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  function requestWake() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && listening) requestWake();
  });
  function startListening() {
    if (!SR) { $('nosupport').hidden = false; return; }
    listening = true;
    committed = cursor;
    if (practice) setMark(cursor);
    finals = []; interimText = ''; startedAt = Date.now(); recentFinal = [];
    trackStart();
    recBtn.classList.add('on');
    recBtn.setAttribute('aria-pressed', 'true');
    recLabel.textContent = practice ? 'Stop & score' : 'Listening';
    setMic('starting mic…');
    requestWake();
    try { startRec(); } catch (e) { setMic('could not start mic', 'warn'); }
  }
  recBtn.addEventListener('click', function () {
    if (listening) {
      listening = false;
      stopRec();
      var trk = trackStop();
      var spoken = finals.join(' ');
      var words = spoken.split(/\s+/).filter(Boolean).length;
      if (trk) trk.heard = words;
      if (!practice) {                         // Live: report how long every part took
        if (trk) { saveSession(trk); showReport(trk, true); }
        return;
      }
      if (!words) { setMic('nothing heard, so nothing to score', 'warn'); return; }
      // The run reaches wherever the follower got to, or as far as the word count says if it lost you.
      var end = Math.min(N, Math.max(cursor, practiceStart + Math.round(words * 0.9)));
      var seconds = (Date.now() - startedAt) / 1000;
      var res = scoreSpan(practiceStart, end, spoken);
      if (trk) { trk.to = Math.max(trk.to, end); saveSession(trk); }
      showResults(res, words, seconds, recordRun(practiceStart, end, seconds, words, res.score), trk);
      return;
    }
    startListening();
  });

  $('back').addEventListener('click', function () {
    var i = sentenceStart(cursor - 1);
    if (cursor - i < 2) i = sentenceStart(i - 1);
    committed = Math.max(0, i);
    setCursor(committed);
    if (practice && !listening) setMark(committed);
  });
  $('restart').addEventListener('click', function () {
    if (practice) { committed = practiceStart; setCursor(practiceStart, { jump: true }); return; }
    if (cursor > 0 && !confirm('Go back to the top of the keynote?')) return;
    committed = 0;
    setCursor(0, { jump: true });
  });

  /* ---------- Text size ---------- */
  var size = 30;
  try { size = +localStorage.getItem(STORE + '-size') || 30; } catch (e) {}
  function applySize() {
    document.documentElement.style.setProperty('--size', size + 'px');
    try { localStorage.setItem(STORE + '-size', String(size)); } catch (e) {}
    requestAnimationFrame(function () { scrollToCursor(true); });
  }
  $('bigger').addEventListener('click', function () { size = Math.min(56, size + 3); applySize(); });
  $('smaller').addEventListener('click', function () { size = Math.max(18, size - 3); applySize(); });
  $('dismiss').addEventListener('click', function () { $('nosupport').hidden = true; });

  /* ---------- Boot ---------- */
  applySize();
  var mode = 'live';
  try { mode = localStorage.getItem(STORE + '-mode') || 'live'; } catch (e) {}
  setMode(mode === 'practice');
  if (!SR) setMic('this browser cannot listen; tap sentences to advance', 'warn');
  window.addEventListener('resize', function () { scrollToCursor(true); });
  window.DoorPrompter = { trackStart: trackStart, trackStop: trackStop, showReport: showReport, reportHTML: reportHTML, loadSessions: loadSessions, scoreSpan: scoreSpan, showResults: showResults, beats: beats, tokens: tokens, sentenceStart: sentenceStart, advance: advance, resyncLimit: resyncLimit, recordRun: recordRun, sectionOf: sectionOf, loadRuns: loadRuns, mmss: mmss, sections: DATA.sections };
})();
</script>
</body>
</html>
